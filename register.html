<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MHVwork — Account aanmaken</title>
<meta name="theme-color" content="#0d0d1a">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updatePassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDqwDEf35KoH2850xFHZ6gN9ROwgcx0Kyw",
  authDomain: "mhvwork-2376d.firebaseapp.com",
  projectId: "mhvwork-2376d",
  storageBucket: "mhvwork-2376d.firebasestorage.app",
  messagingSenderId: "292563349134",
  appId: "1:292563349134:web:6897c6e23536baf56ba3df"
};


  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  window._reg = { auth, db, createUserWithEmailAndPassword, signInWithEmailAndPassword, updatePassword, doc, getDoc, setDoc, updateDoc, serverTimestamp };

  // Load invite on page load
  window.addEventListener('DOMContentLoaded', async () => {
    const params = new URLSearchParams(window.location.search);
    const inviteId = params.get('invite');
    if (!inviteId) { showError('Geen geldige uitnodigingslink.'); return; }

    try {
      const snap = await getDoc(doc(db, 'invites', inviteId));
      if (!snap.exists()) { showError('Uitnodiging niet gevonden.'); return; }
      const data = snap.data();
      if (data.used) { showError('Deze uitnodigingslink is al gebruikt.'); return; }

      window._inviteId = inviteId;
      window._inviteData = data;

      document.getElementById('welcomeName').textContent = data.name;
      document.getElementById('emailDisplay').textContent = data.email;
      document.getElementById('loader').style.display = 'none';
      document.getElementById('formWrap').style.display = 'block';
    } catch(e) {
      showError('Er ging iets mis bij het laden. Probeer opnieuw.');
      console.error(e);
    }
  });
</script>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;}
body{background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;}

/* ── Layout ── */
.wrap{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:20px;}

/* ── Logo ── */
.logo-block{display:flex;flex-direction:column;align-items:center;gap:10px;}
.logo-block img{width:72px;height:72px;border-radius:18px;}
.logo-block h1{font-size:24px;font-weight:800;color:#fff;letter-spacing:-0.5px;}

/* ── Welcome card ── */
.welcome-card{width:100%;background:#1C1C1E;border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:20px 18px;}
.welcome-hi{font-size:15px;color:rgba(255,255,255,0.45);margin-bottom:2px;}
.welcome-name{font-size:26px;font-weight:800;color:#F5C800;letter-spacing:-0.5px;margin-bottom:6px;}
.welcome-email{font-size:13px;color:rgba(255,255,255,0.35);}
.welcome-email strong{color:rgba(255,255,255,0.6);}

/* ── Form card ── */
.form-card{width:100%;background:#1C1C1E;border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:22px 18px;}
.section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:rgba(255,255,255,0.3);margin-bottom:14px;}
.form-group{margin-bottom:14px;}
.form-label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:rgba(255,255,255,0.35);margin-bottom:6px;}
input[type=password]{
  width:100%;padding:13px 14px;border-radius:11px;
  border:1.5px solid rgba(255,255,255,0.08);
  background:#2C2C2E;color:#fff;font-size:16px;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;
  outline:none;transition:border-color 0.2s;
}
input[type=password]:focus{border-color:#F5C800;}
input[type=password]::placeholder{color:rgba(255,255,255,0.2);}
.hint{font-size:12px;color:rgba(255,255,255,0.25);margin-top:16px;line-height:1.5;}

/* ── Button ── */
.btn-register{
  width:100%;padding:15px;border-radius:12px;border:none;
  background:#F5C800;color:#000;
  font-size:16px;font-weight:800;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;
  cursor:pointer;transition:opacity 0.15s,transform 0.1s;
  letter-spacing:-0.2px;
}
.btn-register:active{opacity:0.85;transform:scale(0.98);}
.btn-register:disabled{opacity:0.35;cursor:not-allowed;}

/* ── Messages ── */
.msg{display:none;padding:12px 14px;border-radius:11px;font-size:13px;font-weight:600;margin-top:12px;line-height:1.5;}
.msg.error{background:rgba(255,69,58,0.1);color:#FF453A;border:1px solid rgba(255,69,58,0.2);}
.msg.success{background:rgba(48,209,88,0.1);color:#30D158;border:1px solid rgba(48,209,88,0.2);}

/* ── Error page ── */
.err-page{width:100%;background:#1C1C1E;border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:32px 20px;text-align:center;}
.err-icon{font-size:48px;margin-bottom:14px;}
.err-title{font-size:20px;font-weight:800;color:#fff;margin-bottom:8px;}
.err-text{font-size:14px;color:rgba(255,255,255,0.4);line-height:1.6;}
.err-link{margin-top:20px;display:inline-block;font-size:14px;color:#F5C800;font-weight:600;text-decoration:none;}

/* ── Loader ── */
.loader{text-align:center;padding:16px 0;}
.spin{width:32px;height:32px;border:3px solid rgba(255,255,255,0.08);border-top-color:#F5C800;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}
.loader p{font-size:13px;color:rgba(255,255,255,0.35);}
</style>
</head>
<body>
<div class="wrap">

  <!-- Logo -->
  <div class="logo-block">
    <img src="icon.svg" alt="MHVwork">
    <h1>MHVwork</h1>
  </div>

  <!-- Loader -->
  <div id="loader" class="form-card">
    <div class="loader">
      <div class="spin"></div>
      <p>Uitnodiging laden…</p>
    </div>
  </div>

  <!-- Error page -->
  <div id="errPage" style="display:none" class="err-page">
    <div class="err-icon">🔒</div>
    <div class="err-title">Ongeldige link</div>
    <p class="err-text" id="errText">Deze uitnodigingslink is niet geldig of al gebruikt.</p>
    <a href="index.html" class="err-link">← Terug naar inloggen</a>
  </div>

  <!-- Form -->
  <div id="formWrap" style="display:none;width:100%">

    <!-- Welkomstkaart -->
    <div class="welcome-card" style="margin-bottom:12px">
      <div class="welcome-hi">Welkom bij MHVwork,</div>
      <div class="welcome-name" id="welcomeName">—</div>
      <div class="welcome-email">Account e-mail: <strong id="emailDisplay">—</strong></div>
    </div>

    <!-- Wachtwoord -->
    <div class="form-card">
      <div class="section-title">Kies een wachtwoord</div>
      <div class="form-group">
        <label class="form-label">Wachtwoord</label>
        <input type="password" id="pw1" placeholder="Minimaal 6 tekens" autocomplete="new-password">
      </div>
      <div class="form-group" style="margin-bottom:0">
        <label class="form-label">Herhaal wachtwoord</label>
        <input type="password" id="pw2" placeholder="Nogmaals hetzelfde" autocomplete="new-password">
      </div>
      <p class="hint">Je beheert dit wachtwoord zelf — beheerders kunnen het niet zien.</p>
      <button class="btn-register" id="regBtn" onclick="doRegister()" style="margin-top:18px">Account aanmaken</button>
      <div class="msg" id="regMsg"></div>
    </div>

  </div>

</div>
</body>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updatePassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDqwDEf35KoH2850xFHZ6gN9ROwgcx0Kyw",
  authDomain: "mhvwork-2376d.firebaseapp.com",
  projectId: "mhvwork-2376d",
  storageBucket: "mhvwork-2376d.firebasestorage.app",
  messagingSenderId: "292563349134",
  appId: "1:292563349134:web:6897c6e23536baf56ba3df"
};


  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  window._reg = { auth, db, createUserWithEmailAndPassword, signInWithEmailAndPassword, updatePassword, doc, getDoc, setDoc, updateDoc, serverTimestamp };

  // Load invite on page load
  window.addEventListener('DOMContentLoaded', async () => {
    const params = new URLSearchParams(window.location.search);
    const inviteId = params.get('invite');
    if (!inviteId) { showError('Geen geldige uitnodigingslink.'); return; }

    try {
      const snap = await getDoc(doc(db, 'invites', inviteId));
      if (!snap.exists()) { showError('Uitnodiging niet gevonden.'); return; }
      const data = snap.data();
      if (data.used) { showError('Deze uitnodigingslink is al gebruikt.'); return; }

      window._inviteId = inviteId;
      window._inviteData = data;

      document.getElementById('welcomeName').textContent = data.name;
      document.getElementById('emailDisplay').textContent = data.email;
      document.getElementById('loader').style.display = 'none';
      document.getElementById('formWrap').style.display = 'block';
    } catch(e) {

</script>
<script>
function showError(msg) {
  document.getElementById('loader').style.display = 'none';
  document.getElementById('errPage').style.display = 'block';
  document.getElementById('errText').textContent = msg;
}

async function doRegister() {
  const pw1 = document.getElementById('pw1').value;
  const pw2 = document.getElementById('pw2').value;
  const btn = document.getElementById('regBtn');
  const msg = document.getElementById('regMsg');
  msg.style.display = 'none';

  if (!pw1 || !pw2) { showMsg('Vul beide wachtwoordvelden in.','error'); return; }
  if (pw1 !== pw2)  { showMsg('Wachtwoorden komen niet overeen.','error'); return; }
  if (pw1.length < 6) { showMsg('Wachtwoord moet minimaal 6 tekens zijn.','error'); return; }

  btn.disabled = true; btn.textContent = 'Bezig...';

  try {
    const { auth, db, createUserWithEmailAndPassword, signInWithEmailAndPassword, updatePassword, doc, setDoc, updateDoc, serverTimestamp } = window._reg;
    const inv = window._inviteData;

    // Maak Firebase Auth account aan
    // Strategie bij "email already in use":
    //   1. Login met tempPw uit invite + update naar nieuw ww
    //   2. Login met het nieuwe ww (account al eerder aangemaakt)
    //   3. Gebruik Firebase REST API om ww te resetten via tempPw
    let cred;
    try {
      cred = await createUserWithEmailAndPassword(auth, inv.email, pw1);
    } catch(createErr) {
      if (createErr.code === 'auth/email-already-in-use') {
        let logged = false;

        // Probeer 1: login met tempPw uit invite (meest betrouwbaar)
        if (!logged && inv.tempPw) {
          try {
            cred = await signInWithEmailAndPassword(auth, inv.email, inv.tempPw);
            await updatePassword(cred.user, pw1);
            logged = true;
          } catch(e1) { console.log('tempPw login failed:', e1.code); }
        }

        // Probeer 2: account al eerder aangemaakt met dit zelfde ww
        if (!logged) {
          try {
            cred = await signInWithEmailAndPassword(auth, inv.email, pw1);
            logged = true;
          } catch(e2) { console.log('pw1 login failed:', e2.code); }
        }

        // Probeer 3: Firebase REST — verander ww via Admin API met tempPw
        if (!logged && inv.tempPw) {
          try {
            // Eerst inloggen via REST om idToken te krijgen
            const apiKey = 'AIzaSyDqwDEf35KoH2850xFHZ6gN9ROwgcx0Kyw';
            const signInRes = await fetch(
              'https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=' + apiKey,
              { method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({email: inv.email, password: inv.tempPw, returnSecureToken: true}) }
            );
            const signInData = await signInRes.json();
            if (signInData.idToken) {
              // Update wachtwoord via REST
              const updateRes = await fetch(
                'https://identitytoolkit.googleapis.com/v1/accounts:update?key=' + apiKey,
                { method:'POST', headers:{'Content-Type':'application/json'},
                  body: JSON.stringify({idToken: signInData.idToken, password: pw1, returnSecureToken: true}) }
              );
              const updateData = await updateRes.json();
              if (updateData.idToken) {
                // Nu inloggen met nieuw ww via Firebase SDK
                cred = await signInWithEmailAndPassword(auth, inv.email, pw1);
                logged = true;
              }
            }
          } catch(e3) { console.log('REST reset failed:', e3); }
        }

        if (!logged) {
          throw new Error(
            'Er bestaat al een account met dit e-mailadres en het kon niet automatisch worden hersteld.\n\n' +
            'Vraag de beheerder om in Firebase het account te verwijderen en een nieuwe uitnodigingslink te sturen.'
          );
        }
      } else {
        throw createErr;
      }
    }

    // Create user document in Firestore
    await setDoc(doc(db, 'users', cred.user.uid), {
      name: inv.name,
      email: inv.email,
      wage: inv.wage || 0,
      role: 'employee',
      createdAt: serverTimestamp()
    });

    // Mark invite as used
    await updateDoc(doc(db, 'invites', window._inviteId), {
      used: true,
      usedAt: serverTimestamp(),
      uid: cred.user.uid
    });

    showMsg('Account aangemaakt! Je wordt doorgestuurd...','success');
    setTimeout(() => window.location.href = 'app.html', 1800);
  } catch(e) {
    let errMsg = 'Er ging iets mis. Probeer het opnieuw.';
    if (e.code === 'auth/email-already-in-use') errMsg = 'Er bestaat al een account met dit e-mailadres. Neem contact op via h.mhvwork@gmail.com'; if (e.message && e.message.includes('bestaat al')) errMsg = e.message;
    if (e.code === 'auth/weak-password') errMsg = 'Wachtwoord is te zwak. Kies iets sterkers.';
    showMsg(errMsg, 'error');
    document.getElementById('regBtn').disabled = false;
    document.getElementById('regBtn').textContent = 'Account aanmaken';
  }
}

function showMsg(text, type) {
  const m = document.getElementById('regMsg');
  m.textContent = text; m.className = 'msg ' + type; m.style.display = 'block';
}

document.addEventListener('keydown', e => { if(e.key==='Enter') doRegister(); });
</script>


</html>
