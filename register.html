<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>MHVwork — Account aanmaken</title>
<meta name="theme-color" content="#0d0d1a">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updatePassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDqwDEf35KoH2850xFHZ6gN9ROwgcx0Kyw",
  authDomain: "mhvwork-2376d.firebaseapp.com",
  projectId: "mhvwork-2376d",
  storageBucket: "mhvwork-2376d.firebasestorage.app",
  messagingSenderId: "292563349134",
  appId: "1:292563349134:web:6897c6e23536baf56ba3df"
};


  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  window._reg = { auth, db, createUserWithEmailAndPassword, signInWithEmailAndPassword, updatePassword, doc, getDoc, setDoc, updateDoc, serverTimestamp };

  // Load invite on page load
  window.addEventListener('DOMContentLoaded', async () => {
    const params = new URLSearchParams(window.location.search);
    const inviteId = params.get('invite');
    if (!inviteId) { showError('Geen geldige uitnodigingslink.'); return; }

    try {
      const snap = await getDoc(doc(db, 'invites', inviteId));
      if (!snap.exists()) { showError('Uitnodiging niet gevonden.'); return; }
      const data = snap.data();
      if (data.used) { showError('Deze uitnodigingslink is al gebruikt.'); return; }

      window._inviteId = inviteId;
      window._inviteData = data;

      document.getElementById('welcomeName').textContent = data.name;
      document.getElementById('emailDisplay').textContent = data.email;
      document.getElementById('loader').style.display = 'none';
      document.getElementById('formWrap').style.display = 'block';
    } catch(e) {
      showError('Er ging iets mis bij het laden. Probeer opnieuw.');
      console.error(e);
    }
  });
</script>

<style>
:root {
  --mhv-yellow: #F5C800;
  --mhv-blue:   #1D3FBB;
  --bg:#000; --bg2:#1C1C1E; --bg3:#2C2C2E;
  --text:#FFF; --text2:rgba(255,255,255,0.7); --text3:rgba(255,255,255,0.4);
  --green:#30D158; --green-dim:rgba(48,209,88,0.12);
  --red:#FF453A; --red-dim:rgba(255,69,58,0.12);
  --separator:rgba(255,255,255,0.08);
  --radius:14px; --radius-lg:20px;
  --font:'Outfit',-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font);}
body{display:flex;align-items:center;justify-content:center;padding:20px;min-height:100vh;-webkit-font-smoothing:antialiased;}
.wrap{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:24px;}

.logo-row{display:flex;flex-direction:column;align-items:center;gap:10px;}
.logo-row img{width:64px;height:64px;border-radius:16px;}
.logo-row h1{font-size:26px;font-weight:800;letter-spacing:-1px;color:var(--text);}
.logo-row h1 span{color:var(--mhv-yellow);}

.welcome-card{width:100%;background:var(--bg2);border:1px solid var(--separator);border-radius:var(--radius-lg);padding:20px 22px;}
.welcome-card p{font-size:13px;color:var(--text3);margin-bottom:4px;}
.welcome-card h2{font-size:24px;font-weight:800;color:var(--mhv-yellow);letter-spacing:-0.5px;text-transform:none;}
.welcome-card .email{font-size:13px;color:var(--text3);margin-top:10px;}
.welcome-card .email strong{color:var(--text2);font-weight:600;}

.form-card{width:100%;background:var(--bg2);border:1px solid var(--separator);border-radius:var(--radius-lg);padding:22px;}
.field-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text3);margin-bottom:8px;display:block;}
.field-input{width:100%;background:var(--bg3);border:1.5px solid var(--separator);border-radius:var(--radius);padding:14px 16px;color:var(--text);font-size:16px;font-family:inherit;outline:none;transition:border-color .15s ease;}
.field-input:focus{border-color:var(--mhv-yellow);}
.field-group{margin-bottom:18px;}
.hint{font-size:12px;color:var(--text3);margin-top:10px;line-height:1.5;}

.btn-main{width:100%;padding:15px;border-radius:var(--radius);border:none;background:var(--mhv-yellow);color:#000;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;transition:transform .1s ease,opacity .15s ease;}
.btn-main:active{transform:scale(0.98);opacity:0.9;}
.btn-main:disabled{opacity:0.5;cursor:not-allowed;}

.msg-box{width:100%;padding:14px 18px;border-radius:var(--radius);font-size:14px;line-height:1.5;display:none;}
.msg-box.error{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,69,58,0.25);}
.msg-box.success{background:var(--green-dim);color:var(--green);border:1px solid rgba(48,209,88,0.25);}

.err-card{width:100%;background:var(--bg2);border:1px solid var(--separator);border-radius:var(--radius-lg);padding:32px 24px;text-align:center;}
.err-card .icon{font-size:40px;margin-bottom:14px;}
.err-card h2{font-size:18px;font-weight:700;margin-bottom:8px;}
.err-card p{font-size:14px;color:var(--text3);line-height:1.5;}
.err-card a{display:inline-block;margin-top:18px;color:var(--mhv-yellow);text-decoration:none;font-weight:600;font-size:14px;}

.loader-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:40px 0;}
.spinner{width:36px;height:36px;border:3px solid var(--separator);border-top-color:var(--mhv-yellow);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loader-wrap p{font-size:13px;color:var(--text3);}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-row">
    <img id="logoImg" src="icon.svg" alt="MHVwork">
    <h1>MHV<span>work</span></h1>
  </div>

  <!-- Loader -->
  <div id="loader" class="loader-wrap">
    <div class="spinner"></div>
    <p>Uitnodiging laden...</p>
  </div>

  <!-- Error page -->
  <div id="errPage" style="display:none" class="err-card">
    <div class="icon">🔒</div>
    <h2>Ongeldige link</h2>
    <p id="errText">Deze uitnodigingslink is niet geldig of al gebruikt.</p>
    <a href="index.html">← Terug naar inloggen</a>
  </div>

  <!-- Registration form -->
  <div id="formWrap" style="display:none">
    <div class="welcome-card" style="margin-bottom:18px">
      <p>Welkom bij MHVwork,</p>
      <h2 id="welcomeName">—</h2>
      <div class="email">Je account e-mail: <strong id="emailDisplay">—</strong></div>
    </div>

    <div class="form-card">
      <div class="field-group">
        <label class="field-label">Kies een wachtwoord</label>
        <div style="position:relative">
          <input type="password" class="field-input" id="pw1" placeholder="Minimaal 6 tekens" autocomplete="new-password" oninput="updatePwStrength()" style="padding-right:44px">
          <button type="button" onclick="togglePwVisibility('pw1',this)" style="position:absolute;right:2px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:18px;cursor:pointer;padding:8px 10px;color:#8E8E93">👁️</button>
        </div>
        <div id="pwStrengthBar" style="height:4px;border-radius:2px;background:#E5E5EA;margin-top:8px;overflow:hidden">
          <div id="pwStrengthFill" style="height:100%;width:0%;border-radius:2px;transition:width .25s ease,background .25s ease"></div>
        </div>
        <div id="pwStrengthLabel" style="font-size:12px;color:#8E8E93;margin-top:5px;min-height:16px"></div>
      </div>
      <div class="field-group" style="margin-bottom:8px">
        <label class="field-label">Herhaal wachtwoord</label>
        <div style="position:relative">
          <input type="password" class="field-input" id="pw2" placeholder="Zelfde wachtwoord" autocomplete="new-password" style="padding-right:44px">
          <button type="button" onclick="togglePwVisibility('pw2',this)" style="position:absolute;right:2px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:18px;cursor:pointer;padding:8px 10px;color:#8E8E93">👁️</button>
        </div>
      </div>
      <p class="hint" style="margin-bottom:12px">Je beheert dit wachtwoord zelf — beheerders kunnen het niet zien.</p>

      <label style="display:flex;align-items:flex-start;gap:10px;margin-bottom:18px;cursor:pointer">
        <input type="checkbox" id="acceptTerms" style="width:18px;height:18px;flex-shrink:0;margin-top:2px;accent-color:#1D3FBB">
        <span style="font-size:13px;color:#3C3C43;line-height:1.5">Ik ga akkoord met de <a href="voorwaarden.html" target="_blank" style="color:#1D3FBB;font-weight:600">gebruiksvoorwaarden en privacyverklaring</a> van MHVwork.</span>
      </label>

      <button class="btn-main" id="regBtn" onclick="doRegister()">Account aanmaken</button>
      <div class="msg-box" id="regMsg" style="margin-top:14px"></div>
    </div>
  </div>
</div>
<script>
function togglePwVisibility(id,btn){
  const inp=document.getElementById(id);
  inp.type = inp.type==='password' ? 'text' : 'password';
  btn.textContent = inp.type==='password' ? '👁️' : '🙈';
}
function pwScore(pw){
  let score=0;
  if(!pw) return 0;
  if(pw.length>=6) score++;
  if(pw.length>=10) score++;
  if(/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
  if(/[0-9]/.test(pw)) score++;
  if(/[^A-Za-z0-9]/.test(pw)) score++;
  return score;
}
function updatePwStrength(){
  const pw=document.getElementById('pw1').value;
  const score=pwScore(pw);
  const fill=document.getElementById('pwStrengthFill');
  const label=document.getElementById('pwStrengthLabel');
  const levels=[
    {w:'0%',  c:'#E5E5EA', t:''},
    {w:'20%', c:'#FF453A', t:'Zeer zwak'},
    {w:'40%', c:'#FF9500', t:'Zwak'},
    {w:'60%', c:'#FFD60A', t:'Redelijk'},
    {w:'80%', c:'#34C759', t:'Sterk'},
    {w:'100%',c:'#30D158', t:'Zeer sterk'},
  ];
  const lvl=levels[score];
  fill.style.width=lvl.w; fill.style.background=lvl.c;
  label.textContent=lvl.t;
  label.style.color=lvl.c;
}
</script>

<script>
function showError(msg) {
  document.getElementById('loader').style.display = 'none';
  document.getElementById('errPage').style.display = 'block';
  document.getElementById('errText').textContent = msg;
}

async function doRegister() {
  const pw1 = document.getElementById('pw1').value;
  const pw2 = document.getElementById('pw2').value;
  const btn = document.getElementById('regBtn');
  const msg = document.getElementById('regMsg');
  msg.style.display = 'none';

  if (!pw1 || !pw2) { showMsg('Vul beide wachtwoordvelden in.','error'); return; }
  if (pw1 !== pw2)  { showMsg('Wachtwoorden komen niet overeen.','error'); return; }
  if (pw1.length < 6) { showMsg('Wachtwoord moet minimaal 6 tekens zijn.','error'); return; }
  if (!/[A-Z]/.test(pw1) || !/[a-z]/.test(pw1) || !/[0-9]/.test(pw1)) {
    showMsg('Wachtwoord moet een hoofdletter, kleine letter en een cijfer bevatten.','error'); return;
  }
  if (!document.getElementById('acceptTerms').checked) {
    showMsg('Je moet akkoord gaan met de gebruiksvoorwaarden om verder te gaan.','error'); return;
  }

  btn.disabled = true; btn.textContent = 'Bezig...';

  try {
    const { auth, db, createUserWithEmailAndPassword, signInWithEmailAndPassword, updatePassword, doc, setDoc, updateDoc, serverTimestamp } = window._reg;
    const inv = window._inviteData;

    // Create Firebase auth account
    let cred;
    try {
      cred = await createUserWithEmailAndPassword(auth, inv.email, pw1);
    } catch(createErr) {
      if (createErr.code === 'auth/email-already-in-use') {
        throw new Error('Er bestaat al een account met dit e-mailadres. Vraag de beheerder om het oude account te verwijderen (ook in Firebase Authentication) en een nieuwe uitnodigingslink te sturen.');
      } else { throw createErr; }
    }

    // Create user document in Firestore
    await setDoc(doc(db, 'users', cred.user.uid), {
      name: inv.name,
      email: inv.email,
      wage: inv.wage || 0,
      role: inv.role || 'employee',
      createdAt: serverTimestamp(),
      memberSince: serverTimestamp(),
      termsAcceptedAt: serverTimestamp(),
      termsVersion: 'v1-2026'
    });
    // Beperkte, publieke spiegel — zodat collega's deze persoon kunnen herkennen in chat/rooster
    // zonder toegang te hebben tot e-mail of loon.
    await setDoc(doc(db, 'publicProfiles', cred.user.uid), {
      name: inv.name,
      role: inv.role || 'employee',
    }).catch(()=>{});

    // Mark invite as used
    await updateDoc(doc(db, 'invites', window._inviteId), {
      used: true,
      usedAt: serverTimestamp(),
      uid: cred.user.uid
    });

    showMsg('Account aangemaakt! Je wordt doorgestuurd...','success');
    setTimeout(() => window.location.href = 'app.html?justRegistered=1', 1800);
  } catch(e) {
    console.error('Registratie fout:', e.code, e.message, e);
    let errMsg = 'Er ging iets mis: ' + (e.message || e.code || 'onbekende fout');
    if (e.code === 'auth/email-already-in-use') errMsg = 'Er bestaat al een account met dit e-mailadres.';
    if (e.code === 'auth/weak-password') errMsg = 'Wachtwoord is te zwak. Gebruik minimaal 6 tekens, met een hoofdletter, een cijfer en bij voorkeur een symbool.';
    if (e.code === 'auth/invalid-email') errMsg = 'Dit e-mailadres is ongeldig.';
    if (e.code === 'auth/missing-password' || (e.message||'').includes('PASSWORD_DOES_NOT_MEET_REQUIREMENTS')) {
      errMsg = 'Wachtwoord voldoet niet aan de eisen: gebruik minimaal 6 tekens met een hoofdletter, kleine letter en een cijfer.';
    }
    showMsg(errMsg, 'error');
    document.getElementById('regBtn').disabled = false;
    document.getElementById('regBtn').textContent = 'Account aanmaken';
  }
}

function showMsg(text, type) {
  const m = document.getElementById('regMsg');
  m.textContent = text; m.className = 'msg-box ' + type; m.style.display = 'block';
}

document.addEventListener('keydown', e => { if(e.key==='Enter') doRegister(); });
</script>
<script>
if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{});}
</script>
</body>
</html>
