<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MHVwork — Account aanmaken</title>
<meta name="theme-color" content="#0d0d1a">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDqwDEf35KoH2850xFHZ6gN9ROwgcx0Kyw",
  authDomain: "mhvwork-2376d.firebaseapp.com",
  projectId: "mhvwork-2376d",
  storageBucket: "mhvwork-2376d.firebasestorage.app",
  messagingSenderId: "292563349134",
  appId: "1:292563349134:web:6897c6e23536baf56ba3df"
};


  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  window._reg = { auth, db, createUserWithEmailAndPassword, doc, getDoc, setDoc, updateDoc, serverTimestamp };

  // Load invite on page load
  window.addEventListener('DOMContentLoaded', async () => {
    const params = new URLSearchParams(window.location.search);
    const inviteId = params.get('invite');
    if (!inviteId) { showError('Geen geldige uitnodigingslink.'); return; }

    try {
      const snap = await getDoc(doc(db, 'invites', inviteId));
      if (!snap.exists()) { showError('Uitnodiging niet gevonden.'); return; }
      const data = snap.data();
      if (data.used) { showError('Deze uitnodigingslink is al gebruikt.'); return; }

      window._inviteId = inviteId;
      window._inviteData = data;

      document.getElementById('welcomeName').textContent = data.name;
      document.getElementById('emailDisplay').textContent = data.email;
      document.getElementById('loader').style.display = 'none';
      document.getElementById('formWrap').style.display = 'block';
    } catch(e) {
      showError('Er ging iets mis bij het laden. Probeer opnieuw.');
      console.error(e);
    }
  });
</script>

<style>
:root {
  --bg:#0d0d1a; --surface:#13132a; --surface2:#1c1c3a;
  --accent:#f5c800; --text:#f0f0f8; --muted:#8888aa;
  --danger:#e05555; --success:#4caf7d; --border:rgba(255,255,255,0.07);
  --radius:14px; --font-head:'Syne',sans-serif; --font-body:'DM Sans',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body);}
body{display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(ellipse at 20% 50%,#1a1a4a,#0d0d1a 60%),
             radial-gradient(ellipse at 80% 20%,#1f1040,transparent 50%);}

.bg-shape{position:fixed;border-radius:50%;filter:blur(80px);opacity:0.12;pointer-events:none;}
.bg-shape-1{width:400px;height:400px;background:#f5c800;top:-100px;left:-100px;animation:drift1 12s ease-in-out infinite;}
.bg-shape-2{width:300px;height:300px;background:#3a5fcf;bottom:-80px;right:-80px;animation:drift2 10s ease-in-out infinite;}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,20px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-20px,-30px)}}

.wrap{position:relative;z-index:10;background:rgba(19,19,42,0.9);border:1px solid var(--border);
  border-radius:24px;padding:44px 36px 36px;width:min(440px,95vw);
  backdrop-filter:blur(20px);box-shadow:0 40px 80px rgba(0,0,0,0.6);
  animation:slideUp 0.6s cubic-bezier(.16,1,.3,1);}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

.logo-row{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:28px;}
.logo-row img{width:64px;height:64px;object-fit:contain;border-radius:50%;box-shadow:0 0 0 4px rgba(245,200,0,0.2);}
.logo-row h1{font-family:var(--font-head);font-size:24px;font-weight:800;}
.logo-row h1 span{color:var(--accent);}

.welcome-box{background:rgba(245,200,0,0.07);border:1px solid rgba(245,200,0,0.2);
  border-radius:10px;padding:14px 16px;margin-bottom:24px;}
.welcome-box .hey{font-size:13px;color:var(--muted);margin-bottom:4px;}
.welcome-box .name{font-family:var(--font-head);font-size:18px;font-weight:800;color:var(--accent);}
.welcome-box .email{font-size:12px;color:var(--muted);margin-top:4px;}

.form-group{margin-bottom:16px;}
.form-label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:7px;}
.form-input{width:100%;padding:13px 15px;border-radius:10px;background:rgba(255,255,255,0.05);
  border:1px solid var(--border);color:var(--text);font-family:var(--font-body);font-size:15px;
  outline:none;transition:border-color 0.2s,box-shadow 0.2s;}
.form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(245,200,0,0.12);}
.form-input::placeholder{color:var(--muted);}

.btn-primary{width:100%;padding:15px;border-radius:10px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),#e6b800);
  color:#1a1000;font-family:var(--font-head);font-size:15px;font-weight:700;
  transition:transform 0.15s,box-shadow 0.15s;margin-top:4px;}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(245,200,0,0.3);}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed;transform:none;}

.pw-req{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.6;}

.msg{border-radius:10px;padding:14px 16px;font-size:13px;margin-top:16px;display:none;}
.msg.error{background:rgba(224,85,85,0.12);border:1px solid rgba(224,85,85,0.3);color:#ff8888;}
.msg.success{background:rgba(76,175,125,0.12);border:1px solid rgba(76,175,125,0.3);color:var(--success);}

#loader{text-align:center;padding:20px;}
#loader .spin{width:36px;height:36px;border:3px solid rgba(255,255,255,0.1);border-top-color:var(--accent);
  border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}

.err-page{text-align:center;padding:20px;}
.err-page .icon{font-size:48px;margin-bottom:16px;}
.err-page h2{font-family:var(--font-head);font-size:20px;font-weight:800;margin-bottom:8px;}
.err-page p{color:var(--muted);font-size:14px;line-height:1.6;}
</style>
</head>

    <h1>MHV<span>work</span></h1>
  </div>

  <!-- Loader -->
  <div id="loader">
    <div class="spin"></div>
    <p style="font-size:13px;color:var(--muted)">Uitnodiging laden...</p>
  </div>

  <!-- Error page -->
  <div id="errPage" style="display:none" class="err-page">
    <div class="icon">🔒</div>
    <h2>Ongeldige link</h2>
    <p id="errText">Deze uitnodigingslink is niet geldig of al gebruikt.</p>
    <p style="margin-top:12px"><a href="index.html" style="color:var(--accent);text-decoration:none;font-size:13px">← Terug naar inloggen</a></p>
  </div>

  <!-- Registration form -->
  <div id="formWrap" style="display:none">
    <div class="welcome-box">
      <div class="hey">Welkom bij MHVwork,</div>
      <div class="name" id="welcomeName">—</div>
      <div class="email">Je account e-mail: <strong id="emailDisplay">—</strong></div>
    </div>

    <div class="form-group">
      <label class="form-label">Kies een wachtwoord</label>
      <input type="password" class="form-input" id="pw1" placeholder="Minimaal 6 tekens" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label class="form-label">Herhaal wachtwoord</label>
      <input type="password" class="form-input" id="pw2" placeholder="Zelfde wachtwoord" autocomplete="new-password">
      <div class="pw-req">Je beheert dit wachtwoord zelf — beheerders kunnen het niet zien.</div>
    </div>

    <button class="btn-primary" id="regBtn" onclick="doRegister()">Account aanmaken</button>
    <div class="msg" id="regMsg"></div>
  </div>
</div>

<script>
function showError(msg) {
  document.getElementById('loader').style.display = 'none';
  document.getElementById('errPage').style.display = 'block';
  document.getElementById('errText').textContent = msg;
}

async function doRegister() {
  const pw1 = document.getElementById('pw1').value;
  const pw2 = document.getElementById('pw2').value;
  const btn = document.getElementById('regBtn');
  const msg = document.getElementById('regMsg');
  msg.style.display = 'none';

  if (!pw1 || !pw2) { showMsg('Vul beide wachtwoordvelden in.','error'); return; }
  if (pw1 !== pw2)  { showMsg('Wachtwoorden komen niet overeen.','error'); return; }
  if (pw1.length < 6) { showMsg('Wachtwoord moet minimaal 6 tekens zijn.','error'); return; }

  btn.disabled = true; btn.textContent = 'Bezig...';

  try {
    const { auth, db, createUserWithEmailAndPassword, doc, setDoc, updateDoc, serverTimestamp } = window._reg;
    const inv = window._inviteData;

    // Create Firebase auth account
    const cred = await createUserWithEmailAndPassword(auth, inv.email, pw1);

    // Create user document in Firestore
    await setDoc(doc(db, 'users', cred.user.uid), {
      name: inv.name,
      email: inv.email,
      wage: inv.wage || 0,
      role: 'employee',
      createdAt: serverTimestamp()
    });

    // Mark invite as used
    await updateDoc(doc(db, 'invites', window._inviteId), {
      used: true,
      usedAt: serverTimestamp(),
      uid: cred.user.uid
    });

    showMsg('Account aangemaakt! Je wordt doorgestuurd...','success');
    setTimeout(() => window.location.href = 'app.html', 1800);
  } catch(e) {
    let errMsg = 'Er ging iets mis. Probeer het opnieuw.';
    if (e.code === 'auth/email-already-in-use') errMsg = 'Er bestaat al een account met dit e-mailadres.';
    if (e.code === 'auth/weak-password') errMsg = 'Wachtwoord is te zwak. Kies iets sterkers.';
    showMsg(errMsg, 'error');
    document.getElementById('regBtn').disabled = false;
    document.getElementById('regBtn').textContent = 'Account aanmaken';
  }
}

function showMsg(text, type) {
  const m = document.getElementById('regMsg');
  m.textContent = text; m.className = 'msg ' + type; m.style.display = 'block';
}

document.addEventListener('keydown', e => { if(e.key==='Enter') doRegister(); });
</script>
</body>
