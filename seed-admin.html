<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MHVwork — Setup</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;font-family:'Outfit',sans-serif;padding:24px;}
.card{background:#1C1C1E;border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:32px 28px;width:100%;max-width:360px;text-align:center;}
img{width:72px;height:72px;border-radius:18px;margin-bottom:16px;}
h1{font-size:22px;font-weight:800;color:#fff;margin-bottom:6px;}
p{font-size:14px;color:rgba(255,255,255,0.4);line-height:1.6;margin-bottom:24px;}
.info{background:rgba(245,200,0,0.08);border:1px solid rgba(245,200,0,0.2);border-radius:12px;padding:14px 16px;margin-bottom:20px;text-align:left;}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.06);}
.info-row:last-child{border:none;}
.info-lbl{font-size:12px;color:rgba(255,255,255,0.4);font-weight:600;text-transform:uppercase;letter-spacing:0.05em;}
.info-val{font-size:14px;color:#F5C800;font-weight:700;}
.btn{width:100%;padding:14px;border-radius:12px;border:none;font-family:'Outfit',sans-serif;font-size:16px;font-weight:800;cursor:pointer;background:#F5C800;color:#000;transition:opacity 0.15s;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.msg{margin-top:16px;padding:12px 14px;border-radius:10px;font-size:13px;font-weight:600;display:none;}
.msg.ok{background:rgba(48,209,88,0.12);color:#30D158;border:1px solid rgba(48,209,88,0.2);}
.msg.err{background:rgba(255,69,58,0.1);color:#FF453A;border:1px solid rgba(255,69,58,0.2);}
.spin{width:20px;height:20px;border:2.5px solid rgba(0,0,0,0.2);border-top-color:#000;border-radius:50%;animation:spin 0.7s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <img src="icon.svg" alt="MHVwork">
  <h1>MHVwork Setup</h1>
  <p>Klik op de knop om het beheerderaccount aan te maken. Dit hoef je maar één keer te doen.</p>

  <div class="info">
    <div class="info-row">
      <span class="info-lbl">E-mail</span>
      <span class="info-val">h.mhvwork@gmail.com</span>
    </div>
    <div class="info-row">
      <span class="info-lbl">Wachtwoord</span>
      <span class="info-val">MHVISDEBESTE</span>
    </div>
    <div class="info-row">
      <span class="info-lbl">Rol</span>
      <span class="info-val">Beheerder</span>
    </div>
  </div>

  <button class="btn" id="btn" onclick="setup()">Beheerder aanmaken</button>
  <div class="msg" id="msg"></div>
</div>

<script type="module">
import { initializeApp }                          from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword,
         signInWithEmailAndPassword }             from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc,
         serverTimestamp }                        from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDqwDEf35KoH2850xFHZ6gN9ROwgcx0Kyw",
  authDomain: "mhvwork-2376d.firebaseapp.com",
  projectId: "mhvwork-2376d",
  storageBucket: "mhvwork-2376d.firebasestorage.app",
  messagingSenderId: "292563349134",
  appId: "1:292563349134:web:6897c6e23536baf56ba3df"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const ADMIN_EMAIL = 'h.mhvwork@gmail.com';
const ADMIN_PW    = 'MHVISDEBESTE';
const ADMIN_NAME  = 'Beheerder';

window.setup = async function() {
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>Bezig…';
  msg.style.display = 'none';

  let uid = null;

  // Stap 1: account aanmaken of inloggen als het al bestaat
  try {
    const cred = await createUserWithEmailAndPassword(auth, ADMIN_EMAIL, ADMIN_PW);
    uid = cred.user.uid;
  } catch(e) {
    if (e.code === 'auth/email-already-in-use') {
      try {
        const cred = await signInWithEmailAndPassword(auth, ADMIN_EMAIL, ADMIN_PW);
        uid = cred.user.uid;
      } catch(e2) {
        showMsg('Inloggen mislukt: ' + e2.message, 'err');
        btn.disabled = false; btn.textContent = 'Beheerder aanmaken';
        return;
      }
    } else {
      showMsg('Fout: ' + e.message, 'err');
      btn.disabled = false; btn.textContent = 'Beheerder aanmaken';
      return;
    }
  }

  // Stap 2: Firestore user-document aanmaken / overschrijven
  try {
    await setDoc(doc(db, 'users', uid), {
      name: ADMIN_NAME,
      email: ADMIN_EMAIL,
      role: 'admin',
      wage: 0,
      createdAt: serverTimestamp()
    });
  } catch(e) {
    showMsg('Firestore fout: ' + e.message, 'err');
    btn.disabled = false; btn.textContent = 'Beheerder aanmaken';
    return;
  }

  // Stap 3: dev account aanmaken
  const DEV_EMAIL = 'tyg01132@gmail.com';
  const DEV_PW    = 'TygoDaan11';
  let devUid = null;
  try {
    // Log uit als admin eerst
    await auth.signOut();
    let devCred;
    try {
      devCred = await createUserWithEmailAndPassword(auth, DEV_EMAIL, DEV_PW);
    } catch(e2) {
      if(e2.code === 'auth/email-already-in-use') {
        devCred = await signInWithEmailAndPassword(auth, DEV_EMAIL, DEV_PW);
      } else throw e2;
    }
    devUid = devCred.user.uid;
    await setDoc(doc(db, 'users', devUid), {
      name: 'Tygo (Dev)', email: DEV_EMAIL,
      role: 'software', wage: 0, createdAt: serverTimestamp()
    });
  } catch(devErr) {
    console.warn('Dev account aanmaken mislukt:', devErr);
  }

  btn.textContent = '✓ Klaar!';
  msg.style.display = 'block';
  msg.className = 'msg ok';
  msg.innerHTML = '✅ Accounts aangemaakt!<br><br>'
    + '<strong>Beheerder:</strong> ' + ADMIN_EMAIL + ' / ' + ADMIN_PW + '<br>'
    + '<strong>Dev:</strong> tyg01132@gmail.com / TygoDaan11<br><br>'
    + 'Even wachten, je wordt doorgestuurd…';
  setTimeout(() => { window.location.href = 'index.html'; }, 2000);
};

function showMsg(txt, type) {
  const msg = document.getElementById('msg');
  msg.innerHTML = txt; msg.className = 'msg ' + type; msg.style.display = 'block';
}
</script>
</body>
</html>
