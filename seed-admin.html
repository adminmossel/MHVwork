<style>
:root{--bg:#0d0d1a;--surface:#13132a;--surface2:#1c1c3a;--accent:#f5c800;--text:#f0f0f8;--muted:#8888aa;--success:#4caf7d;--danger:#e05555;--border:rgba(255,255,255,0.07);--font-head:'Syne',sans-serif;--font-body:'DM Sans',sans-serif;}
*{margin:0;padding:0;box-sizing:border-box;}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font-body);display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 30% 50%,#1a1a4a,#0d0d1a 60%);}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px 36px;width:min(480px,95vw);box-shadow:0 40px 80px rgba(0,0,0,0.5);animation:up 0.5s cubic-bezier(.16,1,.3,1);}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.logo-row{text-align:center;margin-bottom:28px;}
.logo-row img{width:60px;height:60px;object-fit:contain;border-radius:50%;margin-bottom:12px;box-shadow:0 0 0 4px rgba(245,200,0,0.2);}
h1{font-family:var(--font-head);font-size:24px;font-weight:800;text-align:center;margin-bottom:4px;}
h1 span{color:var(--accent);}
.sub{text-align:center;font-size:13px;color:var(--muted);margin-bottom:28px;line-height:1.6;}
.warn{background:rgba(245,157,0,0.1);border:1px solid rgba(245,157,0,0.3);border-radius:10px;padding:14px 16px;font-size:13px;line-height:1.6;margin-bottom:24px;color:#ffc966;}
.form-group{margin-bottom:16px;}
label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:7px;}
input{width:100%;padding:13px 15px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--font-body);font-size:14px;outline:none;transition:border-color 0.2s;}
input:focus{border-color:var(--accent);}
.btn{width:100%;padding:14px;border-radius:10px;border:none;cursor:pointer;font-family:var(--font-head);font-size:15px;font-weight:700;transition:all 0.15s;}
.btn-accent{background:linear-gradient(135deg,var(--accent),#e6b800);color:#1a1000;}
.btn-accent:hover{box-shadow:0 8px 24px rgba(245,200,0,0.3);}
.btn-accent:disabled{opacity:0.5;cursor:not-allowed;}
.result{border-radius:10px;padding:16px;margin-top:18px;font-size:14px;line-height:1.7;display:none;}
.result.ok{background:rgba(76,175,125,0.12);border:1px solid rgba(76,175,125,0.3);color:var(--success);}
.result.err{background:rgba(224,85,85,0.12);border:1px solid rgba(224,85,85,0.3);color:#ff8888;}
.goto{display:block;text-align:center;margin-top:16px;color:var(--accent);text-decoration:none;font-size:13px;font-weight:600;}
.step{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border);}
.step:last-child{border-bottom:none;}
.step-num{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#1a1000;font-family:var(--font-head);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.step-text{font-size:13px;line-height:1.6;color:var(--text);}
.step-text strong{color:var(--accent);}
</style>
</head>

    <h1>MHV<span>work</span></h1>
  </div>

  <p class="sub">Eenmalige setup — maak het ADMIN account aan</p>

  <div class="warn">
    ⚠️ <strong>Gebruik deze pagina slechts één keer.</strong><br>
    Na het aanmaken van het admin account, verwijder dit bestand (<code>seed-admin.html</code>) uit je GitHub repository.
  </div>

  <div class="form-group">
    <label>Admin e-mailadres</label>
    <input type="email" id="adminEmail" value="admin@mhv.nl" placeholder="admin@mhv.nl">
  </div>
  <div class="form-group">
    <label>Admin wachtwoord</label>
    <input type="password" id="adminPass" value="MHV1953" placeholder="Kies een sterk wachtwoord">
  </div>
  <div class="form-group">
    <label>Admin naam</label>
    <input type="text" id="adminName" value="ADMIN" placeholder="ADMIN">
  </div>

  <button class="btn btn-accent" id="seedBtn" onclick="doSeed()">ADMIN account aanmaken</button>

  <div class="result" id="result"></div>
  <a href="index.html" class="goto">→ Naar de inlogpagina</a>
</div>

<script>
async function doSeed() {
  const email = document.getElementById('adminEmail').value.trim();
  const pass  = document.getElementById('adminPass').value;
  const name  = document.getElementById('adminName').value.trim();
  const btn   = document.getElementById('seedBtn');
  const res   = document.getElementById('result');

  if (!email || !pass || !name) { showResult('Vul alle velden in.','err'); return; }
  if (pass.length < 6) { showResult('Wachtwoord moet minimaal 6 tekens zijn.','err'); return; }

  btn.disabled = true; btn.textContent = 'Bezig...';

  try {
    const { auth, db, createUserWithEmailAndPassword, doc, setDoc, getDoc, serverTimestamp } = window._seed;

    // Create Firebase auth account
    const cred = await createUserWithEmailAndPassword(auth, email, pass);

    // Create Firestore user document with admin role
    await setDoc(doc(db,'users',cred.user.uid), {
      name,
      email,
      role: 'admin',
      wage: 0,
      createdAt: serverTimestamp()
    });

    showResult(`✓ ADMIN account aangemaakt!\n\nUID: ${cred.user.uid}\nE-mail: ${email}\n\nJe kunt nu inloggen op de app.\n\n⚠️ Vergeet niet dit bestand (seed-admin.html) te verwijderen uit GitHub!`, 'ok');
    btn.textContent = '✓ Klaar';
  } catch(e) {
    let msg = 'Er ging iets mis: ' + e.message;
    if (e.code === 'auth/email-already-in-use') msg = 'Er bestaat al een account met dit e-mailadres. Je kunt direct inloggen.';
    if (e.code === 'auth/invalid-api-key') msg = 'Firebase configuratie klopt niet. Controleer je API key in dit bestand.';
    showResult(msg, 'err');
    btn.disabled = false; btn.textContent = 'ADMIN account aanmaken';
  }
}

function showResult(text, type) {
  const r = document.getElementById('result');
  r.textContent = text; r.className = 'result ' + type; r.style.display = 'block';
}
</script>
