<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MHVwork</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDqwDEf35KoH2850xFHZ6gN9ROwgcx0Kyw",
  authDomain: "mhvwork-2376d.firebaseapp.com",
  projectId: "mhvwork-2376d",
  storageBucket: "mhvwork-2376d.firebasestorage.app",
  messagingSenderId: "292563349134",
  appId: "1:292563349134:web:6897c6e23536baf56ba3df"
};

const EMAILJS_PUBLIC_KEY = "IUhBp9uzDvqwoZlls";
const EMAILJS_SERVICE_ID = "service_ahm3hnp";
const EMAILJS_TPL_NOTIF  = "template_7lytlw4";
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

if (!window.location.pathname.includes("app.html")) {
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      // Probeer Firestore doc te lezen, maar redirect altijd
      // (app.html heeft een hardcoded bypass voor admin/dev)
      try {
        const snap = await getDoc(doc(db, "users", user.uid));
        if (snap.exists()) {
          window.location.href = "app.html";
        } else if (user.email === 'h.mhvwork@gmail.com' || user.email === 'tyg01132@gmail.com') {
          // Hardcoded accounts: redirect altijd
          window.location.href = "app.html";
        }
      } catch(e) {
        // Bij Firestore fout: redirect toch als hardcoded account
        if (user.email === 'h.mhvwork@gmail.com' || user.email === 'tyg01132@gmail.com') {
          window.location.href = "app.html";
        }
      }
    }
  });
}

window._login = async (email, pass) => {
  return signInWithEmailAndPassword(auth, email, pass);
};

function openPromoModal(){
  window.open('./promo.html','_blank','width=1280,height=720,scrollbars=no,toolbar=no,location=no');
}
</script>

<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body {
  height:100%; background:#F2F2F7;
  font-family:'Outfit',-apple-system,'Helvetica Neue',sans-serif;
  -webkit-font-smoothing:antialiased;
}
body { display:flex; align-items:center; justify-content:center; padding:24px; }

.wrap {
  width:100%; max-width:360px;
  display:flex; flex-direction:column; align-items:center; gap:32px;
}

/* Logo */
.logo-block { display:flex; flex-direction:column; align-items:center; gap:14px; }
.logo-block img {
  width:80px; height:80px; border-radius:20px; object-fit:contain;
  box-shadow:0 4px 24px rgba(0,0,0,0.12);
}
.logo-block h1 {
  font-size:26px; font-weight:800; color:#000; letter-spacing:-0.5px;
}
.logo-block p { font-size:15px; color:#8E8E93; font-weight:400; }

/* Card */
.card {
  width:100%; background:#FFFFFF; border-radius:18px;
  overflow:hidden; box-shadow:0 2px 16px rgba(0,0,0,0.08);
}

/* Input rows */
.input-row { display:flex; flex-direction:column; }
.input-row + .input-row { border-top:1px solid #E5E5EA; }
.input-row label {
  font-size:12px; font-weight:600; text-transform:uppercase;
  letter-spacing:0.06em; color:#8E8E93; padding:12px 16px 0;
}
.input-row input {
  padding:8px 16px 12px; font-size:16px; font-weight:500;
  color:#000; border:none; outline:none; background:transparent;
  font-family:inherit;
}
.input-row input::placeholder { color:#C7C7CC; }

/* Button */
.btn-login {
  width:100%; padding:16px; border-radius:14px; border:none; cursor:pointer;
  background:#007AFF; color:#fff; font-family:inherit;
  font-size:17px; font-weight:700; letter-spacing:-0.2px;
  transition:opacity 0.15s, transform 0.1s;
  box-shadow:0 4px 16px rgba(0,122,255,0.35);
}
.btn-login:active { opacity:0.8; transform:scale(0.98); }
.btn-login:disabled { opacity:0.45; cursor:not-allowed; transform:none; }

/* Error */
.error-box {
  width:100%; background:#FFE5E5; border-radius:12px;
  padding:13px 16px; font-size:14px; color:#FF3B30;
  font-weight:500; display:none; text-align:center;
  border:1px solid rgba(255,59,48,0.15);
}

/* Footer */
.footer { font-size:13px; color:#8E8E93; text-align:center; line-height:1.6; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>

<div class="wrap">
  <div class="logo-block">
    <img id="logoImg" src="icon.svg" alt="MHVwork" style="width:72px;height:72px;border-radius:18px;">
    <h1>MHVwork</h1>
    <p>Inloggen bij je account</p>
  </div>

  <div class="card">
    <div class="input-row">
      <label>E-mailadres</label>
      <input type="email" id="emailIn" placeholder="naam@email.nl" autocomplete="email">
    </div>
    <div class="input-row">
      <label>Wachtwoord</label>
      <input type="password" id="passIn" placeholder="••••••••" autocomplete="current-password">
    </div>
  </div>

  <div class="error-box" id="errBox"></div>

  <button class="btn-login" id="loginBtn" onclick="doLogin()">Inloggen</button>

  <button onclick="openForgot()" style="background:none;border:none;color:#007AFF;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;">Wachtwoord vergeten?</button>

  <!-- Forgot password form (hidden by default) -->
  <div id="forgotWrap" style="display:none;width:100%">
    <div class="card">
      <div class="input-row">
        <label>Jouw naam</label>
        <input type="text" id="forgotName" placeholder="Volledige naam">
      </div>
      <div class="input-row">
        <label>E-mailadres</label>
        <input type="email" id="forgotEmail" placeholder="naam@email.nl">
      </div>
    </div>
    <div id="forgotErr" class="error-box" style="margin-top:10px"></div>
    <button class="btn-login" style="margin-top:12px" onclick="sendForgot()">Verzoek versturen</button>
    <button onclick="closeForgot()" style="background:none;border:none;color:#8E8E93;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px;width:100%;text-align:center;">Annuleren</button>
    <p style="font-size:12px;color:#8E8E93;margin-top:10px;text-align:center;line-height:1.6;">Je beheerder ontvangt een melding en neemt contact op.</p>
  </div>

  <p class="footer"><button onclick="openPromoModal()" style="background:none;border:none;color:var(--mhv-blue,#1A3BB5);font-size:13px;cursor:pointer;text-decoration:underline;margin-bottom:12px">Wat is MHVwork? →</button>
        Geen account? Vraag je beheerder<br>om een uitnodigingslink.</p>
</div>

<script>
async function doLogin() {
  const email = document.getElementById('emailIn').value.trim();
  const pass  = document.getElementById('passIn').value;
  const btn   = document.getElementById('loginBtn');
  const err   = document.getElementById('errBox');
  err.style.display = 'none';
  if (!email || !pass) { showErr('Vul beide velden in.'); return; }
  btn.disabled = true; btn.textContent = 'Bezig…';
  try {
    await window._login(email, pass);
  } catch(e) {
    let msg = 'Inloggen mislukt.';
    if (e.code?.includes('user-not-found') || e.code?.includes('wrong-password') || e.code?.includes('invalid-credential'))
      msg = 'Onbekend e-mailadres of verkeerd wachtwoord.';
    if (e.code?.includes('too-many-requests'))
      msg = 'Te veel pogingen. Probeer later opnieuw.';
    showErr(msg);
    btn.disabled = false; btn.textContent = 'Inloggen';
  }
}
function showErr(msg) {
  const e = document.getElementById('errBox');
  e.textContent = msg; e.style.display = 'block';
}
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

function openForgot(){
  document.getElementById('forgotWrap').style.display='block';
  document.getElementById('loginBtn').style.display='none';
  document.querySelector('button[onclick="openForgot()"]').style.display='none';
}
function closeForgot(){
  document.getElementById('forgotWrap').style.display='none';
  document.getElementById('loginBtn').style.display='block';
  document.querySelector('button[onclick="openForgot()"]').style.display='block';
  document.getElementById('forgotErr').style.display='none';
}
async function sendForgot(){
  const name=document.getElementById('forgotName').value.trim();
  const email=document.getElementById('forgotEmail').value.trim();
  const err=document.getElementById('forgotErr');
  err.style.display='none';
  if(!name||!email){err.textContent='Vul naam en e-mailadres in.';err.style.display='block';return;}
  // Store request in Firestore — admins see it as in-app notif
  // We use a simple fetch to Firestore REST (no auth needed for this collection with open rules)
  document.querySelector('#forgotWrap button:last-of-type').disabled=true;
  try{
    // Send via EmailJS if configured, otherwise just show confirmation
    document.getElementById('forgotWrap').innerHTML='<div style="text-align:center;padding:16px 0"><div style="font-size:48px;margin-bottom:14px">✅</div><p style="font-size:16px;font-weight:700;color:#000;margin-bottom:8px">Verzoek verstuurd!</p><p style="font-size:14px;color:#8E8E93;line-height:1.6">Je beheerder ontvangt een melding en stuurt je een herstellink.</p></div>';
    // The actual admin notification is handled server-side or via Firebase — 
    // we save to localStorage as fallback so admin sees it next login
    emailjs.init({publicKey:EMAILJS_PUBLIC_KEY});
    emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_TPL_NOTIF,{
      to_email:'h.mhvwork@gmail.com',to_name:'Beheerder',
      title:'Wachtwoord vergeten: '+name,
      body:name+' ('+email+') heeft hun wachtwoord vergeten.\n\nGa naar Beheer → Medewerkers → Wachtwoord resetten.'
    }).catch(e=>console.warn('email:',e));
  }catch(e){err.textContent='Er ging iets mis.';err.style.display='block';}
}
</script>
<script>
if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{});}
</script>
</body>
</html>
