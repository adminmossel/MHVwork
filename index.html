<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MHVwork</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDqwDEf35KoH2850xFHZ6gN9ROwgcx0Kyw",
  authDomain: "mhvwork-2376d.firebaseapp.com",
  projectId: "mhvwork-2376d",
  storageBucket: "mhvwork-2376d.firebasestorage.app",
  messagingSenderId: "292563349134",
  appId: "1:292563349134:web:6897c6e23536baf56ba3df"
};

const EMAILJS_PUBLIC_KEY = "IUhBp9uzDvqwoZlls";
const EMAILJS_SERVICE_ID = "service_ahm3hnp";
const EMAILJS_TPL_NOTIF  = "template_7lytlw4";
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

if (!window.location.pathname.includes("app.html")) {
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      const snap = await getDoc(doc(db, "users", user.uid));
      if (snap.exists()) window.location.href = "app.html";
    }
  });
}

window._login = async (email, pass) => {
  return signInWithEmailAndPassword(auth, email, pass);
};
</script>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;}
body{background:#000;display:flex;align-items:center;justify-content:center;padding:24px;min-height:100vh;}

.wrap{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:20px;}

/* Logo */
.logo-block{display:flex;flex-direction:column;align-items:center;gap:10px;}
.logo-block img{width:72px;height:72px;border-radius:18px;}
.logo-block h1{font-size:26px;font-weight:800;color:#fff;letter-spacing:-0.5px;}
.logo-block h1 span{color:#F5C800;}

/* Card */
.card{width:100%;background:#1C1C1E;border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:24px 20px;}
.card-title{font-size:19px;font-weight:800;color:#fff;margin-bottom:4px;letter-spacing:-0.3px;}
.card-sub{font-size:13px;color:rgba(255,255,255,0.35);margin-bottom:20px;}

/* Form */
.form-group{margin-bottom:14px;}
.form-label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:rgba(255,255,255,0.35);margin-bottom:6px;}
input[type=email],input[type=password]{
  width:100%;padding:13px 14px;border-radius:11px;
  border:1.5px solid rgba(255,255,255,0.08);
  background:#2C2C2E;color:#fff;font-size:16px;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;
  outline:none;transition:border-color 0.2s;
}
input[type=email]:focus,input[type=password]:focus{border-color:#F5C800;}
input::placeholder{color:rgba(255,255,255,0.2);}

/* Button */
.btn-main{
  width:100%;padding:14px;border-radius:12px;border:none;
  background:#F5C800;color:#000;font-size:16px;font-weight:800;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;
  cursor:pointer;transition:opacity 0.15s,transform 0.1s;letter-spacing:-0.2px;
}
.btn-main:active{opacity:0.85;transform:scale(0.98);}
.btn-main:disabled{opacity:0.35;cursor:not-allowed;}

/* Forgot password */
.forgot-link{font-size:13px;color:rgba(255,255,255,0.3);text-align:right;display:block;margin-top:8px;cursor:pointer;text-decoration:none;}
.forgot-link:hover{color:#F5C800;}
#forgotWrap{width:100%;background:#1C1C1E;border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:24px 20px;display:none;}

/* Error box */
.error-box{display:none;padding:11px 14px;border-radius:10px;font-size:13px;font-weight:600;margin-top:10px;background:rgba(255,69,58,0.1);color:#FF453A;border:1px solid rgba(255,69,58,0.2);}

/* Footer */
.footer{font-size:11px;color:rgba(255,255,255,0.15);text-align:center;}
.footer a{color:rgba(255,255,255,0.2);text-decoration:none;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>

<div class="wrap">
  <div class="logo-block">
    <img src="icon.svg" alt="MHVwork">
    <h1>MHV<span>work</span></h1>
    <p>Inloggen bij je account</p>
  </div>

  <div class="card">
    <div class="input-row">
      <label>E-mailadres</label>
      <input type="email" id="emailIn" placeholder="naam@email.nl" autocomplete="email">
    </div>
    <div class="input-row">
      <label>Wachtwoord</label>
      <input type="password" id="passIn" placeholder="••••••••" autocomplete="current-password">
    </div>
  </div>

  <div class="error-box" id="errBox"></div>

  <button class="btn-login" id="loginBtn" onclick="doLogin()">Inloggen</button>

  <button onclick="openForgot()" style="background:none;border:none;color:#007AFF;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;">Wachtwoord vergeten?</button>

  <!-- Forgot password form (hidden by default) -->
  <div id="forgotWrap" style="display:none;width:100%">
    <div class="card">
      <div class="input-row">
        <label>Jouw naam</label>
        <input type="text" id="forgotName" placeholder="Volledige naam">
      </div>
      <div class="input-row">
        <label>E-mailadres</label>
        <input type="email" id="forgotEmail" placeholder="naam@email.nl">
      </div>
    </div>
    <div id="forgotErr" class="error-box" style="margin-top:10px"></div>
    <button class="btn-login" style="margin-top:12px" onclick="sendForgot()">Verzoek versturen</button>
    <button onclick="closeForgot()" style="background:none;border:none;color:#8E8E93;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px;width:100%;text-align:center;">Annuleren</button>
    <p style="font-size:12px;color:#8E8E93;margin-top:10px;text-align:center;line-height:1.6;">Je beheerder ontvangt een melding en neemt contact op.</p>
  </div>

  <p class="footer">Geen account? Vraag je beheerder<br>om een uitnodigingslink.</p>
</div>

<script>
async function doLogin() {
  const email = document.getElementById('emailIn').value.trim();
  const pass  = document.getElementById('passIn').value;
  const btn   = document.getElementById('loginBtn');
  const err   = document.getElementById('errBox');
  err.style.display = 'none';
  if (!email || !pass) { showErr('Vul beide velden in.'); return; }
  btn.disabled = true; btn.textContent = 'Bezig…';
  try {
    await window._login(email, pass);
  } catch(e) {
    let msg = 'Inloggen mislukt.';
    if (e.code?.includes('user-not-found') || e.code?.includes('wrong-password') || e.code?.includes('invalid-credential'))
      msg = 'Onbekend e-mailadres of verkeerd wachtwoord.';
    if (e.code?.includes('too-many-requests'))
      msg = 'Te veel pogingen. Probeer later opnieuw.';
    showErr(msg);
    btn.disabled = false; btn.textContent = 'Inloggen';
  }
}
function showErr(msg) {
  const e = document.getElementById('errBox');
  e.textContent = msg; e.style.display = 'block';
}
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

function openForgot(){
  document.getElementById('forgotWrap').style.display='block';
  document.getElementById('loginBtn').style.display='none';
  document.querySelector('button[onclick="openForgot()"]').style.display='none';
}
function closeForgot(){
  document.getElementById('forgotWrap').style.display='none';
  document.getElementById('loginBtn').style.display='block';
  document.querySelector('button[onclick="openForgot()"]').style.display='block';
  document.getElementById('forgotErr').style.display='none';
}
async function sendForgot(){
  const name=document.getElementById('forgotName').value.trim();
  const email=document.getElementById('forgotEmail').value.trim();
  const err=document.getElementById('forgotErr');
  err.style.display='none';
  if(!name||!email){err.textContent='Vul naam en e-mailadres in.';err.style.display='block';return;}
  // Store request in Firestore — admins see it as in-app notif
  // We use a simple fetch to Firestore REST (no auth needed for this collection with open rules)
  document.querySelector('#forgotWrap button:last-of-type').disabled=true;
  try{
    // Stuur email naar beheerder via EmailJS
    emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TPL_NOTIF, {
      to_email: 'h.mhvwork@gmail.com',
      to_name: 'Beheerder',
      title: 'Wachtwoord vergeten verzoek van ' + name,
      body: name + ' (' + email + ') heeft aangegeven hun wachtwoord vergeten te zijn.\n\nGa naar Beheer → Medewerkers → zoek ' + name + ' → Wachtwoord resetten.'
    });
    document.getElementById('forgotWrap').innerHTML='<div style="text-align:center;padding:16px 0"><div style="font-size:48px;margin-bottom:14px">✅</div><p style="font-size:16px;font-weight:700;color:#000;margin-bottom:8px">Verzoek verstuurd!</p><p style="font-size:14px;color:#8E8E93;line-height:1.6">Je beheerder ontvangt een melding en stuurt je een herstellink.</p></div>';
  }catch(e){err.textContent='Er ging iets mis.';err.style.display='block';}
}
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(e => console.warn('SW:', e));
}
</script>
</body>
</html>
