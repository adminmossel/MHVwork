<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDqwDEf35KoH2850xFHZ6gN9ROwgcx0Kyw",
  authDomain: "mhvwork-2376d.firebaseapp.com",
  projectId: "mhvwork-2376d",
  storageBucket: "mhvwork-2376d.firebasestorage.app",
  messagingSenderId: "292563349134",
  appId: "1:292563349134:web:6897c6e23536baf56ba3df"
};

const EMAILJS_PUBLIC_KEY = "IUhBp9uzDvqwoZlls";
const EMAILJS_SERVICE_ID = "service_ahm3hnp";
const EMAILJS_TPL_NOTIF  = "template_7lytlw4";
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

if (!window.location.pathname.includes("app.html")) {
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      // Probeer Firestore doc te lezen, maar redirect altijd
      // (app.html heeft een hardcoded bypass voor admin/dev)
      try {
        const snap = await getDoc(doc(db, "users", user.uid));
        if (snap.exists()) {
          window.location.href = "app.html";
        } else if (user.email === 'h.mhvwork@gmail.com' || user.email === 'tyg01132@gmail.com') {
          // Hardcoded accounts: redirect altijd
          window.location.href = "app.html";
        }
      } catch(e) {
        // Bij Firestore fout: redirect toch als hardcoded account
        if (user.email === 'h.mhvwork@gmail.com' || user.email === 'tyg01132@gmail.com') {
          window.location.href = "app.html";
        }
      }
    }
  });
}

window._login = async (email, pass) => {
  return signInWithEmailAndPassword(auth, email, pass);
};
window._sendReset = async (email) => {
  const base=window.location.origin+window.location.pathname.replace(/\/[^\/]*$/,'');
  return sendPasswordResetEmail(auth, email, {url:`${base}/reset-pw.html`, handleCodeInApp:true});
};

<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body {

}
.hero-tilt-inner img { width:76%; height:76%; object-fit:contain; border-radius:22px; filter:drop-shadow(0 10px 20px rgba(0,0,0,0.4)); }
.brand-name { font-size:26px; font-weight:800; color:#fff; letter-spacing:-0.5px; text-align:center; }
.brand-name span { color:var(--mhv-yellow,#F5C800); }
.brand-tag { font-size:14px; color:rgba(255,255,255,0.5); font-weight:400; text-align:center; margin-top:2px; }

/* ── Glass card (inputs) ─── */
.glass-card {
  width:100%; border-radius:20px; overflow:hidden;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.14);
  box-shadow:0 16px 40px -14px rgba(0,0,0,0.55);
}
.input-row { display:flex; flex-direction:column; }
.input-row + .input-row { border-top:1px solid rgba(255,255,255,0.08); }
.input-row label {
  font-size:11px; font-weight:600; text-transform:uppercase;
  letter-spacing:0.06em; color:rgba(255,255,255,0.4); padding:13px 18px 0;
}
.input-row input {
  padding:8px 18px 14px; font-size:16px; font-weight:500;
  color:#fff; border:none; outline:none; background:transparent;
  font-family:inherit;
}
.input-row input::placeholder { color:rgba(255,255,255,0.28); }

/* ── Glass button (rustig, geen bewegend gloei-effect) ─── */
.glass-btn {
  width:100%; display:block; border-radius:18px; border:none; cursor:pointer;
  background:rgba(255,255,255,0.09); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.16);
  padding:17px; text-align:center; font-family:inherit; font-size:17px; font-weight:700; color:#fff;
  transition:transform .12s, background .15s;
}
.glass-btn:active { transform:scale(0.98); background:rgba(255,255,255,0.14); }
.glass-btn:disabled { opacity:0.5; pointer-events:none; }
.glass-btn.secondary { padding:13px; font-size:14px; font-weight:600; color:rgba(255,255,255,0.75); background:rgba(255,255,255,0.05); }

.pill-link {
  display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1); border-radius:999px; padding:8px 16px;
  color:rgba(255,255,255,0.65); font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;

.pill-link:hover { background:rgba(255,255,255,0.11); color:#fff; }

.text-link { background:none; border:none; color:rgba(255,255,255,0.55); font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; }

.divider { width:100%; display:flex; align-items:center; gap:12px; color:rgba(255,255,255,0.3); font-size:12px; }
.divider::before, .divider::after { content:''; flex:1; height:1px; background:rgba(255,255,255,0.1); }

<body>

<div class="wrap">
  <div class="hero-tilt" id="heroTilt">
    <div class="hero-tilt-inner" id="heroTiltInner">

  </div>
  <div>
    <div class="brand-name">MHV<span>work</span></div>
    <div class="brand-tag">Inloggen bij je account</div>
  </div>

  <div class="glass-card">
    <div class="input-row">

    <span id="loginBtnLabel">Inloggen</span>

  <!-- Forgot password form (hidden by default) -->
  <div id="forgotWrap" style="display:none;width:100%">
    <div class="glass-card">
      <div class="input-row">
        <label>Jouw naam</label>
        <input type="text" id="forgotName" placeholder="Volledige naam">
      </div>
      <div class="input-row">
        <label>E-mailadres</label>
        <input type="email" id="forgotEmail" placeholder="naam@email.nl">
      </div>
    </div>
    <div id="forgotErr" class="error-box" style="margin-top:10px"></div>
    <button class="glass-btn" style="margin-top:12px" onclick="sendForgot()">Verzoek versturen</button>
    <button onclick="closeForgot()" class="text-link" style="margin-top:10px;width:100%;text-align:center;">Annuleren</button>
    <p style="font-size:12px;color:rgba(255,255,255,0.4);margin-top:10px;text-align:center;line-height:1.6;">Je beheerder ontvangt een melding en neemt contact op.</p>
  </div>

  <p class="footer">Geen account? Vraag je beheerder<br>om een uitnodigingslink.</p>
</div>

<script>
// Tilted-card-effect (vanilla, geen React nodig) — volgt de muis op desktop; op
// touch-schermen komt er simpelweg geen mousemove-event, dus staat 'm gewoon stil (zie
// ook de CSS media query hierboven, die 'm op kleine schermen hard uitzet).
(function(){
  const card=document.getElementById('heroTilt'), inner=document.getElementById('heroTiltInner');
  if(!card||!inner)return;
  card.addEventListener('mousemove', e=>{
    const r=card.getBoundingClientRect();
    const px=(e.clientX-r.left)/r.width-0.5, py=(e.clientY-r.top)/r.height-0.5;
    inner.style.transform=`rotateX(${(-py*16).toFixed(2)}deg) rotateY(${(px*16).toFixed(2)}deg) scale(1.05)`;
  });
  card.addEventListener('mouseleave', ()=>{ inner.style.transform='rotateX(0) rotateY(0) scale(1)'; });
})();
</script>


<script>
window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  if (params.get('suspended') === '1') {
    const err = document.getElementById('errBox');
    err.textContent = 'Dit account is tijdelijk geschorst. Neem contact op met de beheerder.';
    err.style.display = 'block';
    history.replaceState({}, '', window.location.pathname);
  }
});
async function doLogin() {
  const email = document.getElementById('emailIn').value.trim();
  const pass  = document.getElementById('passIn').value;
  const btn   = document.getElementById('loginBtn');
  const label = document.getElementById('loginBtnLabel');
  const err   = document.getElementById('errBox');
  err.style.display = 'none';
  if (!email || !pass) { showErr('Vul beide velden in.'); return; }
  btn.disabled = true; label.textContent = 'Bezig…';
  try {
    await window._login(email, pass);
  } catch(e) {
    let msg = 'Inloggen mislukt.';
    if (e.code?.includes('user-not-found') || e.code?.includes('wrong-password') || e.code?.includes('invalid-credential'))
      msg = 'Onbekend e-mailadres of verkeerd wachtwoord.';
    if (e.code?.includes('too-many-requests'))
      msg = 'Te veel pogingen. Probeer later opnieuw.';
    showErr(msg);
    btn.disabled = false; label.textContent = 'Inloggen';
  }
}
function showErr(msg) {
  const e = document.getElementById('errBox');
  e.textContent = msg; e.style.display = 'block';
}
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

function openForgot(){
  document.getElementById('forgotWrap').style.display='block';
  document.getElementById('loginBtn').style.display='none';
  document.querySelector('button[onclick="openForgot()"]').style.display='none';
}
function closeForgot(){
  document.getElementById('forgotWrap').style.display='none';
  document.getElementById('loginBtn').style.display='block';
  document.querySelector('button[onclick="openForgot()"]').style.display='block';
  document.getElementById('forgotErr').style.display='none';
}
async function sendForgot(){
  const name=document.getElementById('forgotName').value.trim();
  const email=document.getElementById('forgotEmail').value.trim();
  const err=document.getElementById('forgotErr');
  err.style.display='none';
  if(!name||!email){err.textContent='Vul naam en e-mailadres in.';err.style.display='block';return;}
  // Store request in Firestore — admins see it as in-app notif
  // We use a simple fetch to Firestore REST (no auth needed for this collection with open rules)
  document.querySelector('#forgotWrap button:last-of-type').disabled=true;
  try{
    // Stuur direct een echte, werkende Firebase reset-mail naar de medewerker zelf...
    try{ await window._sendReset(email); }catch(resetErr){ console.warn('reset mail:',resetErr); }
    document.getElementById('forgotWrap').innerHTML='<div style="text-align:center;padding:16px 0"><div style="width:60px;height:60px;border-radius:50%;background:rgba(48,209,88,0.15);display:flex;align-items:center;justify-content:center;margin:0 auto 14px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#30D158" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div><p style="font-size:16px;font-weight:700;color:#fff;margin-bottom:8px">Verzoek verstuurd!</p><p style="font-size:14px;color:rgba(255,255,255,0.5);line-height:1.6">Check je e-mail voor een herstellink. Je beheerder krijgt ook een melding voor het geval dat niet lukt.</p></div>';
    // ...en informeer ALTIJD ook de beheerder, voor het geval het account niet bestaat of de mail niet aankomt
    emailjs.init({publicKey:EMAILJS_PUBLIC_KEY});
    emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_TPL_NOTIF,{
      to_email:'h.mhvwork@gmail.com',to_name:'Beheerder',
      title:'Wachtwoord vergeten: '+name,
      body:name+' ('+email+') heeft hun wachtwoord vergeten.\n\nEr is automatisch een herstelmail gestuurd. Lukt dat niet, ga dan naar Beheer → Medewerkers → Wachtwoord resetten.'
    }).catch(e=>console.warn('email:',e));
  }catch(e){err.textContent='Er ging iets mis.';err.style.display='block';}
}
</script>
