<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MHVwork</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "JOUW_API_KEY",
  authDomain: "JOUW_PROJECT.firebaseapp.com",
  projectId: "JOUW_PROJECT_ID",
  storageBucket: "JOUW_PROJECT.appspot.com",
  messagingSenderId: "JOUW_SENDER_ID",
  appId: "JOUW_APP_ID"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

if (!window.location.pathname.includes("app.html")) {
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      const snap = await getDoc(doc(db, "users", user.uid));
      if (snap.exists()) window.location.href = "app.html";
    }
  });
}

window._login = async (email, pass) => {
  return signInWithEmailAndPassword(auth, email, pass);
};
</script>

<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body {
  height:100%; background:#F2F2F7;
  font-family:'Outfit',-apple-system,'Helvetica Neue',sans-serif;
  -webkit-font-smoothing:antialiased;
}
body { display:flex; align-items:center; justify-content:center; padding:24px; }

.wrap {
  width:100%; max-width:360px;
  display:flex; flex-direction:column; align-items:center; gap:32px;
}

/* Logo */
.logo-block { display:flex; flex-direction:column; align-items:center; gap:14px; }
.logo-block img {
  width:80px; height:80px; border-radius:20px; object-fit:contain;
  box-shadow:0 4px 24px rgba(0,0,0,0.12);
}
.logo-block h1 {
  font-size:26px; font-weight:800; color:#000; letter-spacing:-0.5px;
}
.logo-block p { font-size:15px; color:#8E8E93; font-weight:400; }

/* Card */
.card {
  width:100%; background:#FFFFFF; border-radius:18px;
  overflow:hidden; box-shadow:0 2px 16px rgba(0,0,0,0.08);
}

/* Input rows */
.input-row { display:flex; flex-direction:column; }
.input-row + .input-row { border-top:1px solid #E5E5EA; }
.input-row label {
  font-size:12px; font-weight:600; text-transform:uppercase;
  letter-spacing:0.06em; color:#8E8E93; padding:12px 16px 0;
}
.input-row input {
  padding:8px 16px 12px; font-size:16px; font-weight:500;
  color:#000; border:none; outline:none; background:transparent;
  font-family:inherit;
}
.input-row input::placeholder { color:#C7C7CC; }

/* Button */
.btn-login {
  width:100%; padding:16px; border-radius:14px; border:none; cursor:pointer;
  background:#007AFF; color:#fff; font-family:inherit;
  font-size:17px; font-weight:700; letter-spacing:-0.2px;
  transition:opacity 0.15s, transform 0.1s;
  box-shadow:0 4px 16px rgba(0,122,255,0.35);
}
.btn-login:active { opacity:0.8; transform:scale(0.98); }
.btn-login:disabled { opacity:0.45; cursor:not-allowed; transform:none; }

/* Error */
.error-box {
  width:100%; background:#FFE5E5; border-radius:12px;
  padding:13px 16px; font-size:14px; color:#FF3B30;
  font-weight:500; display:none; text-align:center;
  border:1px solid rgba(255,59,48,0.15);
}

/* Footer */
.footer { font-size:13px; color:#8E8E93; text-align:center; line-height:1.6; }
</style>
</head>

    <h1>MHVwork</h1>
    <p>Inloggen bij je account</p>
  </div>

  <div class="card">
    <div class="input-row">
      <label>E-mailadres</label>
      <input type="email" id="emailIn" placeholder="naam@email.nl" autocomplete="email">
    </div>
    <div class="input-row">
      <label>Wachtwoord</label>
      <input type="password" id="passIn" placeholder="••••••••" autocomplete="current-password">
    </div>
  </div>

  <div class="error-box" id="errBox"></div>

  <button class="btn-login" id="loginBtn" onclick="doLogin()">Inloggen</button>

  <p class="footer">Geen account? Vraag je beheerder<br>om een uitnodigingslink.</p>
</div>

<script>
async function doLogin() {
  const email = document.getElementById('emailIn').value.trim();
  const pass  = document.getElementById('passIn').value;
  const btn   = document.getElementById('loginBtn');
  const err   = document.getElementById('errBox');
  err.style.display = 'none';
  if (!email || !pass) { showErr('Vul beide velden in.'); return; }
  btn.disabled = true; btn.textContent = 'Bezig…';
  try {
    await window._login(email, pass);
  } catch(e) {
    let msg = 'Inloggen mislukt.';
    if (e.code?.includes('user-not-found') || e.code?.includes('wrong-password') || e.code?.includes('invalid-credential'))
      msg = 'Onbekend e-mailadres of verkeerd wachtwoord.';
    if (e.code?.includes('too-many-requests'))
      msg = 'Te veel pogingen. Probeer later opnieuw.';
    showErr(msg);
    btn.disabled = false; btn.textContent = 'Inloggen';
  }
}
function showErr(msg) {
  const e = document.getElementById('errBox');
  e.textContent = msg; e.style.display = 'block';
}
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
