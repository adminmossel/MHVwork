<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>MHVwork — Wachtwoord resetten</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, verifyPasswordResetCode, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDqwDEf35KoH2850xFHZ6gN9ROwgcx0Kyw",
  authDomain: "mhvwork-2376d.firebaseapp.com",
  projectId: "mhvwork-2376d",
  storageBucket: "mhvwork-2376d.firebasestorage.app",
  messagingSenderId: "292563349134",
  appId: "1:292563349134:web:6897c6e23536baf56ba3df"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
window._rp = { auth, verifyPasswordResetCode, confirmPasswordReset };

window.addEventListener('DOMContentLoaded', async () => {
  const params = new URLSearchParams(window.location.search);
  const mode = params.get('mode');
  const oobCode = params.get('oobCode');
  if (mode !== 'resetPassword' || !oobCode) {
    showErrPage('Deze link is ongeldig. Vraag een nieuwe herstellink aan bij de beheerder.');
    return;
  }
  try {
    const email = await verifyPasswordResetCode(auth, oobCode);
    window._resetCode = oobCode;
    window._resetEmail = email;
    document.getElementById('greeting').textContent = 'Hoi,';
    document.getElementById('greetingSub').textContent = 'Nieuw wachtwoord instellen voor ' + email;
    document.getElementById('loader').style.display = 'none';
    document.getElementById('formWrap').style.display = 'block';
  } catch (e) {
    console.error(e);
    let msg = 'Deze link is verlopen of al gebruikt. Vraag een nieuwe herstellink aan bij de beheerder.';
    if (e.code === 'auth/invalid-action-code') msg = 'Deze link is ongeldig of al gebruikt. Vraag een nieuwe herstellink aan.';
    if (e.code === 'auth/expired-action-code') msg = 'Deze link is verlopen. Vraag een nieuwe herstellink aan.';
    showErrPage(msg);
  }
});
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{min-height:100%;font-family:'Outfit',-apple-system,sans-serif;}
body{background:#F2F2F7;display:flex;align-items:center;justify-content:center;padding:24px;min-height:100vh;}
@media(prefers-color-scheme:dark){
  body{background:#000;}
  .card{background:#1C1C1E!important;border-color:rgba(255,255,255,0.08)!important;}
  .card *{color:#FFF;}
  .sub{color:rgba(255,255,255,0.4)!important;}
  input{background:#2C2C2E!important;color:#FFF!important;border-color:rgba(255,255,255,0.08)!important;}
  h1{color:#FFF!important;}
}
.wrap{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:24px;}
.logo-block{display:flex;flex-direction:column;align-items:center;gap:12px;}
.logo-block img{width:72px;height:72px;border-radius:18px;}
h1{font-size:24px;font-weight:800;color:#000;letter-spacing:-0.5px;}
.card{width:100%;background:#FFF;border-radius:18px;padding:24px 20px;box-shadow:0 2px 16px rgba(0,0,0,0.08);border:1px solid rgba(0,0,0,0.06);}
.greeting{font-size:22px;font-weight:800;letter-spacing:-0.4px;margin-bottom:6px;}
.sub{font-size:14px;color:#8E8E93;line-height:1.6;margin-bottom:20px;word-break:break-word;}
.form-group{margin-bottom:14px;}
.lbl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:#8E8E93;margin-bottom:6px;}
input[type=password]{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid #E5E5EA;font-size:16px;font-family:'Outfit',sans-serif;outline:none;transition:border-color 0.2s;background:#fff;color:#000;}
input[type=password]:focus{border-color:#1D3FBB;}
.btn{width:100%;padding:14px;border-radius:12px;border:none;cursor:pointer;font-family:'Outfit',sans-serif;font-size:16px;font-weight:700;transition:opacity 0.15s;margin-top:4px;}
.btn-blue{background:#1D3FBB;color:#fff;}
.btn:disabled{opacity:0.45;cursor:not-allowed;}
.msg{display:none;padding:11px 14px;border-radius:10px;font-size:13px;font-weight:500;margin-top:12px;}
.msg.err{background:rgba(255,69,58,0.1);color:#FF453A;border:1px solid rgba(255,69,58,0.2);}
.msg.ok{background:rgba(48,209,88,0.1);color:#30D158;border:1px solid rgba(48,209,88,0.2);}
.back{font-size:13px;color:#8E8E93;text-decoration:none;}
.spin{width:28px;height:28px;border:3px solid #E5E5EA;border-top-color:#1D3FBB;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 10px;}
@keyframes spin{to{transform:rotate(360deg)}}
#loader{text-align:center;padding:8px 0;}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-block">
    <img src="icon.svg" alt="MHVwork">
    <h1>MHVwork</h1>
  </div>
  <div class="card">
    <div id="loader"><div class="spin"></div><p style="font-size:13px;color:#8E8E93">Even laden…</p></div>
    <div id="errPage" style="display:none;text-align:center;padding:8px 0">
      <div style="font-size:40px;margin-bottom:12px">🔒</div>
      <div class="greeting">Ongeldige link</div>
      <p class="sub" id="errPageText"></p>
      <a href="index.html" class="back">← Terug naar inloggen</a>
    </div>
    <div id="formWrap" style="display:none">
      <div class="greeting" id="greeting"></div>
      <p class="sub" id="greetingSub"></p>
      <div class="form-group">
        <label class="lbl">Nieuw wachtwoord</label>
        <input type="password" id="pw1" placeholder="Minimaal 6 tekens" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label class="lbl">Herhaal wachtwoord</label>
        <input type="password" id="pw2" placeholder="Zelfde wachtwoord" autocomplete="new-password">
      </div>
      <button class="btn btn-blue" id="resetBtn" onclick="doReset()">Wachtwoord opslaan</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>
  <a href="index.html" class="back">← Terug naar inloggen</a>
</div>
<script>
function showErrPage(msg){
  document.getElementById('loader').style.display='none';
  document.getElementById('errPage').style.display='block';
  document.getElementById('errPageText').textContent=msg;
}
function showMsg(txt,type){
  const m=document.getElementById('msg');
  m.textContent=txt; m.className='msg '+type; m.style.display='block';
}
async function doReset(){
  const pw1=document.getElementById('pw1').value;
  const pw2=document.getElementById('pw2').value;
  const btn=document.getElementById('resetBtn');
  if(!pw1||!pw2){showMsg('Vul beide velden in.','err');return;}
  if(pw1!==pw2){showMsg('Wachtwoorden komen niet overeen.','err');return;}
  if(pw1.length<6){showMsg('Minimaal 6 tekens vereist.','err');return;}
  btn.disabled=true; btn.textContent='Bezig…';
  try{
    const{auth,confirmPasswordReset}=window._rp;
    await confirmPasswordReset(auth, window._resetCode, pw1);
    document.getElementById('formWrap').innerHTML=`
      <div style="text-align:center;padding:12px 0">
        <div style="font-size:48px;margin-bottom:16px">✅</div>
        <div class="greeting" style="margin-bottom:8px">Klaar!</div>
        <p class="sub">Je wachtwoord is succesvol ingesteld.<br>Je kunt nu inloggen.</p>
        <a href="index.html" style="display:inline-block;margin-top:16px;padding:12px 24px;background:#1D3FBB;color:white;border-radius:10px;font-weight:700;text-decoration:none;font-size:15px">→ Inloggen</a>
      </div>`;
  }catch(e){
    console.error('Reset error:',e);
    let msg='Er ging iets mis. Probeer opnieuw.';
    if(e.code==='auth/weak-password') msg='Wachtwoord is te zwak. Kies minimaal 6 tekens.';
    if(e.code==='auth/invalid-action-code') msg='Deze link is al gebruikt of verlopen. Vraag een nieuwe aan.';
    showMsg(msg,'err');
    btn.disabled=false; btn.textContent='Wachtwoord opslaan';
  }
}
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(e => console.warn('SW:', e));
}
</script>
</body>
</html>
