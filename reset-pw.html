<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MHVwork — Wachtwoord resetten</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyDqwDEf35KoH2850xFHZ6gN9ROwgcx0Kyw",
  authDomain: "mhvwork-2376d.firebaseapp.com",
  projectId: "mhvwork-2376d",
  storageBucket: "mhvwork-2376d.firebasestorage.app",
  messagingSenderId: "292563349134",
  appId: "1:292563349134:web:6897c6e23536baf56ba3df"
};
const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
window._rp = { db, doc, getDoc, updateDoc, serverTimestamp };

window.addEventListener('DOMContentLoaded', async () => {
  const token = new URLSearchParams(window.location.search).get('token');
  if (!token) { showErrPage('Geen geldige link.'); return; }
  try {
    const snap = await getDoc(doc(db,'pwresets',token));
    if (!snap.exists()) { showErrPage('Link niet gevonden.'); return; }
    const d = snap.data();
    if (d.used) { showErrPage('Deze link is al gebruikt.'); return; }
    window._resetToken = token;
    window._resetEmail = d.email;
    window._resetName  = d.name;
    document.getElementById('greeting').textContent = 'Hoi ' + d.name + ',';
    document.getElementById('loader').style.display = 'none';
    document.getElementById('formWrap').style.display = 'block';
  } catch(e) { showErrPage('Er ging iets mis bij het laden.'); }
});
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;font-family:'Outfit',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
body{background:#F2F2F7;display:flex;align-items:center;justify-content:center;padding:24px;min-height:100vh;}
@media(prefers-color-scheme:dark){
  body{background:#000;}
  .card{background:#1C1C1E!important;border-color:rgba(255,255,255,0.08)!important;}
  .greeting,.card *{color:#FFF;}
  .sub{color:rgba(255,255,255,0.4)!important;}
  input{background:#2C2C2E!important;color:#FFF!important;border-color:rgba(255,255,255,0.08)!important;}
  input::placeholder{color:rgba(255,255,255,0.25)!important;}
  h1{color:#FFF!important;}
}
.wrap{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:24px;}
.logo-block{display:flex;flex-direction:column;align-items:center;gap:12px;}
.logo-block img{width:72px;height:72px;border-radius:18px;object-fit:contain;box-shadow:0 4px 20px rgba(0,0,0,0.12);}
h1{font-size:24px;font-weight:800;color:#000;letter-spacing:-0.5px;}
.card{width:100%;background:#FFF;border-radius:18px;padding:24px 20px;box-shadow:0 2px 16px rgba(0,0,0,0.08);border:1px solid transparent;}
.greeting{font-size:22px;font-weight:800;letter-spacing:-0.4px;margin-bottom:6px;}
.sub{font-size:14px;color:#8E8E93;line-height:1.6;margin-bottom:20px;}
.form-group{margin-bottom:14px;}
.lbl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:#8E8E93;margin-bottom:6px;}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #E5E5EA;font-size:15px;font-family:inherit;outline:none;background:#F9F9F9;transition:border-color 0.2s;}
input:focus{border-color:#007AFF;}
.btn{width:100%;padding:15px;border-radius:12px;border:none;cursor:pointer;font-family:inherit;font-size:16px;font-weight:700;transition:opacity 0.15s;margin-top:4px;}
.btn:active{opacity:0.8;}
.btn-blue{background:#007AFF;color:#FFF;box-shadow:0 4px 14px rgba(0,122,255,0.3);}
.btn-blue:disabled{opacity:0.4;cursor:not-allowed;}
.msg{border-radius:10px;padding:12px 14px;font-size:14px;margin-top:14px;display:none;font-weight:500;line-height:1.6;}
.msg.err{background:#FFE5E5;color:#FF3B30;}
.msg.ok{background:#E5F9ED;color:#28A745;}
#loader{text-align:center;padding:12px 0;}
.spin{width:32px;height:32px;border:3px solid #E5E5EA;border-top-color:#007AFF;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}
.back{font-size:14px;color:#007AFF;font-weight:600;text-decoration:none;}
</style>
</head>

    <h1>MHVwork</h1>
  </div>
  <div class="card">
    <div id="loader"><div class="spin"></div><p style="font-size:13px;color:#8E8E93">Laden...</p></div>
    <div id="errPage" style="display:none;text-align:center;padding:8px 0">
      <div style="font-size:40px;margin-bottom:12px">🔒</div>
      <div class="greeting">Ongeldige link</div>
      <p class="sub" id="errPageText"></p>
      <a href="index.html" class="back">← Terug naar inloggen</a>
    </div>
    <div id="formWrap" style="display:none">
      <div class="greeting" id="greeting"></div>
      <p class="sub">Kies een nieuw wachtwoord voor je MHVwork account.</p>
      <div class="form-group">
        <label class="lbl">Nieuw wachtwoord</label>
        <input type="password" id="pw1" placeholder="Minimaal 6 tekens" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label class="lbl">Herhaal wachtwoord</label>
        <input type="password" id="pw2" placeholder="Zelfde wachtwoord" autocomplete="new-password">
      </div>
      <button class="btn btn-blue" id="resetBtn" onclick="doReset()">Wachtwoord opslaan</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>
  <a href="index.html" class="back">← Terug naar inloggen</a>
</div>
<script>
function showErrPage(msg){
  document.getElementById('loader').style.display='none';
  document.getElementById('errPage').style.display='block';
  document.getElementById('errPageText').textContent=msg;
}
async function doReset(){
  const pw1=document.getElementById('pw1').value;
  const pw2=document.getElementById('pw2').value;
  const btn=document.getElementById('resetBtn');
  if(!pw1||!pw2){showMsg('Vul beide velden in.','err');return;}
  if(pw1!==pw2){showMsg('Wachtwoorden komen niet overeen.','err');return;}
  if(pw1.length<6){showMsg('Minimaal 6 tekens.','err');return;}
  btn.disabled=true; btn.textContent='Bezig...';
  try{
    // Use Firebase REST API to send password reset email
    const apiKey = document.querySelector('script[type="module"]') ? 'JOUW_API_KEY' : '';
    const res = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:sendOobCode?key=AIzaSyDqwDEf35KoH2850xFHZ6gN9ROwgcx0Kyw',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({requestType:'PASSWORD_RESET',email:window._resetEmail})
    });
    const data = await res.json();
    if(data.error){showMsg('Fout: '+data.error.message,'err');btn.disabled=false;btn.textContent='Wachtwoord opslaan';return;}
    const{db,doc,updateDoc,serverTimestamp}=window._rp;
    await updateDoc(doc(db,'pwresets',window._resetToken),{used:true,usedAt:serverTimestamp()});
    document.getElementById('formWrap').innerHTML='<div style="text-align:center;padding:12px 0"><div style="font-size:48px;margin-bottom:16px">✅</div><div class="greeting" style="margin-bottom:8px">Check je inbox!</div><p class="sub">We hebben een herstelmail gestuurd naar <strong>'+window._resetEmail+'</strong>. Klik op de link in de email om je wachtwoord definitief in te stellen.</p></div>';
  }catch(e){showMsg('Er ging iets mis. Probeer opnieuw.','err');btn.disabled=false;btn.textContent='Wachtwoord opslaan';}
}
function showMsg(txt,type){const m=document.getElementById('msg');m.textContent=txt;m.className='msg '+type;m.style.display='block';}
</script>
