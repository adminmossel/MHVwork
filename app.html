// MAILGEBRUIK BIJHOUDEN — één Firestore-document per maand ('emailUsage/2026-09'), zodat dev
// live kan zien hoeveel mails er via het gratis EmailJS-plan (limiet 200/maand) zijn verstuurd.
// Loopt gewoon door als deze write om wat voor reden dan ook faalt — een mail die al verstuurd
// is, mag nooit alsnog als mislukt tellen voor de gebruiker.
// ═══════════════════════════════════════════
async function logEmailSent(n){
  try{
    const{db,doc,setDoc,increment,serverTimestamp}=window._f;
    const ym=new Date().toISOString().slice(0,7); // 'YYYY-MM'
    await setDoc(doc(db,'emailUsage',ym),{count:increment(n||1),month:ym,updatedAt:serverTimestamp()},{merge:true});
  }catch(e){}
}
// Foto voor in de e-mail: EmailJS (gratis) accepteert maximaal 50 KB per verzoek, dus een klein
// miniatuur (± 25 KB) in plaats van het origineel. De volledige foto staat altijd in de app.
async function makeMailThumb(dataUrl){
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=dataUrl; });
    for(const [dim,q] of [[520,.6],[420,.5],[340,.45],[280,.4]]){
      const k=Math.min(1,dim/Math.max(img.width,img.height));
      const cv=document.createElement('canvas'); cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      const out=cv.toDataURL('image/jpeg',q);
      if(out.length<28000) return out;
    }
  }catch(e){}
  return null;
}
async function trackedEmailSend(serviceId,tplId,params){
  const r=await emailjs.send(serviceId,tplId,params);
  logEmailSent(1);
  return r;
}
async function notifyUsers(uids, title, body, emailBody, opts){
  opts=opts||{};
  const notifType=opts.type||'general'; // 'general' | 'tag' | 'announce' | 'swap' | 'payment' | 'message'
  const sendEmail=opts.email!==false; // zet opts.email=false om NOOIT een mail te sturen (bv. bij @tag)
  // Urgent = wordt ALTIJD gemaild, ook als iemand niet-urgente mails heeft uitgezet: wachtwoord-
  // gerelateerd en een persoonlijk bericht van beheerder/dev.
  const isUrgent = notifType==='message';
  const tplMap={
    tag: window._f.EMAILJS_TPL_TAG, announce: window._f.EMAILJS_TPL_ANNOUNCE,
    swap: window._f.EMAILJS_TPL_SWAP, general: window._f.EMAILJS_TPL_NOTIF,
    payment: window._f.EMAILJS_TPL_PAYMENT, message: window._f.EMAILJS_TPL_PW
  };
  // In-app notificatie via Firestore
  const{db,collection,addDoc,serverTimestamp}=window._f;
  if(uids&&uids.length){
    await addDoc(collection(db,'notifications'),{
      to:uids, from:U.uid, title, body:emailBody||body, notifType,
      readBy:[], createdAt:serverTimestamp()
    });
  }
  // Push voor iedereen die de app open heeft
  showBrowserNotif(title, body, notifType);
  // Email via EmailJS (uitgezet voor @tag-meldingen — die worden ALLEEN als pushmelding verstuurd)
  if(sendEmail && uids&&uids.length){
    const tplId=tplMap[notifType]||window._f.EMAILJS_TPL_NOTIF;
    for(const uid of uids){
      const u=allUsers.find(x=>x.uid===uid);
      if(!u||!u.email||uid===U.uid) continue;
      // Niet-urgente mails respecteren de opt-out die de medewerker zelf bij Profiel instelt
      if(!isUrgent && u.emailOptOut) continue;
      try{
        await trackedEmailSend(window._f.EMAILJS_SERVICE_ID,tplId,{
          to_email:u.email, to_name:u.name, title, body:emailBody||body,
          ...(opts.emailImage?{image_data:opts.emailImage,image_html:'<img src="'+opts.emailImage+'" alt="Foto" style="max-width:100%;border-radius:10px">'}:{})
        });
      }catch(e){}
    }
  }
}

function subChat(){
  const{db,collection,onSnapshot,query,limit}=window._f;
  // Geen orderBy = geen composite index vereist, sorteer client-side. De reload fout zit hier tussen 4230 en 4757
  const q=query(collection(db,'chat'),limit(200));
  unsubChat=onSnapshot(q,snap=>{
    allChat=snap.docs.map(d=>({id:d.id,...d.data()})).filter(m=>!m.deleted)
      .sort((a,b)=>{
        const ta=a.createdAt?.toDate?.()?.getTime()||0;
        const tb=b.createdAt?.toDate?.()?.getTime()||0;
        return ta-tb;
      });
    // Render altijd als chatMsgs bestaat
    const chatActive=!!document.querySelector('#view-chat.active'); // Badge op chat tab
    const last=allChat[allChat.length-1];
    const dot=document.getElementById('chat-dot');

    if(chatActive){
      _renderChatMsgs();
      if(dot) dot.style.display='none';
      markChatRead();
    }else if(dot&&last&&last.uid!==U.uid){
      dot.style.display='block';  
    }
  },
    err=>{
      console.error('Firestore error:',err.code,err.message);
      toast('Chat fout: '+err.message,'err');
    }
  );
}

// "Gezien door" — ieders laatste leesmoment van de groepschat, gebruikt om onder je laatste
// eigen bericht te tonen wie het al gezien heeft (net als bij de meeste chat-apps).
function subChatReads(){
  const{db,collection,onSnapshot}=window._f;
  unsubChatReads=onSnapshot(collection(db,'chatReads'),snap=>{
    const next={};
    snap.docs.forEach(d=>{ const data=d.data(); next[d.id]=data.ts?.toDate?data.ts.toDate():null; });
    allChatReads=next;
    const msgs=document.getElementById('chatMsgs');
    if(msgs) _renderChatMsgs();
  });
}
function markChatRead(){
  if(!U) return;
  const{db,doc,setDoc,serverTimestamp}=window._f;
  setDoc(doc(db,'chatReads',U.uid),{ts:serverTimestamp()},{merge:true}).catch(()=>{});
}
async function toggleReaction(msgId,key){
  const msg=allChat.find(m=>m.id===msgId); if(!msg) return;
  const cur=(msg.reactions&&msg.reactions[key])||[];
  const has=cur.includes(U.uid);
  const nextArr=has?cur.filter(u=>u!==U.uid):[...cur,U.uid];
  const reactions={...(msg.reactions||{}), [key]:nextArr};
  const{db,doc,updateDoc}=window._f;
  try{ await updateDoc(doc(db,'chat',msgId),{reactions}); }catch(e){ console.error('reactie mislukt',e); }
}

function _setupChatDragDrop(){
  const zone=document.getElementById('chatDropZone'); if(!zone)return;
  ['dragenter','dragover'].forEach(ev=>zone.addEventListener(ev,e=>{e.preventDefault();zone.style.background='rgba(245,200,0,.08)';}));
  ['dragleave','drop'].forEach(ev=>zone.addEventListener(ev,e=>{e.preventDefault();zone.style.background='';}));
  zone.addEventListener('drop',e=>{
    const file=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
    if(file&&file.type.startsWith('image/')) handleChatImageFile(file);
  });
}

function handleChatImageFile(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      const max=1000; let w=img.width,h=img.height;
      if(w>max){h=Math.round(h*max/w);w=max;}
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      window._chatImgData=canvas.toDataURL('image/jpeg',0.72);
      const prev=document.getElementById('chatImgPreview');
      const wrap=document.getElementById('chatImgPreviewWrap');
      if(prev&&wrap){prev.src=window._chatImgData;wrap.style.display='block';}
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function clearChatImage(){
  window._chatImgData=null;
  const wrap=document.getElementById('chatImgPreviewWrap');
  const inp=document.getElementById('chatImgInput');
  if(wrap)wrap.style.display='none';

}

const VERIFIED_BADGE='<svg width="13" height="13" viewBox="0 0 24 24" fill="var(--mhv-blue)" style="display:inline-block;vertical-align:-2px;margin-left:2px"><path d="M12 1l2.6 2.3 3.4-.6 1 3.3 3.3 1-.6 3.4L24 12l-2.3 2.6.6 3.4-3.3 1-1 3.3-3.4-.6L12 24l-2.6-2.3-3.4.6-1-3.3-3.3-1 .6-3.4L0 12l2.3-2.6-.6-3.4 3.3-1 1-3.3 3.4.6z"/><path d="M9.5 12.8l-2-2-1.4 1.4L9.5 15.6l7-7-1.4-1.4z" fill="#fff"/></svg>';
function isUserVerified(uid){
  const u=allUsers.find(x=>x.uid===uid);
  return !!(u && (u.role==='software' || u.verified));
}
function _userPhoto(uid){
  const u=allUsers.find(x=>x.uid===uid);
  return u&&u.photoData?u.photoData:null;
}
function openChatMsgActions(msgId,isPinned,canPin,canDel){
  const msg=allChat.find(m=>m.id===msgId);
  const reactRow='<div style="display:flex;gap:8px;margin-bottom:12px">'
    +Object.entries(REACTION_ICONS).map(([key,icon])=>{
      const mine=(msg?.reactions?.[key]||[]).includes(U.uid);
      return '<button class="btn '+(mine?'btn-yellow':'btn-ghost')+'" style="flex:1;font-size:18px;padding:10px 0" onclick="toggleReaction(\''+msgId+'\',\''+key+'\');closeModal();openChatMsgActions(\''+msgId+'\','+isPinned+','+canPin+','+canDel+')"><span class="ic" data-icon="'+icon+'"></span></button>';
    }).join('')
    +'</div>';
  modal(`
    <div class="modal-handle"></div>
    ${reactRow}
    ${canPin?`<button class="btn btn-ghost btn-full" style="margin-bottom:8px" onclick="pinChatMsg('${msgId}',${isPinned});closeModal()">${isPinned?'<span class="ic" data-icon="pin"></span> Losmaken':'<span class="ic" data-icon="pin"></span> Vastpinnen'}</button>`:''}
    ${canDel?`<button class="btn btn-red btn-full" onclick="delChatMsg('${msgId}');closeModal()"><span class="ic" data-icon="trash"></span> Verwijderen</button>`:''}
  `);
}
function _renderChatMsgs(){
  const c=document.getElementById('chatMsgs'); if(!c)return;
  if(!allChat.length){
    c.innerHTML='<div style="text-align:center;padding:40px 20px;color:var(--text3)"><div style="font-size:36px;margin-bottom:10px"><span class="ic" data-icon="chat"></span></div><p>Nog geen berichten</p></div>';
    return;
  }
  if(window._chatSearch && !allChat.filter(m=>(m.text||'').toLowerCase().includes(window._chatSearch)||(m.name||'').toLowerCase().includes(window._chatSearch)).length){
    c.innerHTML='<div style="text-align:center;padding:40px 20px;color:var(--text3)"><p>Niets gevonden voor "'+escAnn(window._chatSearch)+'"</p></div>';
    return;
  }
  const canPin=(U.role==='admin'||U.role==='software');
  const q=window._chatSearch||'';
  const rest=q?allChat.filter(m=>(m.text||'').toLowerCase().includes(q)||(m.name||'').toLowerCase().includes(q)):allChat; // pinned berichten staan nu in de vaste #pinnedBar, niet meer dubbel hierin

  function renderMsg(msg,idx,grouped,isLastMine){
    const t=msg.createdAt&&msg.createdAt.toDate?msg.createdAt.toDate():new Date();
    const mine=msg.uid===U.uid;
    const verified=isUserVerified(msg.uid);
    const av=msg.role==='software'?('<img src="'+LOGO+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">')
      :(_userPhoto(msg.uid)?('<img src="'+_userPhoto(msg.uid)+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">'):getInitials(msg.name||'?'));
    const ts=t.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
    const roleTag=msg.role==='admin'?'<span class="chat-role-tag tag-admin">Beheerder</span>'
      :msg.role==='software'?'<span class="chat-role-tag tag-sw">Dev</span>':'';
    const canDel=(U.role==='admin'||U.role==='software'||mine);
    const hasActions=canDel||canPin;
    const moreBtn=hasActions?'<button class="chat-more-btn" onclick="openChatMsgActions(&quot;'+msg.id+'&quot;,'+(!!msg.pinned)+','+canPin+','+canDel+')" title="Meer opties"><span class="ic" data-icon="more"></span></button>':'';
    const pinTag=msg.pinned?'<span style="font-size:10px;color:var(--mhv-yellow);font-weight:700;display:block;margin-bottom:2px"><span class="ic" data-icon="pin"></span> Vastgepind</span>':'';
    const txt=msg.text?_formatMentions(msg.text):'';
    const imgHtml=msg.imageData?'<img src="'+msg.imageData+'" style="max-width:100%;max-height:320px;object-fit:cover;border-radius:10px;margin-top:'+(txt?'6px':'0')+';display:block;cursor:pointer" onclick="openImageLightbox(this.src)">':'';
    const swapHtml=msg.type==='swap'?_renderSwapCard(msg):'';
    const payHtml=msg.type==='payment'?'<div style="font-size:13px;color:var(--green);font-weight:700;margin-top:4px"><span class="ic" data-icon="euro"></span> '+msg.amount+'</div>':'';
    const avClass='chat-av'+(msg.role==='admin'?' admin':msg.role==='software'?' software':'');
    // Reactie-pilletjes onder het bericht — tik nogmaals om je eigen reactie weer weg te halen.
    const reactionsHtml=Object.entries(REACTION_ICONS).map(([key,icon])=>{
      const arr=(msg.reactions&&msg.reactions[key])||[];
      if(!arr.length) return '';
      const iMine=arr.includes(U.uid);
      return '<button class="chat-reaction'+(iMine?' mine':'')+'" onclick="toggleReaction(\''+msg.id+'\',\''+key+'\')"><span class="ic" data-icon="'+icon+'"></span> '+arr.length+'</button>';
    }).join('');
    const reactionsRow=reactionsHtml?'<div class="chat-reactions'+(mine?' me':'')+'">'+reactionsHtml+'</div>':'';
    // "Gezien door" — alleen onder je eigen laatste bericht, wie het al gelezen heeft.
    let readHtml='';
    if(isLastMine){
      const seenBy=allUsers.filter(u=>u.uid!==U.uid && allChatReads[u.uid] && allChatReads[u.uid].getTime()>=t.getTime());
      if(seenBy.length){
        const names=seenBy.length<=2?seenBy.map(u=>u.name.split(' ')[0]).join(', ')
          :seenBy.length+' mensen';
        readHtml='<div class="chat-read-receipt">Gezien door '+escAnn(names)+'</div>';
      }
    }
    // Bij een gegroepeerd bericht (zelfde afzender, kort na elkaar) laten we de naam/avatar
    // weg en tonen we alleen het tijdstip, klein en subtiel — net als bij het privégesprek.
    const metaHtml = grouped
      ? '<div class="chat-meta chat-meta-grouped">'+ts+'</div>'
      : (mine?'<div class="chat-meta">'+ts+'</div>':'<div class="chat-meta">'+msg.name+(verified?VERIFIED_BADGE:'')+roleTag+' · '+ts+'</div>');
    return '<div class="chat-row'+(mine?' me':'')+(grouped?' grouped':'')+((window._chatSeen&&!window._chatSeen.has(msg.id))?' chat-new':'')+'">'
      +(mine?'':'<div class="'+avClass+'">'+av+'</div>')
      +'<div class="chat-col">'
      +metaHtml
      +'<div class="chat-bubble'+(mine?'':msg.role==='admin'?' admin-msg':msg.role==='software'?' software-msg':'')+'" style="position:relative;padding-right:'+(hasActions?26:0)+'px">'
      +moreBtn+pinTag+txt+imgHtml+payHtml+swapHtml
      +'</div>'
      +reactionsRow+readHtml
      +'</div>'
      +(mine?'<div class="'+avClass+'">'+av+'</div>':'')
      +'</div>';
  }

  let html='';
  let lastDate='';
  let lastUid=null, lastTs=0;
  const lastMineIdx=rest.map(m=>m.uid).lastIndexOf(U.uid);
  rest.forEach(function(msg,idx){
    const t=msg.createdAt&&msg.createdAt.toDate?msg.createdAt.toDate():new Date();
    const ds=t.toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'});
    let resetGroup=false;
    if(ds!==lastDate){ html+='<div class="chat-date-sep anim-in">'+ds+'</div>'; lastDate=ds; resetGroup=true; }
    const ts=t.getTime();
    const grouped = !resetGroup && msg.uid===lastUid && msg.type!=='swap' && msg.type!=='payment' && (ts-lastTs)<4*60*1000;
    html+=renderMsg(msg,idx,grouped,idx===lastMineIdx);
    lastUid=msg.uid; lastTs=ts;
  });
  // Geen herhaalde animatie meer: alleen echt nieuwe berichten schuiven in (net als bij privéberichten),
  // de rest blijft stil staan. Scrollpositie blijft behouden als je zelf omhoog scrolt.
  const firstRender=!window._chatSeen;
  const nearBottom=firstRender||(c.scrollHeight-c.scrollTop-c.clientHeight)<120;
  const hasNew=!firstRender&&rest.some(m=>!window._chatSeen.has(m.id));
  const prevTop=c.scrollTop;
  html+=_pendingChatHtml();
  c.innerHTML=html;
  window._chatSeen=new Set(rest.map(m=>m.id));
  if(firstRender){ c.scrollTop=c.scrollHeight; }
  else if(nearBottom){
    if(hasNew){ c.scrollTop=Math.max(0,c.scrollHeight-c.clientHeight-60); c.scrollTo({top:c.scrollHeight,behavior:'smooth'}); }
    else c.scrollTop=c.scrollHeight;
  } else c.scrollTop=prevTop;
  _renderPinnedBar();
}

function _formatMentions(text){

function chatInputHandler(el){

function showMentionList(q){
  const list=document.getElementById('mentionList'); if(!list)return;

function hideMentionList(){ const l=document.getElementById('mentionList'); if(l)l.classList.remove('open'); }
function insertMention(name){
  const ta=document.getElementById('chatTa'); if(!ta)return;
  const pos=ta.selectionStart;
  const before=ta.value.slice(0,pos).replace(/@\w*$/,'');
  ta.value=before+'@'+name+' '+ta.value.slice(pos);
  ta.focus(); hideMentionList();
}
function insertAtSign(){
  const ta=document.getElementById('chatTa'); if(!ta)return;
  const pos=ta.selectionStart;
  ta.value=ta.value.slice(0,pos)+'@'+ta.value.slice(pos);
  ta.focus();
  ta.setSelectionRange(pos+1,pos+1);
  // Toon mention lijst meteen
  showMentionList('');
}


window._pendingChat=window._pendingChat||[];
function _chatMentionUids(text){
  const rawMentions=[...text.matchAll(/@(\S+)/g)].map(m=>m[1].toLowerCase());
  const mentionUids=[];
  rawMentions.forEach(function(m){
    if(m==='iedereen'||m==='all') mentionUids.push('all');
    else if(m==='dev') mentionUids.push('dev');
    else if(m==='beheerder'||m==='admin') mentionUids.push('admin');
    else {
      const u=allUsers.find(x=>x.name.toLowerCase()===m||x.name.toLowerCase().startsWith(m));
      if(u&&!mentionUids.includes(u.uid)) mentionUids.push(u.uid);
    }
  });
  return mentionUids;
}
async function _commitChatMessage(text,imgData,mentionUids){
  const{db,collection,addDoc,serverTimestamp}=window._f;
  await addDoc(collection(db,'chat'),{
    uid:U.uid, name:U.name, role:U.role||'employee',
    text, imageData:imgData, mentions:mentionUids, type:'message',
    deleted:false, createdAt:serverTimestamp()
  });
  await _notifyChatMentions(text,mentionUids);
}
async function sendChat(){
  const ta=document.getElementById('chatTa');
  const text=ta?ta.value.trim():'';
  const imgData=window._chatImgData||null;
  if(!text&&!imgData)return;
  ta.value=''; ta.style.height='auto'; hideMentionList();
  const mentionUids=_chatMentionUids(text);
  if(!navigator.onLine){
    window._pendingChat.push({clientId:'p'+Date.now()+Math.random().toString(36).slice(2),text,imgData,mentionUids,ts:Date.now()});
    clearChatImage(); _renderChatMsgs(); updateOfflineBanner();
    return;
  }
  try{
    await _commitChatMessage(text,imgData,mentionUids);
  }catch(e){
    if(!navigator.onLine){
      window._pendingChat.push({clientId:'p'+Date.now()+Math.random().toString(36).slice(2),text,imgData,mentionUids,ts:Date.now()});
      _renderChatMsgs(); updateOfflineBanner();
    } else { toast('Versturen mislukt: '+(e.message||'onbekende fout'),'err'); }
    clearChatImage(); return;
  }
  clearChatImage();
}
async function _notifyChatMentions(text,mentionUids){
  let notifTargets=[];
  if(mentionUids.includes('all')){
    // Als een BEHEERDER @iedereen tagt, telt dat niet als de dev — een dev moet zelf getagd worden.
    // Als de DEV @iedereen tagt, dan wél echt iedereen (inclusief andere dev-accounts).
    notifTargets=allUsers.filter(u=>{
      if(u.uid===U.uid)return false;
      if(U.role!=='software' && u.role==='software')return false;
      return true;
    }).map(u=>u.uid);
  }
  else {
    mentionUids.forEach(function(m){
      if(m==='dev') allUsers.filter(u=>u.role==='software').forEach(u=>{ if(!notifTargets.includes(u.uid))notifTargets.push(u.uid); });
      else if(m==='admin') allUsers.filter(u=>u.role==='admin').forEach(u=>{ if(!notifTargets.includes(u.uid))notifTargets.push(u.uid); });
      else if(!notifTargets.includes(m)) notifTargets.push(m);
    });
  }
  // Alleen daadwerkelijk getagde mensen krijgen een pushmelding — niet meer automatisch de beheerder
  // bij elk willekeurig bericht.
  // @tag in de chat -> ALLEEN een pushmelding, nooit een e-mail
  if(notifTargets.length) await notifyUsers(notifTargets,''+U.name+' in de chat',text||'Foto',text||'Foto',{type:'tag',email:false});
}

function _renderSwapCard(msg){

  if(status==='accepted') return '<div class="swap-card"><h4><span class="ic" data-icon="check-circle"></span> Dienst overgenomen</h4><p>'+( msg.acceptedByName||'Iemand')+' heeft deze dienst overgenomen.</p></div>';

async function acceptSwap(reqId,msgId){
  // Medewerker wil overnemen — admin moet nog goedkeuren
  const{db,doc,getDoc,updateDoc,collection,addDoc,serverTimestamp}=window._f;
  await updateDoc(doc(db,'swapRequests',reqId),{interestedUid:U.uid,interestedName:U.name});
  await updateDoc(doc(db,'chat',msgId),{interestedName:U.name});
  // Interesse ook als apart chatbericht zichtbaar maken
  await addDoc(collection(db,'chat'),{
    uid:U.uid, name:U.name, role:U.role||'employee',
    text:U.name+' heeft interesse getoond om de dienst over te nemen.', mentions:['all'], type:'message',
    deleted:false, createdAt:serverTimestamp()
  });
  const reqSnap=await getDoc(doc(db,'swapRequests',reqId));
  const req=reqSnap.data()||{};
  const admins=allUsers.filter(u=>u.role==='admin').map(u=>u.uid);
  await notifyUsers(admins,'Iemand wil overnemen',''+U.name+' wil de dienst overnemen. Ga naar de chat om goed te keuren.',''+U.name+' wil de dienst overnemen. Open de app om goed te keuren.',{type:'swap'});
  // Ook de oorspronkelijke aanvrager een bericht sturen — beide kanten weten dan dat er interesse is
  if(req.requesterId && req.requesterId!==U.uid){
    await notifyUsers([req.requesterId],'Interesse in jouw dienst',U.name+' wil jouw dienst overnemen. De beheerder moet dit nog goedkeuren.',U.name+' wil jouw dienst overnemen. De beheerder moet dit nog goedkeuren.',{type:'swap'});
  }
  toast('Interesse geregistreerd! De beheerder keurt het goed.','ok');
}

async function approveSwap(reqId,msgId){
  const{db,doc,getDoc,updateDoc,collection,addDoc,serverTimestamp}=window._f;
  const reqSnap=await getDoc(doc(db,'swapRequests',reqId));
  const req=reqSnap.data();
  if(!req.interestedUid){toast('Niemand heeft interesse getoond','err');return;}
  const ok=await confirm2('Goedkeuren','Dienst doorgeven aan '+req.interestedName+'?','Goedkeuren','btn-green');
  if(!ok)return;
  // Vervang werknemer in de shift
  const shiftSnap=await getDoc(doc(db,'shifts',req.shiftId));
  const shift=shiftSnap.data();
  const newWorkers=(shift.workers||[]).filter(u=>u!==req.requesterId).concat([req.interestedUid]);
  await updateDoc(doc(db,'shifts',req.shiftId),{workers:newWorkers});
  await updateDoc(doc(db,'swapRequests',reqId),{status:'accepted',adminApproved:true,acceptedBy:req.interestedUid});
  await updateDoc(doc(db,'chat',msgId),{swapStatus:'accepted',acceptedByName:req.interestedName});
  // Notificeer beide medewerkers
  await notifyUsers([req.requesterId],'Dienst geruild','Je dienst op '+fmtDate(req.shiftDate)+' is overgenomen door '+req.interestedName+'.','Je dienst op '+fmtDate(req.shiftDate)+' is overgenomen door '+req.interestedName+'. De beheerder heeft het goedgekeurd.',{type:'swap'});
  await notifyUsers([req.interestedUid],'Dienst overgenomen','Je hebt de dienst op '+fmtDate(req.shiftDate)+' overgenomen van '+req.requesterName+'.','Je hebt de dienst op '+fmtDate(req.shiftDate)+' overgenomen. Check je rooster!',{type:'swap'});
  showBrowserNotif('Dienst geruild','Beide medewerkers zijn genotificeerd');
  toast('Dienst goedgekeurd en doorgegeven!','ok');
}

async function rejectSwap(reqId,msgId){

}

function exportShiftToCalendar(shiftId){
  const shift=allShifts.find(s=>s.id===shiftId);
  if(!shift){toast('Dienst niet gevonden','err');return;}
  const d=toDate(shift.date);
  const pad=n=>String(n).padStart(2,'0');
  const icsDate=(date,h,m)=>[date.getFullYear(),pad(date.getMonth()+1),pad(date.getDate()),'T',pad(h),pad(m),'00'].join('');
  const dtstamp=icsDate(new Date(),new Date().getHours(),new Date().getMinutes());
  const[sh,sm]=(shift.startTime||'00:00').split(':').map(Number);
  // Bij "Sluit" (onbekende eindtijd) weten we de echte eindtijd pas als de dienst voorbij is —
  // voor de agenda-afspraak gebruiken we dan een geschatte duur van 4 uur, en zetten "Sluit"
  // duidelijk in de omschrijving zodat het niet als een harde eindtijd wordt gelezen.
  const[eh,em]=isSluit(shift.endTime)?[(sh+4)%24,sm]:(shift.endTime||'00:00').split(':').map(Number);
  const startStr=icsDate(d,sh,sm), endStr=icsDate(d,eh,em);
  const desc='Dienst bij MHV — '+shift.startTime+' tot '+dispTime(shift.endTime)+(isSluit(shift.endTime)?' (eindtijd onbekend, duurt tot de zaak dicht is)':'');

  // Agenda-toevoegen via een enkele "trick" (blob-download, Share API, of data:-URI) bleek in de
  // praktijk onbetrouwbaar: Apple blokkeert het dynamisch openen van .ics-bestanden in sommige
  // situaties, en Android-browsers hebben bekende, wisselvallige bugs met .ics-bestandsafhandeling.
  // Daarom, net als grote partijen (Eventbrite, Meetup, etc.) doen: een keuze geven die altijd
  // ergens toe leidt, i.p.v. gokken op één methode.
  const gcalUrl='https://calendar.google.com/calendar/render?action=TEMPLATE'
    +'&text='+encodeURIComponent('Dienst MHV')
    +'&dates='+startStr+'/'+endStr
    +'&details='+encodeURIComponent(desc)
    +'&location='+encodeURIComponent('MHV');

  modal(`<div class="modal-handle"></div>
    <div style="text-align:center;padding:6px 0 4px">
      <div style="font-size:40px;margin-bottom:10px"><span class="ic" data-icon="calendar"></span></div>
      <div class="modal-title" style="text-align:center">Toevoegen aan agenda</div>
      <p style="font-size:13px;color:var(--text3);margin:8px 0 18px">Kies wat bij jouw agenda-app past.</p>
      <button class="btn btn-yellow btn-full" style="margin-bottom:10px" onclick="window.open('${gcalUrl}','_blank');closeModal()">Google Agenda</button>
      <button class="btn btn-ghost btn-full" onclick="downloadIcsFile('${shift.id}');closeModal()">Apple Agenda / Outlook (.ics-bestand)</button>
    </div>`);
}
function downloadIcsFile(shiftId){
  const shift=allShifts.find(s=>s.id===shiftId); if(!shift)return;
  const d=toDate(shift.date);
  const pad=n=>String(n).padStart(2,'0');
  const icsDate=(date,h,m)=>[date.getFullYear(),pad(date.getMonth()+1),pad(date.getDate()),'T',pad(h),pad(m),'00'].join('');
  const now=new Date();
  const[sh,sm]=(shift.startTime||'00:00').split(':').map(Number);
  const[eh,em]=isSluit(shift.endTime)?[(sh+4)%24,sm]:(shift.endTime||'00:00').split(':').map(Number);
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MHVwork//NL','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    'UID:'+(shift.id||Date.now())+'@mhvwork',
    'DTSTAMP:'+icsDate(now,now.getHours(),now.getMinutes()),
    'DTSTART:'+icsDate(d,sh,sm),'DTEND:'+icsDate(d,eh,em),
    'SUMMARY:Dienst MHV','DESCRIPTION:Dienst bij MHV — '+shift.startTime+' tot '+dispTime(shift.endTime)+(isSluit(shift.endTime)?' (eindtijd onbekend, duurt tot de zaak dicht is)':''),
    'LOCATION:MHV','END:VEVENT','END:VCALENDAR'].join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='dienst-mhv.ics'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast('Bestand gedownload — open het vanuit je downloads om toe te voegen','ok');
}

function renderEmailMeterInner(){
  if(emailUsageStats===null) return '<div style="padding:16px;font-size:13px;color:var(--text3)">Laden…</div>';
  const nowYm=new Date().toISOString().slice(0,7);
  const cur=(emailUsageStats.find(x=>x.month===nowYm)||{count:0}).count;
  const pct=Math.min(100,Math.round(cur/EMAIL_MONTH_LIMIT*100));
  const col=cur>=EMAIL_MONTH_LIMIT?'var(--red)':(cur>=EMAIL_MONTH_LIMIT*0.8?'var(--mhv-yellow)':'var(--green)');
  const left=Math.max(0,EMAIL_MONTH_LIMIT-cur);
  const hist=emailUsageStats.filter(x=>x.month!==nowYm);
  return '<div style="padding:16px">'
    +'<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px">'
    +'<div><span style="font-size:30px;font-weight:800;color:'+col+'">'+cur+'</span><span style="font-size:14px;color:var(--text3)"> / '+EMAIL_MONTH_LIMIT+'</span></div>'
    +'<div style="font-size:12px;color:var(--text3)">'+fmtMonthNl(nowYm)+'</div></div>'
    +'<div style="height:8px;background:var(--bg3);border-radius:4px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+col+';border-radius:4px;transition:width .4s ease"></div></div>'
    +'<div style="font-size:12px;color:var(--text3);margin-top:8px">'
    +(cur>=EMAIL_MONTH_LIMIT?'<b style="color:var(--red)">Limiet bereikt</b> — mails worden door EmailJS mogelijk geweigerd tot de nieuwe maand.':left+' mails over deze maand')
    +'</div></div>'
    +(hist.length?'<div style="border-top:1px solid var(--separator);padding:6px 16px 10px"><div class="form-label" style="margin:8px 0 4px">Geschiedenis</div>'
      +hist.map(h=>'<div style="display:flex;justify-content:space-between;padding:7px 0;font-size:13px;border-bottom:1px solid var(--separator)"><span style="color:var(--text2)">'+fmtMonthNl(h.month)+'</span><span style="font-weight:700;color:'+(h.count>=EMAIL_MONTH_LIMIT?'var(--red)':'var(--text)')+'">'+h.count+' / '+EMAIL_MONTH_LIMIT+'</span></div>').join('')
      +'</div>':'');
}

// ── Tijdelijke (gast)accounts: dev keurt goed en beheert ──
function devGuestsHtml(){
  const g=allUsers.filter(u=>u.guestUntil).sort((a,b)=>(b.guestPending?1:0)-(a.guestPending?1:0)||a.guestUntil-b.guestUntil);
  const fmt=ms=>new Date(ms).toLocaleDateString('nl-NL',{day:'numeric',month:'short',year:'numeric'});
  if(!g.length) return '<p style="font-size:13px;color:var(--text3);line-height:1.5">Geen tijdelijke accounts. Een beheerder maakt ze aan via Uitnodigen → Tijdelijk gastaccount; jij keurt ze hier goed.</p>';
  return '<div style="background:var(--bg2);border:1px solid var(--separator);border-radius:16px;overflow:hidden;margin-top:6px">'+g.map(u=>{
    const exp=u.guestUntil<Date.now();
    const st=u.guestPending?'<span class="badge badge-orange">Wacht op goedkeuring</span>':exp?'<span class="badge badge-red">Verlopen</span>':'<span class="badge badge-green">Actief</span>';
    const btns=u.guestPending
      ?`<button class="btn btn-green btn-sm" style="flex:1" onclick="approveGuest('${u.uid}')">✓ Goedkeuren</button><button class="btn btn-red btn-sm" style="flex:1" onclick="rejectGuest('${u.uid}')">Afwijzen</button>`
      :`<button class="btn btn-ghost btn-sm" style="flex:1" onclick="extendGuest('${u.uid}')">+7 dagen</button><button class="btn btn-ghost btn-sm" style="flex:1" onclick="openGuestDate('${u.uid}')">Datum</button>${exp?'':`<button class="btn btn-ghost btn-sm" style="flex:1" onclick="endGuest('${u.uid}')">Intrekken</button>`}<button class="btn btn-yellow btn-sm" style="flex:1" onclick="makeGuestPermanent('${u.uid}')">Definitief maken</button><button class="btn btn-red btn-sm" onclick="rejectGuest('${u.uid}')"><span class="ic" data-icon="trash"></span></button>`;
    return `<div style="padding:13px 16px;border-bottom:1px solid var(--separator)"><div style="display:flex;align-items:center;gap:10px"><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600">${escAnn(u.name)}</div><div style="font-size:12px;color:var(--text3)">${escAnn(u.email||'—')} · t/m ${fmt(u.guestUntil)}</div></div>${st}</div><div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">${btns}</div></div>`;
  }).join('')+'</div>';
}
window.makeGuestPermanent=async function(uid){
  const u=allUsers.find(x=>x.uid===uid); if(!u)return;
  const ok=await confirm2('Definitief maken','"'+u.name+'" wordt een gewoon medewerkersaccount, zonder vervaldatum.','Definitief maken'); if(!ok)return;
  try{
    const{db,doc,updateDoc,deleteField}=window._f;
    await updateDoc(doc(db,'users',uid),{guestUntil:deleteField(),guestPending:deleteField(),guestApprovedBy:deleteField()});
    toast('Account is nu definitief','ok');
  }catch(e){ toast('Mislukt: '+(e.message||''),'err'); }
};
window.approveGuest=async function(uid){
  try{
    const{db,doc,updateDoc}=window._f;
    await updateDoc(doc(db,'users',uid),{guestPending:false,guestApprovedBy:U.uid});
    try{ await sendNotifMulti([uid],'Gastaccount goedgekeurd','Je gastaccount is goedgekeurd — je kunt nu inloggen.'); }catch(e){}
    toast('Gastaccount goedgekeurd','ok');
  }catch(e){ toast('Goedkeuren mislukt','err'); }
};
window.rejectGuest=function(uid){ const u=allUsers.find(x=>x.uid===uid); if(u) deleteEmployeeDev(uid,u.name||'',u.email||''); };
window.endGuest=async function(uid){
  const ok=await confirm2('Toegang intrekken','Het gastaccount werkt direct niet meer.','Intrekken','btn-red'); if(!ok)return;
  try{ const{db,doc,updateDoc}=window._f; await updateDoc(doc(db,'users',uid),{guestUntil:Date.now()-1000}); toast('Toegang ingetrokken','ok'); }catch(e){ toast('Mislukt','err'); }
};
window.openGuestDate=function(uid){
  const u=allUsers.find(x=>x.uid===uid); if(!u)return;
  const cur=new Date(Math.max(u.guestUntil,Date.now())).toISOString().slice(0,10);
  modal(`<div class="modal-handle"></div><div class="modal-title">Toegang aanpassen</div>
    <div class="form-section"><label class="form-label">Toegang tot en met</label><input type="date" class="form-input" id="ggDate" value="${cur}"></div>
    <button class="btn btn-yellow btn-full" onclick="saveGuestDate('${uid}')">Opslaan</button>`);
};
window.saveGuestDate=async function(uid){
  const dv=$('ggDate')?.value; if(!dv){toast('Kies een datum','err');return;}
  const[y,m,d]=dv.split('-').map(Number);
  try{ const{db,doc,updateDoc}=window._f; await updateDoc(doc(db,'users',uid),{guestUntil:new Date(y,m-1,d,23,59,59,999).getTime()}); closeModal(); toast('Opgeslagen','ok'); }catch(e){ toast('Mislukt','err'); }
};

function renderDevLog(){
  const v=document.getElementById('view-devlog'); if(!v)return;
  v.innerHTML='<div class="page-title" style="padding:16px 16px 0"><span class="ic" data-icon="clipboard"></span> Logboek</div>'
    +'<div style="padding:0 16px 8px"><button class="btn btn-ghost btn-full" onclick="exportLoginLogsExcel()"><span class="ic" data-icon="chart"></span> Exporteer naar Excel</button></div>'
    +'<div id="devLogContent" style="padding:16px;text-align:center;color:var(--text3)">Logboek laden…</div>';
  loadLoginLogs().then(logs=>{
    const cont=document.getElementById('devLogContent'); if(!cont)return;
    if(!logs.length){ cont.innerHTML='<div class="empty"><div class="empty-icon"><span class="ic" data-icon="clipboard"></span></div><p>Nog geen inlog-activiteit</p></div>'; return; }
    window._devLogsCache=logs;

    // Per gebruiker samenvatten: eerste login, aantal logins, laatst gezien
    const byUser={};
    logs.forEach(l=>{
      if(!byUser[l.uid]) byUser[l.uid]={count:0, first:null, last:null};
      const t=l.createdAt?.toDate?l.createdAt.toDate():null;
      if(l.type==='login'){
        byUser[l.uid].count++;
        if(!byUser[l.uid].first || (t&&t<byUser[l.uid].first)) byUser[l.uid].first=t;
        if(!byUser[l.uid].last || (t&&t>byUser[l.uid].last)) byUser[l.uid].last=t;
      }
    });
    const userCards=Object.keys(byUser).map(uid=>{
      const u=allUsers.find(x=>x.uid===uid);
      const st=byUser[uid];
      return `<div class="devlog-user-card" data-uid="${uid}" style="flex-shrink:0;width:150px;background:var(--bg2);border:1.5px solid var(--separator);border-radius:14px;padding:12px;cursor:pointer;scroll-snap-align:start">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <div class="avatar" style="width:30px;height:30px;font-size:12px;flex-shrink:0;${u&&u.role==='software'?'background:var(--mhv-blue)':''}">${u&&u.role==='software'?`<img src="${LOGO}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`:(u?userAvatarHtml(u.uid):'?')}</div>
          <div style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${u?u.name:'Onbekend'}</div>
        </div>
        <div style="font-size:11px;color:var(--text3);line-height:1.6">
          <div>${st.count}× ingelogd</div>
          <div>1e keer: ${st.first?st.first.toLocaleDateString('nl-NL',{day:'numeric',month:'short'}):'—'}</div>
          <div>Laatst: ${st.last?st.last.toLocaleDateString('nl-NL',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—'}</div>
        </div>
      </div>`;
    }).join('');

    function timelineHtml(filterUid){
      const filtered=filterUid?logs.filter(l=>l.uid===filterUid):logs;
      return filtered.map(l=>{
        const t=l.createdAt?.toDate?l.createdAt.toDate():null;
        const u=allUsers.find(x=>x.uid===l.uid);
        const name=u?(u.name+(isUserVerified(u.uid)?VERIFIED_BADGE:'')):userName(l.uid);
        return '<div style="padding:10px 16px;border-bottom:1px solid var(--separator);display:flex;align-items:center;gap:10px">'
          +'<div class="avatar" style="width:26px;height:26px;font-size:10px;flex-shrink:0;'+(u&&u.role==='software'?'background:var(--mhv-blue)':'')+'">'+(u&&u.role==='software'?'<img src="'+LOGO+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">':(u?userAvatarHtml(u.uid):'?'))+'</div>'
          +'<div style="flex:1;min-width:0">'
          +'<div style="font-size:13px;font-weight:600">'+(l.type==='login'?'<span class="ic" data-icon="dot" style="color:var(--green)"></span>':'<span class="ic" data-icon="dot" style="color:var(--red)"></span>')+' '+name+' — '+(l.type==='login'?'ingelogd':'uitgelogd')+'</div>'
          +'<div style="font-size:11px;color:var(--text3);margin-top:2px">'+(l.device||'?')+(l.ip?' · '+l.ip:' · IP onbekend')+'</div>'
          +'</div>'
          +'<div style="font-size:11px;color:var(--text4);flex-shrink:0;text-align:right">'+(t?t.toLocaleString('nl-NL',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'')+'</div>'
          +'</div>';
      }).join('') || '<div class="empty" style="padding:24px"><p>Geen activiteit voor deze gebruiker</p></div>';
    }

    cont.innerHTML='<div class="section-label" style="margin-top:0;text-align:left">Per gebruiker</div>'
      +'<div style="display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;margin-bottom:18px;scroll-snap-type:x proximity">'
      +'<div class="devlog-user-card" data-uid="" style="flex-shrink:0;width:90px;background:var(--mhv-yellow);color:#000;border-radius:14px;padding:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:13px">Alles</div>'
      +userCards
      +'</div>'
      +'<div class="section-label" style="text-align:left" id="devLogTimelineLabel">Alle activiteit</div>'
      +'<div id="devLogTimeline" style="background:var(--bg2);border:1px solid var(--separator);border-radius:16px;overflow:hidden;text-align:left">'+timelineHtml(null)+'</div>';

    cont.querySelectorAll('.devlog-user-card').forEach(card=>{
      card.addEventListener('click',function(){
        const uid=this.getAttribute('data-uid')||null;

      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const max = 800;
        let w=img.width, h=img.height;
        if(w>max){h=Math.round(h*max/w);w=max;}
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);

      };
      reader.readAsDataURL(file);
    });
    this.value='';
  };

    +b('•',"annLinePrefix('- ')",'Lijst')+b('🔗',"annInsertLink()",'Link')+'</div>'

window.annPreviewUpdate=function(){ const ta=$('annText'),pv=$('annPreview'); if(!ta||!pv)return; pv.style.display=ta.value.trim()?'block':'none'; pv.innerHTML=renderRichText(ta.value); };
window.annLinePrefix=function(pre){ const ta=$('annText'); if(!ta)return; const s0=ta.selectionStart; const ls=ta.value.lastIndexOf('\n',s0-1)+1; ta.value=ta.value.slice(0,ls)+pre+ta.value.slice(ls); ta.focus(); annPreviewUpdate(); };
window.annInsertLink=function(){ const ta=$('annText'); if(!ta)return; const url=prompt('Link (begint met https://)'); if(!url||!/^https?:\/\//.test(url)){ if(url) toast('Link moet met http(s):// beginnen','err'); return; } const s0=ta.selectionStart,e0=ta.selectionEnd; const t=ta.value.slice(s0,e0)||'link'; ta.value=ta.value.slice(0,s0)+'['+t+']('+url+')'+ta.value.slice(e0); ta.focus(); annPreviewUpdate(); };
function annWrapSelection(marker){
  const ta=$('annText'); if(!ta)return;
  const s=ta.selectionStart, e=ta.selectionEnd;
  const val=ta.value;
  const sel=val.slice(s,e)||'tekst';
  ta.value=val.slice(0,s)+marker+sel+marker+val.slice(e);
  ta.focus(); ta.selectionStart=s+marker.length; ta.selectionEnd=s+marker.length+sel.length;
  annPreviewUpdate();
}
function annTextareaTab(e){
  if(e.key==='Tab'){
    e.preventDefault();
    const ta=e.target, s=ta.selectionStart, en=ta.selectionEnd;
    ta.value=ta.value.slice(0,s)+'\t'+ta.value.slice(en);
    ta.selectionStart=ta.selectionEnd=s+1;
  }
}

async function saveAnnouncement(){
  const title = (document.getElementById('annTitle')||{}).value||''
  const text  = (document.getElementById('annText')||{}).value||'';
  const audience = (document.getElementById('annAudience')||{}).value||'all';
  const special = !!(document.getElementById('annSpecial')||{}).checked;
  const wantsEmail = (document.getElementById('annEmail')||{}).checked!==false;
  if(!title.trim()){toast('Vul een titel in','err');return;}
  const attachments = window._annAttachments||[];
  const totalBytes = (window._annImgData?window._annImgData.length*0.75:0) + attachments.reduce((s,f)=>s+f.size,0);
  if(totalBytes > 900*1024){ toast('Afbeelding + bijlages samen te groot (max ~900KB) — verwijder er iets','err'); return; }
  const editId=window._annEditId;
  const{db,collection,doc,addDoc,updateDoc,serverTimestamp}=window._f;
  const imgForMail = window._annImgData||null;
  window._annImgData = null;
  window._annAttachments = [];
  window._annEditId = null;
  try{
    if(editId){
      await updateDoc(doc(db,'announcements',editId),{
        title: title.trim(), text: text.trim(), audience: audience, special: special,
        imageData: imgForMail, attachments: attachments,
        editedAt: serverTimestamp(), editedBy: U.uid, editedByName: U.name,
      });
      closeModal();
      toast('Aankondiging bijgewerkt','ok');
      render(U.role==='software'?'devacc':'home');
      return;
    }
    const payload = {
      title: title.trim(),
      text: text.trim(),
      audience: audience,
      special: special,
      authorUid: U.uid,
      authorName: U.name,
      authorRole: U.role,
      createdAt: serverTimestamp(),
      imageData: imgForMail,
      attachments: attachments,
    };
    await addDoc(collection(db,'announcements'), payload);
    closeModal();
    toast('Aankondiging geplaatst!','ok');
    render(U.role==='software'?'devacc':'home');
    const targets=allUsers.filter(u=>{
      if(u.uid===U.uid)return false;
      if(audience==='employee')return u.role==='employee';
      if(audience==='admin')return u.role==='admin'||u.role==='software';
      return true;
    }).map(u=>u.uid);
    if(targets.length){
      const plain=stripRich(payload.text)||payload.title;
      const thumb=(wantsEmail&&imgForMail)?await makeMailThumb(imgForMail):null;
      await notifyUsers(targets,payload.title,plain,plain,{type:'announce',email:wantsEmail,emailImage:thumb});
    }
  }catch(e){
    toast((editId?'Opslaan':'Plaatsen')+' mislukt: '+e.message,'err');
    console.error('saveAnnouncement error:',e);
  }
}

    const q=query(collection(db,'announcements'),limit(10));
    const snap=await getDocs(q);
    return snap.docs.map(d=>({id:d.id,...d.data()}))
      .sort((a,b)=>(b.createdAt?.toDate?.()?.getTime()||0)-(a.createdAt?.toDate?.()?.getTime()||0));
  }catch(e){ return []; }
}

// HARDE RESET (alleen dev) — wist shifts/availability/notifications/chat/swapRequests/
// dms/announcements/payments volledig. Blijft bewust met rust: users, publicProfiles
// (= "de gebruikers zelf"), loginLogs (= logboek), settings, invites.
// ═══════════════════════════════════════════
const HARD_RESET_COLLECTIONS=['shifts','availability','notifications','chat','swapRequests','dms','dmFiles','announcements','payments'];
function openHardResetGate(){
  modal(`
    <div class="modal-title" style="color:var(--red)"><span class="ic" data-icon="trash"></span> Harde reset</div>
    <p style="font-size:13px;color:var(--text2);line-height:1.6;margin:-4px 0 14px">
      Dit verwijdert <b>permanent en onomkeerbaar</b> alle documenten uit:<br>
      diensten, beschikbaarheid, meldingen, groepschat, ruilverzoeken, privéberichten,
      aankondigingen en betaalgeschiedenis.<br><br>
      <b>Blijft staan:</b> alle gebruikersaccounts, het logboek, en de statistieken op ieders profiel.
    </p>
    <div class="form-section"><label class="form-label">Typ WISSEN om te bevestigen</label>
      <input type="text" class="form-input" id="hardResetConfirmIn" placeholder="WISSEN" autocomplete="off"></div>
    <button class="btn btn-full" style="margin-top:8px;background:var(--red);color:#fff" onclick="confirmHardReset()">Definitief alles wissen</button>
  `);
}
async function confirmHardReset(){
  const val=($('hardResetConfirmIn')?.value||'').trim();
  if(val!=='WISSEN'){ toast('Typ precies "WISSEN" om te bevestigen','err'); return; }
  closeModal();
  // Nog één keer een aparte, expliciete laatste bevestiging — dit is onomkeerbaar en treft
  // in één klap alle diensten/berichten van de hele vereniging.
  const ok=await confirm2('Weet je het zeker?','Dit kan echt niet ongedaan gemaakt worden. Alle diensten en berichten van MHV verdwijnen definitief.','Ja, definitief wissen');
  if(ok)runHardReset();
}
async function runHardReset(){
  toast('Bezig met wissen…','ok');
  const{db,collection,getDocs,writeBatch}=window._f;
  let totalDeleted=0;
  try{
    for(const colName of HARD_RESET_COLLECTIONS){
      const snap=await getDocs(collection(db,colName));
      const docs=snap.docs;
      for(let i=0;i<docs.length;i+=450){
        const batch=writeBatch(db);
        docs.slice(i,i+450).forEach(d=>batch.delete(d.ref));
        await batch.commit();
        totalDeleted+=Math.min(450,docs.length-i);
      }
    }
    allShifts=[]; allAvail=[]; allNotifs=[];
    toast(`Klaar — ${totalDeleted} document(en) gewist`,'ok');
    rerender();
  }catch(e){
    console.error('Harde reset mislukt:',e);
    toast('Reset mislukt (halverwege gestopt) — check de console','err');
  }
}

// ═══════════════════════════════════════════
// IDLE-PAGINA (kiosk-weergave voor op een tablet)
// Toont het rooster van vandaag met een live voortgangsbalk per dienst. Bewust géén eigen
// Firestore-listener — leest gewoon uit het al bestaande, live gehouden `allShifts`
// (zie unsubShifts hierboven), dat is al up-to-date zonder extra netwerkverkeer.
// De uitgangscode wordt bewust NIET opgeslagen (niet in Firestore, niet in localStorage) —
// degene die idle-modus start bedenkt 'm ter plekke, en die geldt alleen voor deze sessie.
// ═══════════════════════════════════════════
function openIdleGate(){
  modal(`
    <div class="modal-title"><span class="ic" data-icon="tv"></span> Idle-modus starten</div>
    <p style="font-size:13px;color:var(--text3);margin:-4px 0 16px;line-height:1.5">
      Dit toont het rooster van vandaag, groot en leesbaar — handig om op een tablet te laten
      hangen. Bedenk een code van 4 cijfers waarmee je 'm straks weer kunt afsluiten.
    </p>
    <div class="form-section"><label class="form-label">Uitgangscode (4 cijfers)</label>
      <input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" class="form-input" id="idleCodeIn" placeholder="••••" style="letter-spacing:6px;font-size:20px;text-align:center"></div>
    <button class="btn btn-yellow btn-full" style="margin-top:8px" onclick="startIdleMode()">Start idle-modus</button>
  `);
}
async function startIdleMode(){
  const code=($('idleCodeIn')?.value||'').trim();
  if(!/^\d{4}$/.test(code)){ toast('Vul precies 4 cijfers in','err'); return; }
  idleExitCode=code;
  closeModal();
  const ov=$('idle-overlay');
  ov.classList.add('open');
  // Best-effort fullscreen + landschap — mag ook zonder, sommige (geïnstalleerde) tablets/
  // browsers staan dit niet toe. De rest van de app blijft portrait-vergrendeld via
  // manifest.json; dit ontgrendelt alléén tijdens idle-modus, puur voor dit scherm.
  try{
    await document.documentElement.requestFullscreen?.().catch(()=>{});
    await screen.orientation?.lock?.('landscape').catch(()=>{});
  }catch(e){}
  renderIdlePage();
  if(idleTimer)clearInterval(idleTimer);
  idleTimer=setInterval(renderIdlePage,30000); // elke 30s de klok/balkjes verversen, puur client-side, geen serververkeer
}
function promptIdleExit(){
  modal(`
    <div class="modal-title">Idle-modus verlaten</div>
    <p style="font-size:13px;color:var(--text3);margin:-4px 0 16px">Voer de code in die is ingesteld bij het starten.</p>
    <div class="form-section"><label class="form-label">Code</label>
      <input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" class="form-input" id="idleExitIn" placeholder="••••" style="letter-spacing:6px;font-size:20px;text-align:center"></div>
    <button class="btn btn-yellow btn-full" style="margin-top:8px" onclick="checkIdleExit()">Verlaat idle-modus</button>
  `);
}
function checkIdleExit(){
  const code=($('idleExitIn')?.value||'').trim();
  if(code!==idleExitCode){ toast('Onjuiste code','err'); return; }
  closeModal();
  exitIdleMode();
}
function exitIdleMode(){
  if(idleTimer){ clearInterval(idleTimer); idleTimer=null; }
  idleExitCode=null;
  $('idle-overlay').classList.remove('open');
  try{ screen.orientation?.unlock?.(); }catch(e){}
  if(document.fullscreenElement)try{document.exitFullscreen?.();}catch(e){}
}
function renderIdlePage(){
  const now=new Date();
  $('idleClock').textContent=now.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
  $('idleDate').textContent=now.toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'});
  const imEl=$('idleMatches'); if(imEl) imEl.innerHTML=idleMatchesHtml();
  const today=nowKey();
  // Losse dienst-blokken blijven bewust losse blokken (ook als ze overlappen in tijd, bv. een
  // feestavond met bar + deur tegelijk) — nooit samenvoegen, dat was expliciet gevraagd.
  const todayShifts=allShifts.filter(s=>dKey(s.date)===today).sort((a,b)=>minsFrom(a.startTime)-minsFrom(b.startTime));
  const list=$('idleList');
  if(!todayShifts.length){
    list.innerHTML='<div class="idle-empty">Geen diensten vandaag 🎉</div>';
    return;
  }
  const nowMins=now.getHours()*60+now.getMinutes();
  list.innerHTML=todayShifts.map(s=>{
    const names=(s.workers||[]).map(uid=>allUsers.find(u=>u.uid===uid)?.name||'?');
    const startMins=minsFrom(s.startTime);
    const sluit=isSluit(s.endTime);
    const endMins=sluit?null:minsFrom(s.endTime);
    let barHtml, subHtml;
    if(sluit){
      const started=nowMins>=startMins;
      const elapsed=started?nowMins-startMins:0;
      barHtml=`<div class="idle-bar-track"><div class="idle-bar-fill openend" style="width:${started?'100':'0'}%"></div></div>`;
      subHtml=started?`bezig sinds ${s.startTime} (${Math.floor(elapsed/60)}u ${elapsed%60}m) — tot sluit`:`begint om ${s.startTime}`;
    }else{
      const pct=Math.max(0,Math.min(100,Math.round((nowMins-startMins)/(endMins-startMins)*100)));
      const done=nowMins>=endMins;
      const remain=Math.max(0,endMins-nowMins);
      barHtml=`<div class="idle-bar-track"><div class="idle-bar-fill${done?' done':''}" style="width:${pct}%"></div></div>`;
      subHtml=nowMins<startMins?`begint om ${s.startTime}`:done?'klaar':`nog ${Math.floor(remain/60)}u ${remain%60}m`;
    }
    return `<div class="idle-shift">
      <div class="idle-shift-time">${s.startTime} – ${dispTime(s.endTime)}</div>
      ${s.note?`<div class="idle-shift-note"><span class="ic" data-icon="note"></span> ${s.note}</div>`:''}
      ${names.length?names.map(n=>`<div class="idle-worker">
        <div class="idle-worker-name"><span>${n}</span><span class="idle-worker-sub">${subHtml}</span></div>
        ${barHtml}
      </div>`).join(''):'<div style="color:rgba(255,255,255,0.4);font-size:14px">Niemand toegewezen</div>'}
    </div>`;
  }).join('');
}
