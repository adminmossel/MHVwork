// EXPORT NAAR BOEKHOUDING — nette grootboek-rijen (één regel per medewerker per dienst),
// i.p.v. de matrix-vorm van de gewone dienstenexport. Bedoeld om zo in een boekhoudpakket
// of bij de penningmeester aan te leveren.
// ═══════════════════════════════════════════
function exportBookkeeping(year,month){
  const y=parseInt(year), m=parseInt(month);
  const monthShifts=allShifts.filter(s=>{const d=toDate(s.date);return d.getFullYear()===y&&d.getMonth()===m;})
    .sort((a,b)=>toDate(a.date)-toDate(b.date));
  const rows=[];
  monthShifts.forEach(s=>{
    (s.workers||[]).forEach(uid=>{
      const st=getShiftStatus(s,uid);
      if(st!=='approved'&&st!=='paid')return; // alleen echt (goedgekeurde/uitbetaalde) verplichtingen, geen losse planning
      const u=allUsers.find(x=>x.uid===uid)||{name:'Onbekend account'};
      const{start,end}=getEffectiveTimes(s,uid);
      const uren=calcH(start,end);
      const bedrag=getApprovedPay(s,uid);
      rows.push([dKey(s.date), u.name, start, dispTime(end), Number(uren.toFixed(2)), userWage(uid), Number(bedrag.toFixed(2)), st==='paid'?'Uitbetaald':'Goedgekeurd, nog te betalen']);
    });
  });
  if(!rows.length){toast('Niets te exporteren — nog geen goedgekeurde diensten deze maand','err');return;}
  const monthLabel=`${MO[m]} ${y}`;
  const aoa=[['Datum','Naam','Begin','Eind','Uren','Uurloon (€)','Bedrag (€)','Status'],...rows];
  const totalBedrag=rows.reduce((sum,r)=>sum+r[6],0);
  aoa.push(['','','','','','Totaal',Number(totalBedrag.toFixed(2)),'']);
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:12},{wch:20},{wch:8},{wch:8},{wch:8},{wch:12},{wch:12},{wch:24}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,monthLabel);
  XLSX.writeFile(wb,`MHVwork-boekhouding_${y}-${String(m+1).padStart(2,'0')}.xlsx`);
}

// Maandoverzicht als nette PDF — zelfde brongegevens als de Excel-export hierboven,
// maar opgemaakt als overzichtelijk, deelbaar document (bv. voor het bestuur).
function exportMonthPDF(year,month){
  const y=parseInt(year), m=parseInt(month);
  const monthShifts=allShifts.filter(s=>{const d=toDate(s.date);return d.getFullYear()===y&&d.getMonth()===m;})
    .sort((a,b)=>toDate(a.date)-toDate(b.date));
  const rows=[];
  monthShifts.forEach(s=>{
    (s.workers||[]).forEach(uid=>{
      const st=getShiftStatus(s,uid);
      if(st!=='approved'&&st!=='paid')return;
      const u=allUsers.find(x=>x.uid===uid)||{name:'Onbekend account'};
      const{start,end}=getEffectiveTimes(s,uid);
      const uren=calcH(start,end);
      const bedrag=getApprovedPay(s,uid);
      rows.push([dKey(s.date), u.name, start, dispTime(end), uren.toFixed(2)+'u', '€'+bedrag.toFixed(2), st==='paid'?'Uitbetaald':'Nog te betalen']);
    });
  });
  if(!rows.length){toast('Niets te exporteren — nog geen goedgekeurde diensten deze maand','err');return;}
  if(typeof window.jspdf==='undefined'){toast('PDF-module nog aan het laden, probeer over even opnieuw','err');return;}
  const monthLabel=`${MO[m]} ${y}`;
  const totalBedrag=rows.reduce((sum,r)=>sum+parseFloat(r[5].replace('€','')),0);
  const totalUren=rows.reduce((sum,r)=>sum+parseFloat(r[4]),0);
  const perPerson={};
  rows.forEach(r=>{ perPerson[r[1]]=(perPerson[r[1]]||0)+parseFloat(r[5].replace('€','')); });

  const{ jsPDF }=window.jspdf;
  const doc=new jsPDF({unit:'pt',format:'a4'});
  const pageW=doc.internal.pageSize.getWidth();

  // Kop met merkkleur
  doc.setFillColor(26,59,181);
  doc.rect(0,0,pageW,86,'F');
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','bold'); doc.setFontSize(19);
  doc.text('MHVwork', 40, 38);
  doc.setFont('helvetica','normal'); doc.setFontSize(11.5);
  doc.text('Maandoverzicht uitbetalingen — '+monthLabel, 40, 58);

  // Samenvattingskaartjes
  let sy=112;
  doc.setTextColor(20,20,20);
  const cards=[['Totaal uitbetaald','€'+totalBedrag.toFixed(2)],['Totaal uren','' + totalUren.toFixed(1)+'u'],['Aantal medewerkers',Object.keys(perPerson).length+'']];
  const cw=(pageW-80-2*16)/3;
  cards.forEach((c,i)=>{
    const cx=40+i*(cw+16);
    doc.setDrawColor(230,230,230); doc.setFillColor(248,248,250);
    doc.roundedRect(cx,sy,cw,54,6,6,'FD');
    doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(26,59,181);
    doc.text(c[1],cx+12,sy+24);
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(120,120,120);
    doc.text(c[0],cx+12,sy+40);
  });

  // Detailtabel per dienst
  doc.autoTable({
    startY: sy+76,
    head:[['Datum','Naam','Begin','Eind','Uren','Bedrag','Status']],
    body: rows.map(r=>[fmtDate(r[0]),r[1],r[2],r[3],r[4],r[5],r[6]]),
    theme:'striped',
    headStyles:{ fillColor:[26,59,181], textColor:255, fontStyle:'bold', fontSize:9.5 },
    styles:{ fontSize:9, cellPadding:6 },
    alternateRowStyles:{ fillColor:[247,247,250] },
    margin:{left:40,right:40},
  });

  // Totaal per medewerker op een nieuwe sectie
  let ny=doc.lastAutoTable.finalY+26;
  if(ny>720){ doc.addPage(); ny=50; }
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(20,20,20);
  doc.text('Totaal per medewerker', 40, ny);
  doc.autoTable({
    startY: ny+10,
    head:[['Naam','Totaal bedrag']],
    body: Object.entries(perPerson).sort((a,b)=>b[1]-a[1]).map(([n,v])=>[n,'€'+v.toFixed(2)]),
    theme:'plain',
    headStyles:{ fontStyle:'bold', fontSize:9.5, textColor:[26,59,181] },
    styles:{ fontSize:9.5, cellPadding:5 },
    margin:{left:40,right:40},
  });

  const pageCount=doc.internal.getNumberOfPages();
  for(let p=1;p<=pageCount;p++){
    doc.setPage(p);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(150,150,150);
    doc.text('MHVwork · gegenereerd op '+new Date().toLocaleDateString('nl-NL',{day:'numeric',month:'long',year:'numeric'}), 40, doc.internal.pageSize.getHeight()-24);
    doc.text('Pagina '+p+' van '+pageCount, pageW-40, doc.internal.pageSize.getHeight()-24, {align:'right'});
  }
  doc.save(`MHVwork-maandoverzicht_${y}-${String(m+1).padStart(2,'0')}.pdf`);
}

// Layout: linksboven de periode, linkerkolom medewerkersnamen, bovenste rij elke datum met
// een dienst in die periode, en per cel een kruisje + tijd(en) als die medewerker die dag werkt(e).
// ═══════════════════════════════════════════
function exportShiftsExcel(){
  const fromVal=document.getElementById('xlsFrom')?.value;
  const toVal=document.getElementById('xlsTo')?.value;
  if(!fromVal||!toVal){toast('Kies een van- en t/m-datum','err');return;}
  const[fy,fm,fd]=fromVal.split('-').map(Number);
  const[ty,tm,td]=toVal.split('-').map(Number);
  const from=new Date(fy,fm-1,fd), to=new Date(ty,tm-1,td,23,59,59);
  if(to<from){toast('T/m-datum ligt vóór de van-datum','err');return;}

  const inRange=allShifts.filter(s=>{const d=toDate(s.date); return d>=from&&d<=to;});
  if(!inRange.length){toast('Geen diensten gevonden in deze periode','err');return;}

  // Unieke datums (kolommen), gesorteerd
  const dateKeys=[...new Set(inRange.map(s=>dKey(s.date)))].sort();
  // Medewerkers die in deze periode minstens één dienst hebben (rijen), alfabetisch
  const uidsInRange=[...new Set(inRange.flatMap(s=>s.workers||[]))];
  const rowsUsers=uidsInRange.map(uid=>allUsers.find(u=>u.uid===uid)).filter(Boolean)
    .sort((a,b)=>a.name.localeCompare(b.name,'nl'));

  const periodeLabel=`${from.toLocaleDateString('nl-NL',{day:'2-digit',month:'short'})} - ${to.toLocaleDateString('nl-NL',{day:'2-digit',month:'short'})}`;
  const dateLabels=dateKeys.map(k=>{const[y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('nl-NL',{day:'2-digit',month:'2-digit'});});

  // AOA = array-of-arrays, precies zoals gevraagd: linksboven periode, rechtsboven elke datum,
  // linkerkolom medewerkersnamen, kruisjes+tijden in de cellen.
  const aoa=[];
  aoa.push([periodeLabel, ...dateLabels]);
  rowsUsers.forEach(u=>{
    const row=[u.name];
    dateKeys.forEach(k=>{
      const shift=inRange.find(s=>dKey(s.date)===k && s.workers?.includes(u.uid));
      if(!shift){ row.push(''); return; }
      const{start,end}=getEffectiveTimes(shift,u.uid);
      row.push(`X ${start}-${dispTime(end)}`);
    });
    aoa.push(row);
  });

  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:20},...dateKeys.map(()=>({wch:14}))];
  // Kopregel + medewerkerskolom vetgedrukt
  const range=XLSX.utils.decode_range(ws['!ref']);
  for(let C=range.s.c;C<=range.e.c;C++){
    const cell=ws[XLSX.utils.encode_cell({r:0,c:C})];
    if(cell) cell.s={font:{bold:true}};
  }
  for(let R=range.s.r;R<=range.e.r;R++){
    const cell=ws[XLSX.utils.encode_cell({r:R,c:0})];
    if(cell) cell.s={font:{bold:true}};
  }
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Diensten');
  XLSX.writeFile(wb,`MHVwork-diensten_${fromVal}_tot_${toVal}.xlsx`);
  toast('Excel-bestand gedownload!','ok');
}

// BEVESTIGINGS-REMINDERS
// Draait client-side telkens als iemand de app opent (geen server/cron nodig op GitHub Pages).
// Beheerders checken ALLE diensten (mag van de Firestore-rules), medewerkers alleen die van zichzelf.
// ═══════════════════════════════════════════
async function checkShiftReminders(){
  if(!allShifts.length){ await new Promise(r=>setTimeout(r,1200)); }
  await loadSettings();
  const{db,doc,updateDoc,serverTimestamp}=window._f;
  const now=Date.now();

  // ── 1) Onbevestigde diensten NA afloop (bestaand systeem) ──
  const finishedTargets = U.role==='admin' ? allShifts : allShifts.filter(s=>s.workers?.includes(U.uid));
  for(const s of finishedTargets){
    if(!shiftFinished(s)) continue;
    const uids = U.role==='admin' ? (s.workers||[]) : [U.uid];
    for(const uid of uids){
      const st=getShiftStatus(s,uid);
      if(st!=='pending' && st!=='unconfirmed_locked') continue; // al bevestigd/goedgekeurd/betaald
      const d=toDate(s.date);
      const[eh,em]=isSluit(s.endTime)?[23,59]:(s.endTime||'00:00').split(':').map(Number);
      const shiftEnd=new Date(d.getFullYear(),d.getMonth(),d.getDate(),eh,em).getTime();
      const hoursSince=(now-shiftEnd)/36e5;
      const already=s.reminderSent||{}; const already2=s.reminder2Sent||{};
      if(!already[uid]){
        try{
          await updateDoc(doc(db,'shifts',s.id),{[`reminderSent.${uid}`]:true});
          if(uid===U.uid) await notifyUsers([uid],'Hoe was je dienst?',`Je dienst op ${fmtDate(s.date)} is voorbij — bevestig je gewerkte tijd in de app.`,`Je dienst op ${fmtDate(s.date)} (${s.startTime}-${dispTime(s.endTime)}) is voorbij. Ga naar Rooster om je tijd te bevestigen.`,{type:'general'});
        }catch(e){}
      } else if(hoursSince>=APP_SETTINGS.reminderHours && !already2[uid]){
        try{
          await updateDoc(doc(db,'shifts',s.id),{[`reminder2Sent.${uid}`]:true,[`confirmationLocked.${uid}`]:true});
          if(uid===U.uid) await notifyUsers([uid],'Nog steeds niet bevestigd!',`Je dienst op ${fmtDate(s.date)} staat nog open — bevestig 'm zo snel mogelijk.`,`Herinnering: je dienst op ${fmtDate(s.date)} (${s.startTime}-${dispTime(s.endTime)}) is nog niet bevestigd, dit staat al ${APP_SETTINGS.reminderHours}+ uur open.`,{type:'general'});
        }catch(e){}
      }
    }
  }

  // ── 2) Herinneringen VÓÓR een dienst: dag ervoor + 1 uur ervoor ──
  // Let op: dit draait client-side (checkt zodra iemand de app opent), geen exacte cronjob —
  // op GitHub Pages zonder Cloud Functions kan dat niet nauwkeuriger op de minuut.
  const upcomingMine = allShifts.filter(s=>s.workers?.includes(U.uid) && !shiftFinished(s));
  for(const s of upcomingMine){
    const d=toDate(s.date);
    const[sh,sm]=(s.startTime||'00:00').split(':').map(Number);
    const shiftStart=new Date(d.getFullYear(),d.getMonth(),d.getDate(),sh,sm).getTime();
    const hoursUntil=(shiftStart-now)/36e5;
    const dayFlag=s.dayBeforeSent||{}; const hourFlag=s.hourBeforeSent||{};
    if(hoursUntil<=24 && hoursUntil>0 && !dayFlag[U.uid]){
      try{
        await updateDoc(doc(db,'shifts',s.id),{[`dayBeforeSent.${U.uid}`]:true});
        await notifyUsers([U.uid],'Morgen dienst!',`Je hebt morgen een dienst van ${s.startTime} tot ${dispTime(s.endTime)}.`,`Herinnering: je hebt morgen (${fmtDate(s.date)}) een dienst van ${s.startTime} tot ${dispTime(s.endTime)}.`,{type:'general',email:false});
      }catch(e){}
    }
    if(hoursUntil<=1 && hoursUntil>0 && !hourFlag[U.uid]){
      try{
        await updateDoc(doc(db,'shifts',s.id),{[`hourBeforeSent.${U.uid}`]:true});
        await notifyUsers([U.uid],'Bijna je dienst!',`Je dienst begint over ongeveer een uur (${s.startTime}).`,`Je dienst van vandaag begint over ongeveer een uur, om ${s.startTime}.`,{type:'general',email:false});
      }catch(e){}
    }
  }

  // ── 3) Niet-toegewezen diensten die naderen — beheerder herinneren ──
  if(U.role==='admin'){
    const unassigned = allShifts.filter(s=>!(s.workers&&s.workers.length) && !shiftFinished(s));
    for(const s of unassigned){
      const d=toDate(s.date);
      const hoursUntil=(d.getTime()-now)/36e5;
      if(hoursUntil<=48 && hoursUntil>0 && !s.unassignedReminderSent){
        try{
          await updateDoc(doc(db,'shifts',s.id),{unassignedReminderSent:true});
          const admins=allUsers.filter(u=>u.role==='admin').map(u=>u.uid);
          await notifyUsers(admins,'Dienst zonder medewerker',`De dienst op ${fmtDate(s.date)} (${s.startTime}-${dispTime(s.endTime)}) heeft nog niemand toegewezen.`,`De dienst op ${fmtDate(s.date)} (${s.startTime}-${dispTime(s.endTime)}) nadert en er is nog niemand ingepland.`,{type:'general'});
        }catch(e){}
      }
    }
  }
}
function confirm2(title,msg,okLabel,okClass='btn-red'){
  return new Promise(res=>{
    $('confirm-title').textContent=title;
    $('confirm-msg').textContent=msg;
    const ok=$('confirm-ok'); const ca=$('confirm-cancel');
    ok.textContent=okLabel; ok.className='btn '+okClass;
    $('confirm-bg').classList.add('open');
    const cl=()=>{$('confirm-bg').classList.remove('open');ok.onclick=null;ca.onclick=null;};
    ok.onclick=()=>{cl();res(true);};
    ca.onclick=()=>{cl();res(false);};
  });
}

let _logoTapCount=0, _logoTapTimer=null;
function handleLogoTap(){
  _logoTapCount++;
  let total=0; try{total=parseInt(localStorage.getItem('mhv_logo_taps')||'0');}catch(e){}
  total++;
  try{localStorage.setItem('mhv_logo_taps',String(total));}catch(e){}

// Feestdagen-thema — geen echte manifest-icoonwissel mogelijk (OS-beperking bij PWA's),
// maar wel een feestelijk accent in de app + eenmalige felicitatie per feestdag-periode.
// ═══════════════════════════════════════════
function getCurrentHoliday(){
  const now=new Date(); const m=now.getMonth()+1, d=now.getDate();
  if(m===12&&d>=24&&d<=26) return {id:'kerst', emoji:'<span class="ic" data-icon="tree"></span>', title:'Fijne kerstdagen!', msg:'Het hele MHVwork-team wenst je hele fijne kerstdagen!', color:'#c0392b'};
  if((m===12&&d===31)||(m===1&&d===1)) return {id:'nieuwjaar', emoji:'<span class="ic" data-icon="fireworks"></span>', title:'Gelukkig nieuwjaar!', msg:'Op naar een mooi nieuw jaar achter de bar!', color:'#f5c800'};
  if(m===4&&d===27) return {id:'koningsdag', emoji:'<span class="ic" data-icon="heart"></span>', title:'Fijne Koningsdag!', msg:'Geniet van de drukte — en van een oranje biertje.', color:'#ff7f00'};
  if(m===10&&d===31) return {id:'halloween', emoji:'<span class="ic" data-icon="pumpkin"></span>', title:'Happy Halloween!', msg:'Spannende dienst vandaag? <span class="ic" data-icon="ghost"></span>', color:'#ff7518'};
  if(m===3&&d>=22&&now.getDay()===0) return {id:'pasen', emoji:'<span class="ic" data-icon="egg"></span>', title:'Fijne Pasen!', msg:'Fijne paasdagen gewenst!', color:'#7fc97f'};
  if(m===4&&d<=25&&now.getDay()===0) return {id:'pasen', emoji:'<span class="ic" data-icon="egg"></span>', title:'Fijne Pasen!', msg:'Fijne paasdagen gewenst!', color:'#7fc97f'};
  return null;
}
function applyHolidayTheme(){
  const h=getCurrentHoliday(); if(!h)return;
  const logo=document.getElementById('topLogo');
  if(logo && !document.getElementById('holidayBadge')){
    const wrap=logo.parentElement;
    if(wrap && getComputedStyle(wrap).position==='static') wrap.style.position='relative';
    const badge=document.createElement('span');
    badge.id='holidayBadge';
    badge.innerHTML=h.emoji;
    badge.style.cssText='position:absolute;top:-4px;left:18px;font-size:13px;pointer-events:none;transform:rotate(-12deg)';
    logo.insertAdjacentElement('afterend', badge);

  try{
    const seenKey='mhv_holiday_seen_'+h.id+'_'+new Date().getFullYear();
    if(!localStorage.getItem(seenKey)){
      localStorage.setItem(seenKey,'1');
      setTimeout(()=>{

            <button class="btn btn-yellow btn-full" onclick="closeModal()">Bedankt!</button>
          </div>`);
      },1800);
    }
  }catch(e){}
}

// Telt een statistiek-getal soepel op van 0 naar de echte waarde bij het openen van Home.
function animateCountUp(elId){
  const el=document.getElementById(elId); if(!el) return;
  const target=parseInt(el.dataset.count||el.textContent,10); if(isNaN(target)) return;
  const dur=600, start=performance.now();
  function step(now){
    const p=Math.min(1,(now-start)/dur);
    const eased=1-Math.pow(1-p,3);
    el.textContent=Math.round(eased*target);
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function playPopAnimation(el){
  if(!el||!el.animate)return;
  try{
    el.animate([
      {transform:'scale(1)'},
      {transform:'scale(1.35)', offset:0.35},
      {transform:'scale(0.92)', offset:0.6},
      {transform:'scale(1)'}
    ],{duration:350, easing:'cubic-bezier(.34,1.56,.64,1)'});
  }catch(e){}
}
function nav(v,btn){
  // Verberg alle views correct
  document.querySelectorAll('.view').forEach(x=>{
    x.classList.remove('active');
    x.style.display='none';
  });
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  const _el=$('view-'+v);
  if(_el){
    // Chat en dev gebruiken flex layout, andere views block
    const needsFlex=(v==='chat'||v==='dmthread');
    _el.style.display=needsFlex?'flex':'block';
    _el.classList.add('active');
    _el.style.opacity='0';
    _el.style.transform='translateY(8px)';
    requestAnimationFrame(()=>{
      _el.style.transition='opacity .2s ease,transform .2s cubic-bezier(.22,.68,0,1.1)';
      _el.style.opacity='1';
      _el.style.transform='translateY(0)';
    });
  }
  if(btn){
    btn.classList.add('active');
    const svg=btn.querySelector('svg');
    if(svg) playPopAnimation(svg);
  }
  render(v);
}
function rerender(){
  const active=document.querySelector('.view.active');
  if(active)render(active.id.replace('view-',''));
}

// Gedeelde renderer voor aankondigingen — gebruikt door zowel medewerker- als beheerder-homepage.
// 'special' aankondigingen (alleen door dev te plaatsen) krijgen een eigen kleur en tonen 1x een popup.
let lastAnnouncements=[];
function escAnn(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// Simpele opmaak: **vet** wordt <b>, tabs/enters blijven gewoon staan dankzij white-space:pre-wrap.
function renderRichText(text){
  // Opmaak: **vet**, *schuin*, __onderstreept__, ~~doorgehaald~~, ==markering==, [tekst](https://link), "# Kop", "- lijstitem"
  const inline=t=>escAnn(t)
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)"']+)\)/g,'<a href="$2" target="_blank" rel="noopener" style="color:var(--mhv-yellow)">$1</a>')
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/__(.+?)__/g,'<u>$1</u>').replace(/~~(.+?)~~/g,'<s>$1</s>')
    .replace(/==(.+?)==/g,'<mark style="background:rgba(245,200,0,.35);color:inherit;padding:0 3px;border-radius:3px">$1</mark>')
    .replace(/(^|[^*\w])\*(?!\s)([^*]+?)\*(?![*\w])/g,'$1<i>$2</i>');
  return String(text||'').split('\n').map(l=>{
    if(/^#\s+/.test(l)) return '<div style="font-size:17px;font-weight:800;margin:6px 0 2px;color:var(--text)">'+inline(l.replace(/^#\s+/,''))+'</div>';
    if(/^[-•]\s+/.test(l)) return '<div style="padding-left:16px;position:relative"><span style="position:absolute;left:3px">•</span>'+inline(l.replace(/^[-•]\s+/,''))+'</div>';
    return inline(l)+'\n';
  }).join('').replace(/\n$/,'');
}
function stripRich(t){ return String(t||'').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'$1 ($2)').replace(/(\*\*|__|~~|==)/g,'').replace(/^#\s+/gm,'').replace(/^[-•]\s+/gm,'• '); }
function fmtFileSize(b){ if(!b)return ''; if(b<1024)return b+' B'; if(b<1024*1024)return Math.round(b/1024)+' KB'; return (b/1024/1024).toFixed(1)+' MB'; }
function _annTimeAgo(d){
  const diffMin = Math.round((Date.now()-d.getTime())/60000);
  if(diffMin < 1) return 'zojuist';
  if(diffMin < 60) return diffMin+' min geleden';
  const diffH = Math.round(diffMin/60);
  if(diffH < 24) return diffH+' uur geleden';
  const diffD = Math.round(diffH/24);
  if(diffD < 7) return diffD+' dag'+(diffD===1?'':'en')+' geleden';
  return fmtDate(dKey(d));
}
function _annAuthorTag(ann){
  // Rolbadge bij aankondigingen: gebruikt authorRole indien opgeslagen,
  // anders (oudere aankondigingen) opzoeken via allUsers.
  const role = ann.authorRole || (allUsers.find(u=>u.uid===ann.authorUid)||{}).role;
  if(role==='software') return '<span class="chat-role-tag tag-sw"><span class="ic" data-icon="tools"></span> Dev</span>';
  if(role==='admin') return '<span class="chat-role-tag tag-admin"><span class="ic" data-icon="crown"></span> Beheerder</span>';
  return '';
}
function renderAnnouncementArea(area, announcements, showAll){

// Detailpagina van een aankondiging (als modal-'pagina'): afbeelding, opgemaakte tekst, bijlages.

      </div>`).join(''):''}
    ${canDel?`<div style="display:flex;gap:8px;margin-top:18px">

function downloadAnnAttachment(annId,idx){
  const ann=lastAnnouncements.find(a=>a.id===annId); const f=ann?.attachments?.[idx]; if(!f)return;

// Confirm shift functions
async function confirmShiftOk(shiftId){
  const s=allShifts.find(x=>x.id===shiftId); if(!s)return;
  if(isSluit(s.endTime)){ openCorrectShift(shiftId); return; } // eindtijd was onbekend, dus altijd de werkelijke tijd opvragen
  const{db,doc,updateDoc}=window._f;
  await updateDoc(doc(db,'shifts',shiftId),{
    [`workerConfirmations.${U.uid}`]:'confirmed',
    [`finalTimes.${U.uid}`]:{start:s.startTime,end:s.endTime}
  });
  toast('Bevestigd!','ok');
}
function openCorrectShift(shiftId){
  const s=allShifts.find(x=>x.id===shiftId); if(!s)return;
  modal(`
    <div class="modal-handle"></div>
    <div class="modal-title">Tijden doorgeven</div>
    <div style="background:var(--bg3);border-radius:10px;padding:12px 14px;margin-bottom:18px">
      <div style="font-size:12px;color:var(--text3);margin-bottom:3px">Geplande tijd</div>
      <div style="font-size:17px;font-weight:700;color:var(--mhv-yellow)">${s.startTime} – ${dispTime(s.endTime)}</div>
    </div>
    <div class="form-row">
      <div class="form-section"><label class="form-label">Werkelijk begin</label>
        <input type="time" class="form-input" id="cStart" value="${s.startTime}"></div>
      <div class="form-section"><label class="form-label">Werkelijk eind</label>
        <input type="time" class="form-input" id="cEnd" value="${isSluit(s.endTime)?'':s.endTime}"></div>
    </div>
    <button class="btn btn-yellow btn-full" onclick="submitCorrection('${shiftId}')">Doorsturen</button>
  `);

async function submitCorrection(shiftId){
  const s=roundTimeStr($('cStart').value), e=roundTimeStr($('cEnd').value);
  if(!s||!e){toast('Vul beide tijden in','err');return;}
  const{db,doc,updateDoc}=window._f;
  await updateDoc(doc(db,'shifts',shiftId),{
    [`workerConfirmations.${U.uid}`]:'confirmed',
    [`finalTimes.${U.uid}`]:{start:s,end:e}
  });
  closeModal(); toast('Tijden doorgestuurd!','ok');
}

function renderAdminRoster(c){
  const now=new Date();
  const todayKey=nowKey();
  const tabs=`
    <div class="pill-tabs">
      <button class="pill-tab ${adminRTab==='today'?'active':''}" onclick="setAdminRTab('today',this)">Vandaag</button>

  let shifts=allShifts;

  if(adminRTab==='month') shifts=allShifts.filter(s=>{const d=toDate(s.date);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();});

  // Group by day
  const days={};
  shifts.forEach(s=>{const k=dKey(s.date);if(!days[k])days[k]=[];days[k].push(s);});

  // Totale schuld deze weergave
  let totalDebt=0;
  shifts.forEach(s=>(s.workers||[]).forEach(uid=>{
    const st=getShiftStatus(s,uid);

  }));

  c.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div class="page-title" style="margin:0">Rooster</div>
      <button class="btn btn-yellow btn-sm" onclick="openAddShift()" ${restricted('editShift')?'style="display:none"':''}>+ Dienst</button>
    </div>
    ${tabs}
    ${shiftAdviceHtml()}
    ${totalDebt>0?`<div class="stat-tile red" style="margin-bottom:14px"><div class="stat-num" style="color:var(--red);font-size:22px">${fmtMoney(totalDebt)}</div><div class="stat-lbl">Openstaande schuld</div></div>`:''}
    ${sorted.length?sorted.map(k=>{
      const[y,m,d]=k.split('-').map(Number);
      const dt=new Date(y,m-1,d);
      const blocked=blockedOn(k).filter(a=>!days[k].some(s=>s.workers?.includes(a.uid)));
      return `<div style="margin-bottom:16px">
        <div class="section-label" style="margin-top:0">${fmtDate(dt)}</div>
        ${days[k].map(s=>{
          const workers=(s.workers||[]).map(uid=>{
            const st=getShiftStatus(s,uid);
            const{start,end}=getEffectiveTimes(s,uid);
            const pay=st==='approved'||st==='paid'?calcPay(start,end,userWage(uid)):null;
            return `<div class="roster-row">
              <div class="roster-time">${start}–${dispTime(end)}</div>
              <div class="roster-name">${userNameBadged(uid)}</div>
              ${pay!==null?`<div class="roster-pay">${fmtMoney(pay)}</div>`:`<div class="roster-pay" style="color:var(--text4)">—</div>`}
              ${st==='confirmed'?`${restricted('approve')?'':`<button class="btn btn-green" style="padding:4px 8px;font-size:11px" onclick="approveShift('${s.id}','${uid}')">✓</button>`}<button class="btn btn-ghost" style="padding:4px 8px;font-size:11px" onclick="adminCorrect('${s.id}','${uid}')"><span class="ic" data-icon="edit"></span></button>`
                :`<span class="badge ${st==='approved'||st==='paid'?'badge-green':st==='reviewing'?'badge-orange':st==='unconfirmed_locked'?'badge-red':'badge-gray'}" style="font-size:10px">${st==='approved'||st==='paid'?'✓':st==='reviewing'?'…':st==='unconfirmed_locked'?'<span class="ic" data-icon="exclaim"></span>':'<span class="ic" data-icon="hourglass"></span>'}</span>`}
            </div>`;
          }).join('');
          return `<div class="card" style="margin-bottom:8px">
            <div style="padding:12px 16px;border-bottom:1px solid var(--separator);display:flex;justify-content:space-between;align-items:center">
              <div style="font-size:15px;font-weight:700;color:var(--mhv-yellow)">${s.startTime} – ${dispTime(s.endTime)}</div>
              <div style="display:flex;gap:6px">
                ${isShiftLocked(s)?'<span class="badge badge-gray" style="font-size:10px" title="Geweest en volledig uitbetaald — niet meer te bewerken"><span class="ic" data-icon="lock"></span> Afgehandeld</span>':`${restricted('editShift')?'':`<button class="btn btn-ghost btn-sm" onclick="openEditShift('${s.id}')"><span class="ic" data-icon="edit"></span></button>`}${restricted('deleteShift')?'':`<button class="btn btn-red btn-sm" onclick="deleteShift('${s.id}')"><span class="ic" data-icon="trash"></span></button>`}`}
              </div>
            </div>

          <div style="font-size:11px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px">Niet beschikbaar</div>
          ${blocked.map(a=>`<div style="font-size:13px;color:var(--text2);margin-bottom:3px"><span class="ic" data-icon="forbidden"></span> ${userName(a.uid)}${a.note?' — '+a.note:''}</div>`).join('')}

      </div>`;

function renderCal(){
  const ct=$('calTitle'); const grid=$('calGrid'); if(!ct||!grid)return;
  try{
  ct.textContent=`${MO[calM]} ${calY}`;
  const today=nowKey();
  const first=new Date(calY,calM,1).getDay();
  const days=new Date(calY,calM+1,0).getDate();
  let html=DN.map((d,i)=>`<div class="cal-dn${(i===0||i===6)?' weekend':''}">${d}</div>`).join('');
  for(let i=0;i<first;i++)html+=`<div class="cal-d empty"></div>`;
  for(let d=1;d<=days;d++){
    const dt=new Date(calY,calM,d);
    const k=dKey(dt);
    const isTod=k===today;
    const isSel=selDay===k;
    const hasShift=allShifts.some(s=>{
      if(dKey(s.date)!==k)return false;
      return rosterTab==='all'?true:s.workers?.includes(U.uid);
    });
    const isBlocked=allAvail.some(a=>dKey(a.date)===k&&a.uid===U.uid);
    const hasMatch=featureOn('matches')&&allMatches.some(m=>m.date===k&&!matchIsOff(m));
    const dow=dt.getDay();
    let cls='cal-d';
    if(isTod)cls+=' today';
    if(isSel&&!isTod)cls+=' selected';
    if(isBlocked&&!isTod)cls+=' blocked';
    if(dow===0||dow===6)cls+=' weekend';
    const dots=(hasShift||hasMatch)?`<div class="cal-dots">${hasShift?'<span class="cal-dot shift"></span>':''}${hasMatch?'<span class="cal-dot match"></span>':''}</div>`:'';
    html+=`<div class="${cls}" onclick="selCalDay('${k}')"><span>${d}</span>${dots}</div>`;
  }
  $('calGrid').innerHTML=html;
  if(selDay)renderDayShifts(selDay);
  }catch(e){ console.error('renderCal error:',e); }
}
window.calNav=(d)=>{calM+=d;if(calM>11){calM=0;calY++;}if(calM<0){calM=11;calY--;}renderCal();};
window.selCalDay=(k)=>{selDay=k;renderCal();renderDayShifts(k);};

    if(dKey(s.date)!==k)return false;
    return rosterTab==='all'?true:s.workers?.includes(U.uid);
  });
  const mOn=featureOn('matches');
  const showMatches=mOn&&rosterView!=='shifts';
  const showShifts=!mOn||rosterView!=='matches';
  const dayMatches=showMatches?matchesOnDay(k):[];
  const matchesHtml=dayMatches.length?`<div class="section-label" style="margin-top:0">Thuiswedstrijden</div>${dayMatches.map(matchCardHtml).join('')}`:(showMatches&&!showShifts?`<div class="empty" style="padding:20px 0"><div class="empty-icon"><span class="ic" data-icon="calendar"></span></div><p>Geen thuiswedstrijden</p></div>`:'');

      const isMe=uid===U.uid;
      const st=getShiftStatus(s,uid);
      const{start,end}=getEffectiveTimes(s,uid);

        </div>

        ${canConfirm?`<button class="btn btn-yellow btn-sm" onclick="openCorrectShift('${s.id}')">Bevestig</button>`:''}

        <button class="btn btn-ghost btn-sm" title="Details" onclick="openShiftDetails('${s.id}')"><span class="ic" data-icon="info"></span></button>
      </div>`;
    }).join('');
    return `<div class="card" style="margin-bottom:10px;padding:0;overflow:hidden">
      <div style="padding:12px 14px;background:var(--bg3);border-bottom:1px solid var(--separator)">
        <div style="font-size:16px;font-weight:800;color:var(--mhv-yellow)">${s.startTime} – ${dispTime(s.endTime)}</div>
      </div>
      ${s.note?`<div style="padding:10px 14px;background:rgba(245,200,0,.07);border-bottom:1px solid var(--separator)">
        <div style="font-size:12px;font-weight:700;color:var(--mhv-yellow);margin-bottom:4px"><span class="ic" data-icon="note"></span> Notitie van de beheerder</div>
        <div style="font-size:13px;color:var(--text2);white-space:pre-wrap">${s.note}</div>

      </div>`:''}
      ${workers}
    </div>`;
  }).join('');
}

function renderAvail(){
  const c=$('view-avail'); if(!c)return;
  if(U.role==='admin') renderAdminAvail(c);
  else renderEmployeeAvail(c);
}

function renderAdminAvail(c){
  const now=new Date();
  const upcoming=allAvail.filter(a=>toDate(a.date)>=new Date(now.getFullYear(),now.getMonth(),now.getDate()));
  c.innerHTML=`
    <div class="page-title" style="margin-bottom:16px">Beschikbaarheid</div>
    <p style="font-size:14px;color:var(--text3);margin-bottom:16px;line-height:1.6">Overzicht van medewerkers die niet beschikbaar zijn.</p>
    ${upcoming.length?upcoming.map(a=>`
      <div class="avail-row">
        <div class="avatar">${userAvatarHtml(a.uid)}</div>
        <div class="avail-info">
          <div class="avail-name">${userName(a.uid)}</div>
          <div class="avail-date">${fmtDate(a.date)}</div>
          ${a.note?`<div class="avail-note">${a.note}</div>`:''}
        </div>
        <span class="badge badge-red"><span class="ic" data-icon="forbidden"></span> Niet beschikbaar</span>
      </div>`).join('')
    :`<div class="empty"><div class="empty-icon"><span class="ic" data-icon="check-circle"></span></div><p>Iedereen is beschikbaar</p></div>`}
  `;
}

function renderEmployeeAvail(c){
  const now=new Date();
  const myAvail=allAvail.filter(a=>a.uid===U.uid);
  const upcoming=myAvail.filter(a=>toDate(a.date)>=new Date(now.getFullYear(),now.getMonth(),now.getDate()));
  const past=myAvail.filter(a=>toDate(a.date)<new Date(now.getFullYear(),now.getMonth(),now.getDate()));
  c.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div class="page-title" style="margin:0">Beschikbaar</div>
      <button class="btn btn-yellow btn-sm" onclick="openAvailModal()">+ Toevoegen</button>
    </div>
    <p style="font-size:14px;color:var(--text3);margin-bottom:20px;line-height:1.6">Geef aan wanneer je <strong style="color:var(--red)">niet</strong> kunt werken.</p>
    ${upcoming.length?`<div class="section-label">Aankomend</div>`:''}
    ${upcoming.map(a=>`
      <div class="avail-row">
        <div style="font-size:24px"><span class="ic" data-icon="forbidden"></span></div>
        <div class="avail-info">
          <div class="avail-date" style="font-size:15px;font-weight:600">${fmtDate(a.date)}</div>
          ${a.note?`<div class="avail-note">${a.note}</div>`:''}
        </div>
        <button class="btn btn-ghost btn-sm avail-edit-btn" data-id="${a.id}"><span class="ic" data-icon="edit"></span></button>
        <button class="btn btn-red btn-sm" onclick="deleteAvail('${a.id}')">Verwijder</button>
      </div>`).join('')}
    ${!myAvail.length?`<div class="empty"><div class="empty-icon"><span class="ic" data-icon="check-circle"></span></div><p>Geen blokkades ingevoerd</p></div>`:''}
    ${past.length?`<div class="section-label" style="margin-top:20px">Verleden</div>${past.map(a=>`
      <div class="avail-row" style="opacity:0.5">
        <div style="font-size:24px"><span class="ic" data-icon="forbidden"></span></div>
        <div class="avail-info">
          <div class="avail-date" style="font-size:14px;font-weight:600">${fmtDate(a.date)}</div>
          ${a.note?`<div class="avail-note">${a.note}</div>`:''}
        </div>
        <button class="btn btn-ghost btn-sm" onclick="deleteAvail('${a.id}')">✕</button>
      </div>`).join('')}`:''}
  `;
  c.querySelectorAll('.avail-edit-btn').forEach(btn=>{
    btn.addEventListener('click', function(){
      const id=this.getAttribute('data-id');
      const a=allAvail.find(x=>x.id===id);
      if(a) editAvailNote(id, a);
    });
  });
}
function openAvailModal(){
  const todayStr=new Date().toISOString().split('T')[0];
  modal(`
    <div class="modal-handle"></div>
    <div class="modal-title">Niet beschikbaar</div>
    <div class="form-row">
      <div class="form-section">
        <label class="form-label">Van</label>
        <input type="date" class="form-input" id="aDateStart" min="${todayStr}" value="${todayStr}" onchange="if(document.getElementById('aDateEnd').value<this.value)document.getElementById('aDateEnd').value=this.value;document.getElementById('aDateEnd').min=this.value;">
      </div>
      <div class="form-section">
        <label class="form-label">T/m</label>
        <input type="date" class="form-input" id="aDateEnd" min="${todayStr}" value="${todayStr}">
      </div>
    </div>
    <p style="font-size:12px;color:var(--text3);margin:-8px 0 12px">Kies dezelfde datum voor beide velden voor één losse dag, of een langere periode voor bijv. vakantie.</p>
    <div class="form-section">
      <label class="form-label">Reden (optioneel)</label>
      <input type="text" class="form-input" id="aNote" placeholder="Vakantie, verjaardag…">
    </div>
    <button class="btn btn-yellow btn-full" onclick="saveAvail()" style="margin-top:4px">Opslaan</button>
  `);
}
async function saveAvail(){
  const vs=$('aDateStart').value, ve=$('aDateEnd').value||vs, note=$('aNote').value;
  if(!vs){toast('Kies een datum','err');return;}
  const[ys,ms,ds]=vs.split('-').map(Number);
  const[ye,me,de]=ve.split('-').map(Number);
  const start=new Date(ys,ms-1,ds), end=new Date(ye,me-1,de);
  if(end<start){toast('Einddatum ligt vóór begindatum','err');return;}
  const dayCount=Math.round((end-start)/86400000)+1;
  if(dayCount>90){toast('Maximaal 90 dagen in één keer','err');return;}
  const{db,collection,addDoc,Timestamp,serverTimestamp}=window._f;
  const promises=[];
  for(let i=0;i<dayCount;i++){
    const d=new Date(start); d.setDate(d.getDate()+i);
    promises.push(addDoc(collection(db,'availability'),{uid:U.uid,date:Timestamp.fromDate(d),note,createdAt:serverTimestamp()}));
  }
  await Promise.all(promises);
  closeModal();
  toast(dayCount>1?`${dayCount} dagen opgeslagen!`:'Opgeslagen!','ok');
}
async function deleteAvail(id){
  const ok=await confirm2('Verwijderen','Blokkade verwijderen?','Verwijderen');
  if(!ok)return;
  const{db,doc,deleteDoc}=window._f;
  await deleteDoc(doc(db,'availability',id));
  toast('Verwijderd','ok');
}
async function editAvailNote(id,avail){
  const dateVal=dKey(avail.date);
  modal(`<div class="modal-handle"></div>
    <div class="modal-title">Afwezigheid bewerken</div>
    <div class="form-section"><label class="form-label">Datum</label>
      <input type="date" class="form-input" id="editAvailDateInput" value="${dateVal}"></div>
    <div class="form-section"><label class="form-label">Reden</label>
      <input type="text" class="form-input" id="editAvailNoteInput" value="${(avail.note||'').replace(/"/g,'&quot;')}" placeholder="Vakantie, verjaardag…"></div>
    <button class="btn btn-yellow btn-full" onclick="saveAvailNote('${id}')">Opslaan</button>`);
}
async function saveAvailNote(id){
  const note=document.getElementById('editAvailNoteInput')?.value||'';
  const dateVal=document.getElementById('editAvailDateInput')?.value;
  const{db,doc,updateDoc,Timestamp}=window._f;
  const updates={note};
  if(dateVal){ const[y,m,d]=dateVal.split('-').map(Number); updates.date=Timestamp.fromDate(new Date(y,m-1,d)); }
  await updateDoc(doc(db,'availability',id),updates);
  closeModal(); toast('Opgeslagen!','ok');
}

let _migStep=0;
window.openMatchImportGuide=function(){
  _migStep=0;
  modal(`<div class="modal-handle"></div>
    <div class="modal-title">Wedstrijden importeren — korte uitleg</div>
    <p style="font-size:12.5px;color:var(--mhv-yellow);line-height:1.5;margin:-6px 0 14px"><span class="ic" data-icon="info"></span> Doe dit het liefst op een <b>laptop of desktop</b> — rechtsklikken en de Developer Tools werken op een telefoon niet op dezelfde manier.</p>
    <div id="migBody"></div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn btn-ghost" id="migPrev" onclick="migNav(-1)" style="flex:1">‹ Vorige</button>
      <button class="btn btn-yellow" id="migNext" onclick="migNav(1)" style="flex:1">Volgende ›</button>
    </div>`);
  _renderMigStep();
};
window.migNav=function(d){
  _migStep=Math.max(0,Math.min(MATCH_IMPORT_GUIDE_STEPS.length-1,_migStep+d));
  _renderMigStep();
};
function _renderMigStep(){
  const s=MATCH_IMPORT_GUIDE_STEPS[_migStep];
  const n=MATCH_IMPORT_GUIDE_STEPS.length;
  const body=document.getElementById('migBody'); if(!body)return;
  body.innerHTML=`
    <div style="font-size:11px;color:var(--text3);font-weight:700;letter-spacing:.3px;margin-bottom:6px">STAP ${_migStep+1} VAN ${n}</div>
    <div style="font-size:15.5px;font-weight:800;margin-bottom:8px">${s.title}</div>
    <img src="${s.img}" style="width:100%;border-radius:12px;border:1px solid var(--separator);margin-bottom:10px;display:block">
    <div style="font-size:13.5px;color:var(--text2);line-height:1.6">${s.body}</div>
    <div style="display:flex;justify-content:center;gap:5px;margin-top:14px">
      ${MATCH_IMPORT_GUIDE_STEPS.map((_,i)=>`<span style="width:${i===_migStep?'16px':'6px'};height:6px;border-radius:99px;background:${i===_migStep?'var(--mhv-yellow)':'var(--bg3)'};transition:width .2s"></span>`).join('')}
    </div>`;
  const prev=document.getElementById('migPrev'), next=document.getElementById('migNext');
  if(prev) prev.style.visibility=_migStep===0?'hidden':'visible';
  if(next) next.textContent=_migStep===n-1?'Sluiten':'Volgende ›';
  if(next) next.onclick=_migStep===n-1?closeModal:function(){migNav(1);};
}

// 'Functies tijdelijk uitzetten' (app-breed chat/rooster/beschikbaarheid uitzetten) staat expres
// NIET meer in het beheerder-paneel — alleen dev mag dit (zie renderDevAcc). Een beheerder kan nog
// altijd functies UIT ZETTEN VOOR ÉÉN PERSOON, bij die medewerker bewerken (eeFeature_-checkboxes).
function renderFeatureFlagsPanel(){
  return `
    <div class="section-label">Functies tijdelijk uitzetten</div>
    <div class="card" style="margin-bottom:16px"><div style="padding:16px">
      <p style="font-size:13px;color:var(--text3);margin-bottom:14px;line-height:1.5">Werkt iets niet, of is er onderhoud? Zet een functie hier uit voor <b>alle</b> gebruikers. Ze zien dan netjes "tijdelijk buiten gebruik" i.p.v. een kapot scherm. Voor één persoon: ga naar die medewerker → Functies uitzetten voor deze persoon.</p>
      ${Object.entries(TOGGLABLE_FEATURES).map(([key,label])=>`
      <label class="worker-check" style="margin-bottom:10px">
        <input type="checkbox" id="ff_${key}" ${(key==='matches'?APP_SETTINGS.disabledFeatures?.matches!==false:APP_SETTINGS.disabledFeatures?.[key])?'checked':''}>
        <div class="worker-check-info"><div class="worker-check-name">${label} uitzetten</div></div>
      </label>
      <input type="text" class="form-input" id="ffmsg_${key}" placeholder="Eigen bericht (optioneel), bv. '${label} is tijdelijk buiten gebruik i.v.m. onderhoud.'" value="${escAnn(APP_SETTINGS.disabledMsg?.[key]||'')}" style="margin:-6px 0 14px">
      ${key==='matches'?`<p style="font-size:11.5px;color:var(--text3);margin:-8px 0 14px">${escAnn(matchSyncStatusText())}</p>`:''}
      `).join('')}
      <button class="btn btn-yellow btn-full" onclick="saveFeatureFlags()">Opslaan</button>
    </div></div>`;
}
async function saveFeatureFlags(){
  const disabledFeatures={}, disabledMsg={};
  Object.keys(TOGGLABLE_FEATURES).forEach(key=>{
    disabledFeatures[key]=!!$('ff_'+key)?.checked;
    const m=($('ffmsg_'+key)?.value||'').trim();
    if(m) disabledMsg[key]=m;
  });
  const{db,doc,setDoc}=window._f;
  await setDoc(doc(db,'settings','general'),{disabledFeatures,disabledMsg},{merge:true});
  APP_SETTINGS.disabledFeatures=disabledFeatures;
  APP_SETTINGS.disabledMsg=disabledMsg;
  toast('Instelling opgeslagen!','ok');
}

async function createInvite(){
  const name=$('eName').value.trim(), email=$('eEmail').value.trim();
  const roleVal=($('eRole')&&$('eRole').value)||'employee';
  const wage=roleVal==='employee'?(parseFloat($('eWage').value)||0):0;
  if(!name||!email){toast('Naam en e-mail verplicht','err');return;}
  const isGuest=roleVal==='employee'&&!!$('eGuest')?.checked;
  let guestUntil=null;
  if(isGuest){
    const dv=$('eGuestUntil')?.value;
    if(!dv){toast('Kies een einddatum voor het gastaccount','err');return;}
    // Eind van die dag, lokale tijd — zodat de laatste dag nog volledig bruikbaar is.
    const[gy,gm,gd]=dv.split('-').map(Number);
    guestUntil=new Date(gy,gm-1,gd,23,59,59,999).getTime();
  }
  const{db,collection,addDoc,serverTimestamp}=window._f;
  const payload={name,email,wage,role:roleVal,used:false,createdBy:U.uid,createdAt:serverTimestamp()};
  if(guestUntil){ payload.guestUntil=guestUntil; payload.guestApproved=(U.role==='software'); }
  const ref=await addDoc(collection(db,'invites'),payload);
  if(guestUntil&&U.role!=='software'){
    const devs=allUsers.filter(u=>u.role==='software').map(u=>u.uid);
    if(devs.length) sendNotifMulti(devs,'Gastaccount wacht op goedkeuring',U.name+' nodigde '+name+' uit als gast tot '+new Date(guestUntil).toLocaleDateString('nl-NL')+'. Keur goed bij Beheer → Gasten.').catch(()=>{});
  }
  const base=window.location.origin+window.location.pathname.replace(/\/[^\/]*$/,'');
  const link=`${base}/register.html?invite=${ref.id}`;
  const r=$('inviteResult');
  r.style.display='block';
  r.innerHTML=`
    <div style="background:var(--green-dim);border:1px solid rgba(48,209,88,0.2);border-radius:10px;padding:14px">
      <div style="font-size:12px;font-weight:700;color:var(--green);margin-bottom:8px">✓ Link aangemaakt</div>
      <div style="font-size:12px;word-break:break-all;color:var(--text2);margin-bottom:10px">${link}</div>

      </div>
    </div>`;
}

function restricted(key){ return U.role==='admin' && !!U.restrictions?.[key]; }
async function saveEmployee(uid){
  const name=$('eeName').value.trim(), wage=parseFloat($('eeWage').value)||0;
  const roleEl=$('eeRole');
  const role=roleEl&&!roleEl.disabled?roleEl.value:undefined;
  const canServe=!!$('eeCanServe')?.checked;
  if(!name){toast('Naam verplicht','err');return;}
  const{db,doc,updateDoc,setDoc}=window._f;
  const payload={name,wage,canServe};
  // Functies uitzetten voor deze persoon — alleen meesturen als de checkboxes er zijn (ze staan er
  // altijd, maar zijn uitgeschakeld voor een beheerder van wie de dev deze bevoegdheid introk).
  if(!restricted('toggleFeatures')){
    payload.disabledFeatures=Object.keys(TOGGLABLE_FEATURES).filter(key=>!!$('eeFeature_'+key)?.checked);
  }
  if(role) payload.role=role;
  // Bevoegdheden-restricties (alleen door dev in te stellen, alleen relevant voor een beheerder-account)
  if($('eeRestrictAddEmployee')){
    payload.restrictions={
      addEmployee:!!$('eeRestrictAddEmployee').checked,
      deleteShift:!!$('eeRestrictDeleteShift').checked,
      payout:!!$('eeRestrictPayout').checked,
      editShift:!!$('eeRestrictEditShift').checked,
      approve:!!$('eeRestrictApprove').checked,
      announcements:!!$('eeRestrictAnnouncements').checked,
      manageEmployees:!!$('eeRestrictManageEmployees').checked,
      toggleFeatures:!!$('eeRestrictToggleFeatures').checked,
    };
  }
  try{
    await updateDoc(doc(db,'users',uid),payload);
    const pubPayload={name,canServe}; if(role) pubPayload.role=role;
    await setDoc(doc(db,'publicProfiles',uid),pubPayload,{merge:true}).catch(()=>{});
    await loadUsers(); closeModal(); toast('Opgeslagen!','ok');
  }catch(e){
    toast('Opslaan mislukt: '+e.message,'err');
    console.error('saveEmployee error:',e);
  }
}

async function resetPwAdmin(uid,name,email){
  const ok=await confirm2('Wachtwoord resetten',`Een herstelmail sturen naar ${name} (${email})?`,'Verstuur link','btn-yellow');
  if(!ok)return;
  // Gebruikt de ingebouwde, beveiligde Firebase Auth reset-flow i.p.v. een zelfgemaakt token-systeem
  // (dat was de oorzaak van "link ongeldig" — er werd nooit een geldig tijdelijk wachtwoord aangemaakt).
  const{auth,sendPasswordResetEmail}=window._f;
  const base=window.location.origin+window.location.pathname.replace(/\/[^\/]*$/,'');
  try{
    await sendPasswordResetEmail(auth,email,{url:`${base}/reset-pw.html`,handleCodeInApp:true});
    toast('Herstelmail verstuurd via Firebase!','ok');
  }catch(e){
    console.error('resetPwAdmin error:',e);
    let msg='Versturen mislukt.';
    if(e.code==='auth/user-not-found') msg='Geen account gevonden met dit e-mailadres.';
    if(e.code==='auth/too-many-requests') msg='Te veel pogingen — probeer het over een paar minuten opnieuw.';
    toast(msg,'err');
  }
}

async function deleteEmployee(uid,name){
  const ok=await confirm2('Medewerker verwijderen',`${name} permanent verwijderen? Dit kan niet ongedaan gemaakt worden.`,'Verwijderen');
  if(!ok)return;
  const{db,doc,deleteDoc}=window._f;
  // Remove user doc (Firebase Auth account stays but can't login without Firestore doc)
  await deleteDoc(doc(db,'users',uid));
  // Remove their availability
  const{collection,query,where,getDocs}=window._f;
  const avSnap=await getDocs(window._f.query(collection(db,'availability'),where('uid','==',uid)));
  for(const d of avSnap.docs) await deleteDoc(doc(db,'availability',d.id));
  await loadUsers();
  toast(`${name} verwijderd`,'ok');
}

function buildWorkerList(dayKey, preChecked){
  preChecked=preChecked||[];
  const bl=blockedOn(dayKey).map(a=>a.uid);
  return employees().map(u=>{
    const isPreChecked=preChecked.includes(u.uid);
    // Al toegewezen medewerkers blijven aanklikbaar/uitvinkbaar, ook als ze inmiddels niet
    // beschikbaar staan — anders zou je ze bij bewerken per ongeluk kwijtraken. Nieuw
    // toevoegen van iemand die niet beschikbaar is, is en blijft geblokkeerd.
    const isBlocked=bl.includes(u.uid) && !isPreChecked;
    const teamWarn=teamWarningLine(u.uid,dayKey);
    return `<label class="worker-check ${isBlocked?'blocked':''}">
      <input type="checkbox" value="${u.uid}" ${isPreChecked?'checked':''} ${isBlocked?'disabled':''}>

}

async function saveShift(){
  const dateVal=$('sDate').value, start=$('sStart').value, end=$('sEnd').value;
  const sluit=$('sEndSluit')?.checked;
  const workers=[...document.querySelectorAll('#workerList input:checked')].map(i=>i.value);
  const note=($('esNote')?.value||'').trim();
  if(!dateVal||!start||(!sluit&&!end)){toast('Vul alles in','err');return;}
  // Een dienst zonder toegewezen medewerker mag — die krijgt een oranje "niemand toegewezen"-status
  // en beheerders krijgen naarmate de datum nadert een herinnering (zie checkShiftReminders).
  const[y,m,d]=dateVal.split('-').map(Number);
  const startR=roundTimeStr(start), endR=sluit?'sluit':roundTimeStr(end);
  const confs={}; workers.forEach(uid=>confs[uid]='pending');
  const{db,collection,addDoc,Timestamp,serverTimestamp}=window._f;
  await addDoc(collection(db,'shifts'),{
    date:Timestamp.fromDate(new Date(y,m-1,d)),
    startTime:startR,endTime:endR,workers,
    workerConfirmations:confs,finalTimes:{},
    note:note||null, noteImage:window._shiftNoteImg||null,
    createdBy:U.uid,createdAt:serverTimestamp()
  });
  window._shiftNoteImg=null;
  const dateStr=new Date(y,m-1,d).toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'});
  await sendNotifMulti(workers,'Nieuwe dienst',`Je hebt een nieuwe dienst op ${dateStr} van ${startR}–${dispTime(endR)}.`+(note?`\n\n${note}`:''));
  closeModal(); toast('Dienst aangemaakt!','ok');
}

function endTimeFieldHtml(inputId,chkId,currentEnd){
  const sluit=isSluit(currentEnd);
  return `<div class="form-section"><label class="form-label">Eind</label>
    <input type="time" class="form-input" id="${inputId}" value="${sluit?'':(currentEnd||'')}" ${sluit?'disabled':''}>
    <label style="display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--text3);cursor:pointer">
      <input type="checkbox" id="${chkId}" ${sluit?'checked':''} onchange="toggleSluitField('${inputId}',this)"> Sluit <span style="opacity:.8">(onbekende eindtijd, tot de zaak dicht is)</span>
    </label>
  </div>`;
}
window.toggleSluitField=(inputId,chk)=>{
  const el=$(inputId); if(!el)return;
  el.disabled=chk.checked;
  if(chk.checked){ el.dataset.prevValue=el.value||'23:00'; el.value=''; }
  else { el.value=el.dataset.prevValue||'23:00'; }

function bindNoteImgInput(){
  const imgInput=document.getElementById('esNoteImg');
  if(imgInput) imgInput.onchange=function(){
    const file=this.files[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        const max=900; let w=img.width,h=img.height;
        if(w>max){h=Math.round(h*max/w);w=max;}
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        window._shiftNoteImg=canvas.toDataURL('image/jpeg',0.75);
        const prev=document.getElementById('esNoteImgPreview');
        if(prev) prev.innerHTML='<img src="'+window._shiftNoteImg+'" style="max-width:100%;border-radius:10px;max-height:120px">';
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  };
}

async function saveEditShift(shiftId){
  const dateVal=$('esDate').value, start=$('esStart').value, end=$('esEnd').value;
  const sluit=$('esEndSluit')?.checked;
  const workers=[...document.querySelectorAll('#editWorkerList input:checked')].map(i=>i.value);
  const note=($('esNote')?.value||'').trim();
  if(!dateVal||!start||(!sluit&&!end)||!workers.length){toast('Vul alles in','err');return;}
  const[y,m,d]=dateVal.split('-').map(Number);
  const startR=roundTimeStr(start), endR=sluit?'sluit':roundTimeStr(end);
  const s=allShifts.find(x=>x.id===shiftId);
  const prevConf=s?.workerConfirmations||{};
  const newConf={}; workers.forEach(uid=>newConf[uid]=prevConf[uid]||'pending');
  const{db,doc,updateDoc,Timestamp}=window._f;
  const hadNote=!!(s&&s.note);
  await updateDoc(doc(db,'shifts',shiftId),{
    date:Timestamp.fromDate(new Date(y,m-1,d)),
    startTime:startR,endTime:endR,workers,workerConfirmations:newConf,
    note:note||null, noteImage:window._shiftNoteImg||null
  });
  // Nieuwe/gewijzigde notitie -> medewerkers een melding sturen
  if(note && (!hadNote || note!==s.note)){
    await notifyUsers(workers,'Notitie bij je dienst',note,note,{type:'general',email:false});
  }
  window._shiftNoteImg=null;
  closeModal(); toast('Bijgewerkt!','ok');
}
async function deleteShift(shiftId){
  const s=allShifts.find(x=>x.id===shiftId); if(!s)return;
  if(isShiftLocked(s)){ toast('Deze dienst is geweest en volledig uitbetaald — niet meer te verwijderen.','err'); return; }
  const ok=await confirm2('Dienst verwijderen','Medewerkers ontvangen een melding.','Verwijderen');
  if(!ok)return;
  const{db,doc,deleteDoc}=window._f;
  const d=toDate(s.date);

// UITBETALING
function renderUitbetaling(c){
  const now=new Date();
  const months=[];
  for(let i=0;i<6;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({y:d.getFullYear(),m:d.getMonth(),label:`${MO[d.getMonth()]} ${d.getFullYear()}`});}
  const{y,m}=months[payMonth];
  const monthShifts=allShifts.filter(s=>{const d=toDate(s.date);return d.getFullYear()===y&&d.getMonth()===m;});
  // Bewust NIET starten vanuit employees() — die filtert strikt op role==='employee'. Een account
  // met een afwijkend of ontbrekend rolveld (bv. handmatig/oud aangemaakt) viel daardoor volledig
  // uit Uitbetaling weg, ook al stond diegene wel degelijk — en zelfs al uitbetaald — op een
  // dienst. We bepalen dus wie hier moet verschijnen rechtstreeks vanuit de diensten zelf.
  const workerIds=new Set();
  monthShifts.forEach(s=>(s.workers||[]).forEach(uid=>workerIds.add(uid)));
  const payData=[...workerIds].map(uid=>{
    const u=allUsers.find(x=>x.uid===uid)||{uid,name:'Onbekend account',wage:0};
    const myS=monthShifts.filter(s=>s.workers?.includes(uid));
    const approved=myS.filter(s=>getShiftStatus(s,uid)==='approved');
    const paid=myS.filter(s=>getShiftStatus(s,uid)==='paid');
    // "reviewing" = medewerker heeft de dienst al bevestigd, maar een beheerder moet 'm nog
    // goedkeuren voor 'ie meetelt als schuldig loon. Zonder deze apart te tonen leek een
    // bevestigde dienst hier gewoon te verdwijnen (0,00 schuldig, geen enkele aanwijzing waarom).
    const reviewing=myS.filter(s=>getShiftStatus(s,uid)==='reviewing');
    const reviewingPay=reviewing.reduce((sum,s)=>{const{start,end}=getEffectiveTimes(s,uid);return sum+calcPay(start,end,u.wage||0);},0);
    const approvedPay=approved.reduce((sum,s)=>sum+getApprovedPay(s,uid),0);
    const paidPay=paid.reduce((sum,s)=>sum+getApprovedPay(s,uid),0);
    const isPaid=myS.length>0&&myS.every(s=>getShiftStatus(s,uid)==='paid');
    return{...u,myS,approved,paid,reviewing,reviewingPay,approvedPay,paidPay,isPaid};
  });
  const totalSchuld=payData.reduce((s,u)=>s+u.approvedPay,0);
  const totalPaid=payData.reduce((s,u)=>s+u.paidPay,0);
  const totalReviewing=payData.reduce((s,u)=>s+u.reviewing.length,0);

  c.innerHTML=`
    <div class="form-section" style="margin-bottom:14px">
      <label class="form-label">Maand</label>
      <select class="form-input" onchange="payMonth=parseInt(this.value);renderAdminTab()">
        ${months.map((mo,i)=>`<option value="${i}" ${i===payMonth?'selected':''}>${mo.label}</option>`).join('')}
      </select>
    </div>
    <div class="stats-grid">
      <div class="stat-tile red"><div class="stat-num red" style="font-size:22px">${fmtMoney(totalSchuld)}</div><div class="stat-lbl">Nog te betalen</div></div>
      <div class="stat-tile green"><div class="stat-num green" style="font-size:22px">${fmtMoney(totalPaid)}</div><div class="stat-lbl">Uitbetaald</div></div>
    </div>
    ${payData.length?`<div class="pill-tabs" style="margin-bottom:10px">
      <button class="pill-tab ${exportFormat==='excel'?'active':''}" onclick="setExportFormat('excel')">Excel</button>
      <button class="pill-tab ${exportFormat==='pdf'?'active':''}" onclick="setExportFormat('pdf')">PDF</button>
    </div>
    <button class="btn btn-ghost btn-full" style="margin-bottom:14px" onclick="${exportFormat==='pdf'?`exportMonthPDF('${y}','${m}')`:`exportBookkeeping('${y}','${m}')`}"><span class="ic" data-icon="${exportFormat==='pdf'?'clipboard':'chart'}"></span> Maandoverzicht exporteren als ${exportFormat==='pdf'?'PDF':'Excel'}</button>`:''}
    ${totalReviewing?`<div class="card" style="margin-bottom:12px;border:1px solid var(--orange)">
      <div class="card-row"><div style="flex:1">
        <div style="font-size:14px;font-weight:700;color:var(--orange)"><span class="ic" data-icon="hourglass"></span> ${totalReviewing} dienst(en) wachten nog op jouw goedkeuring</div>
        <div style="font-size:12px;color:var(--text3);margin-top:2px">Deze tellen pas mee als "schuldig" zodra je ze hieronder goedkeurt.</div>
      </div></div>
    </div>`:''}
    ${payData.length?payData.map(u=>`
      <div class="card" style="margin-bottom:10px">
        <div class="card-row">
          <div class="avatar" style="width:40px;height:40px;font-size:15px;flex-shrink:0">${userAvatarHtml(u.uid)}</div>
          <div style="flex:1">
            <div style="font-size:16px;font-weight:700">${u.name}</div>
            <div style="font-size:12px;color:var(--text3)">${u.myS.length} dienst(en) · ${fmtMoney(u.wage||0)}/uur</div>
          </div>
          <div style="text-align:right">
            ${u.approvedPay>0?`<div style="font-size:17px;font-weight:800;color:var(--red)">${fmtMoney(u.approvedPay)}</div><div style="font-size:11px;color:var(--text3)">schuldig</div>`:''}
            ${u.paidPay>0?`<div style="font-size:13px;color:var(--green)">${fmtMoney(u.paidPay)} betaald</div>`:''}
          </div>
        </div>
        ${(u.reviewing.length&&!restricted('approve'))?`<div class="card-row" style="background:var(--orange-dim)">
          <div style="flex:1">
            <div style="font-size:13px;color:var(--orange)"><span class="ic" data-icon="hourglass"></span> ${u.reviewing.length} nog goed te keuren</div>
            <div style="font-size:11px;color:var(--text3);margin-top:1px">Verwacht: ${fmtMoney(u.reviewingPay)} (telt pas mee na goedkeuring)</div>
          </div>
          <button class="btn btn-sm" style="background:var(--orange);color:#1a0f00" onclick="openReviewApprovals('${u.uid}','${y}','${m}')">Bekijken</button>
        </div>`:''}
        <div class="card-row" style="gap:8px">
          ${(u.approvedPay>0&&!restricted('payout'))?`<button class="btn btn-green btn-sm" style="flex:1" onclick="markPaid('${u.uid}','${y}','${m}','${u.name}','${u.approvedPay.toFixed(2)}')">✓ Uitbetaald</button>`:''}
          <button class="btn btn-ghost btn-sm" style="flex:1" onclick="showPayDetail('${u.uid}','${y}','${m}')">Details</button>
        </div>
      </div>`).join('')
    :`<div class="empty"><div class="empty-icon"><span class="ic" data-icon="euro"></span></div><p>Geen diensten deze maand</p></div>`}
  `;
}

async function markPaid(uid,year,month,name,amount){
  const ok=await confirm2('Uitbetaling registreren',`${name} markeren als uitbetaald voor ${fmtMoney(amount)}?`,'Bevestigen','btn-green');
  if(!ok)return;
  const y=parseInt(year),m=parseInt(month);
  const toMark=allShifts.filter(s=>{const d=toDate(s.date);return d.getFullYear()===y&&d.getMonth()===m&&s.workers?.includes(uid)&&getShiftStatus(s,uid)==='approved';});
  const{db,doc,updateDoc,collection,addDoc,serverTimestamp}=window._f;
  for(const s of toMark) await updateDoc(doc(db,'shifts',s.id),{[`paidFor.${uid}`]:true,[`workerConfirmations.${uid}`]:'approved'});
  await addDoc(collection(db,'payments'),{uid,year:y,month:m,amount:parseFloat(amount),paidBy:U.uid,paidAt:serverTimestamp()});
  await sendNotif(uid,'Uitbetaling ontvangen',`Je hebt ${fmtMoney(amount)} ontvangen voor ${MO[m]} ${y}.`);
  const u=allUsers.find(x=>x.uid===uid);
  if(u?.email){
    try{await trackedEmailSend(window._f.EMAILJS_SERVICE_ID,window._f.EMAILJS_TPL_PAYMENT,{to_email:u.email,to_name:u.name,amount:fmtMoney(amount),month:`${MO[m]} ${y}`,title:'Uitbetaling ontvangen',body:`Je hebt ${fmtMoney(amount)} ontvangen voor ${MO[m]} ${y}.`});}
    catch(e){console.warn('Email fout:',e);}
  }
  toast('Uitbetaling geregistreerd!','ok');
}

async function sendMsg(){
  const recipients=[...document.querySelectorAll('.msg-r:checked')].map(i=>i.value);
  const title=$('msgTitle').value.trim(), body=$('msgBody').value.trim();
  if(!recipients.length){toast('Kies ontvangers','err');return;}
  if(!title||!body){toast('Vul titel en bericht in','err');return;}
  await sendNotifMulti(recipients,title,body);
  for(const uid of recipients){
    const u=allUsers.find(x=>x.uid===uid);
    if(u?.email){
      try{await trackedEmailSend(window._f.EMAILJS_SERVICE_ID,window._f.EMAILJS_TPL_NOTIF,{to_email:u.email,to_name:u.name,title,body});}

  }
  $('msgTitle').value=''; $('msgBody').value='';
  document.querySelectorAll('.msg-r').forEach(r=>r.checked=false);
  $('msgAll').checked=false;
  toast(`Verstuurd naar ${recipients.length} persoon/personen!`,'ok');
}

  const{db,collection,onSnapshot,query,where}=window._f;
  const q=query(collection(db,'dms'),where('participants','array-contains',U.uid));
  unsubDMs=onSnapshot(q,s=>{

}

async function approveLogRequest(threadId,msgIndex){
  const selectedUids=[...document.querySelectorAll('.logreview-uid:checked')].map(i=>i.value);
  const hours=parseInt($('logExpiryChoice')?.value||'72',10);
  const expiresAt=hours>0?(Date.now()+hours*3600*1000):null;
  const logs=await loadLoginLogs();
  const filtered=logs.filter(l=>selectedUids.includes(l.uid)).map(l=>({
    uid:l.uid, name:userName(l.uid), type:l.type, device:l.device||'',
    ip:l.ip||'', t:l.createdAt?.toDate?l.createdAt.toDate().toISOString():null
  }));
  const{db,doc,getDoc,updateDoc,serverTimestamp}=window._f;
  const snap=await getDoc(doc(db,'dms',threadId));
  const data=snap.data();
  const messages=[...(data.messages||[])];
  messages[msgIndex]={...messages[msgIndex],status:'approved',logData:filtered,expiresAt};
  await updateDoc(doc(db,'dms',threadId),{messages,updatedAt:serverTimestamp()});
  const otherUid=data.participants.find(p=>p!==U.uid);
  const expTxt=expiresAt?(' Beschikbaar tot '+new Date(expiresAt).toLocaleDateString('nl-NL',{day:'numeric',month:'long'})+'.'):'';
  await notifyUsers([otherUid],'Logboek goedgekeurd',U.name+' heeft je logboekverzoek goedgekeurd — download het in het gesprek.',U.name+' heeft je logboekverzoek goedgekeurd.'+expTxt+' Open Meldingen om het te downloaden.',{type:'message'});
  closeModal(); toast('Goedgekeurd en verstuurd!','ok');
}

function downloadApprovedLog(threadId,msgIndex){
  const t=allDMs.find(x=>x.id===threadId);
  const msg=t&&t.messages&&t.messages[msgIndex];
  if(!msg||!msg.logData){toast('Geen data gevonden','err');return;}
  if(msg.expiresAt && Date.now()>msg.expiresAt){toast('Deze export is verlopen — vraag opnieuw aan bij de dev.','err');return;}
  const aoa=[['Gebruiker','Type','Datum','Tijd','Apparaat','IP-adres']];
  msg.logData.forEach(l=>{
    const d=l.t?new Date(l.t):null;
    aoa.push([l.name,l.type==='login'?'Ingelogd':'Uitgelogd',d?d.toLocaleDateString('nl-NL'):'',d?d.toLocaleTimeString('nl-NL'):'',l.device,l.ip||'onbekend']);
  });
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:18},{wch:10},{wch:12},{wch:10},{wch:22},{wch:16}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Logboek');
  XLSX.writeFile(wb,`MHVwork-logboek-gedeeld_${new Date().toISOString().split('T')[0]}.xlsx`);
}
window._dmPending=null; window._dmFileCache=window._dmFileCache||{};
const DM_MAX_BYTES=700*1024;
window.pickDmFile=function(){ const i=$('dmFileInput'); if(i) i.click(); };
window.handleDmFile=async function(file,inputEl){
  if(!file) return;
  try{
    let dataUrl,type=file.type||'application/octet-stream',name=file.name||'bijlage',size=file.size;
    if(type.startsWith('image/')&&type!=='image/gif'&&type!=='image/svg+xml'){
      dataUrl=await compressImageFile(file,1400,0.78);
      if(dataUrl.length*0.75>DM_MAX_BYTES) dataUrl=await compressImageFile(file,1000,0.6);
      type='image/jpeg'; name=name.replace(/\.\w+$/,'')+'.jpg'; size=Math.round(dataUrl.length*0.75);
    } else {
      if(file.size>DM_MAX_BYTES){ toast('Bestand te groot — maximaal 700 KB','err'); return; }
      dataUrl=await readFileAsDataUrl(file);
    }
    if(size>DM_MAX_BYTES){ toast('Bestand te groot — maximaal 700 KB','err'); return; }
    window._dmPending={name,type,size,dataUrl};
    showDmPending();
  }catch(e){ toast('Bijlage kon niet worden gelezen','err'); }
  finally{ if(inputEl) inputEl.value=''; }
};
function showDmPending(){
  let el=$('dmPending'); const inp=$('dmInput'); if(!inp) return;

  const f=window._dmPending;

window._pendingDM=window._pendingDM||{};
async function _commitDM(otherUid,text,file){
  const id=dmThreadId(U.uid,otherUid);
  const{db,doc,updateDoc,addDoc,collection,serverTimestamp}=window._f;
  let fileRef=null;
  if(file){
    const fr=await addDoc(collection(db,'dmFiles'),{threadId:id,participants:[U.uid,otherUid],from:U.uid,name:file.name,type:file.type,size:file.size,dataUrl:file.dataUrl,createdAt:serverTimestamp()});
    fileRef={id:fr.id,name:file.name,type:file.type,size:file.size};
    window._dmFileCache[fr.id]=file.dataUrl;
  }
  const msg={from:U.uid,text,ts:Date.now()}; if(fileRef) msg.file=fileRef;
  await updateDoc(doc(db,'dms',id),{
    messages:[...(((allDMs.find(x=>x.id===id))||{}).messages||[]),msg],
    lastText:text||('Bijlage: '+(file?file.name:'')), lastFrom:U.uid, readBy:[U.uid], updatedAt:serverTimestamp()
  });
  // Privéberichten zijn altijd ALLEEN een pushmelding — nooit een e-mail, geen keuze meer.
  await notifyUsers([otherUid],'Bericht van '+U.name,text||('Bijlage: '+(file?file.name:'')),text||('Bijlage: '+(file?file.name:'')),{type:'message',email:false});
}
async function sendDM(otherUid,otherName){
  const inp=document.getElementById('dmInput'); if(!inp)return;
  const text=inp.value.trim(); const file=window._dmPending||null;
  if(!text&&!file)return;
  inp.value='';
  const id=dmThreadId(U.uid,otherUid);
  clearTimeout(_dmTypingTimer); setTypingState(id,false);
  if(!navigator.onLine){
    (window._pendingDM[id]=window._pendingDM[id]||[]).push({otherUid,text,file,ts:Date.now()});
    if(file) clearDmPending();
    const t=allDMs.find(x=>x.id===id); if(t) _renderDMMessages(t);
    updateOfflineBanner();
    return;
  }
  try{
    await _commitDM(otherUid,text,file);
    if(file) clearDmPending();
  }catch(e){
    if(!navigator.onLine){
      (window._pendingDM[id]=window._pendingDM[id]||[]).push({otherUid,text,file,ts:Date.now()});
      if(file) clearDmPending();
      const t=allDMs.find(x=>x.id===id); if(t) _renderDMMessages(t);
      updateOfflineBanner();
    } else {
      console.error('sendDM FOUT:',e);
      inp.value=text; // teruggeven zodat het niet kwijt is
      toast('Versturen mislukt: '+(e.message||'onbekende fout'),'err');
    }
  }
}

function startAppTour(){
  const steps = U && U.role==='employee' ? TOUR_STEPS_BASE : [...TOUR_STEPS_BASE, ...TOUR_STEPS_ADMIN];
  let i=0;
  function showStep(){
    const s=steps[i];
    const isLast=i===steps.length-1;
    modal(`<div class="modal-handle"></div>
      <div style="text-align:center;padding:4px 0 4px">
        ${s.shot}
        <div class="modal-title" style="text-align:center;margin-top:16px">${s.title}</div>

        <div style="height:4px;background:var(--separator);border-radius:2px;overflow:hidden;margin-bottom:6px"><div style="height:100%;width:${Math.round((i+1)/steps.length*100)}%;background:var(--mhv-yellow);transition:width .3s ease"></div></div>

        <div style="display:flex;gap:8px">
          ${i>0?'<button class="btn btn-ghost" style="flex:1" onclick="tourPrev()">Terug</button>':''}
          <button class="btn btn-yellow" style="flex:2" onclick="tourNext()">${isLast?'Aan de slag!':'Volgende'}</button>

        ${!isLast?'<button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="closeModal();markTourSeen()">Overslaan</button>':''}
      </div>`);
  }
  window.tourNext=()=>{
    i++;
    if(i>=steps.length){ closeModal(); markTourSeen(); return; }

}

// Profielfoto — opgeslagen als gecomprimeerde base64-afbeelding IN het Firestore-document zelf,
// net als bij chat-/aankondigingsfoto's. Zo is er geen Firebase Storage (en dus geen Blaze-plan)
// voor nodig; Firestore-documenten mogen tot 1MB zijn, en na compressie past een profielfoto ruim.
function handleProfilePhoto(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=async()=>{
      const canvas=document.createElement('canvas');
      const size=300; // vierkant uitsnijden, klein genoeg voor snelle laadtijden
      const minSide=Math.min(img.width,img.height);
      canvas.width=size; canvas.height=size;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,(img.width-minSide)/2,(img.height-minSide)/2,minSide,minSide,0,0,size,size);
      const dataUrl=canvas.toDataURL('image/jpeg',0.8);
      try{
        const{db,doc,updateDoc,setDoc}=window._f;
        await updateDoc(doc(db,'users',U.uid),{photoData:dataUrl});
        await setDoc(doc(db,'publicProfiles',U.uid),{photoData:dataUrl},{merge:true}).catch(()=>{});
        U.photoData=dataUrl;
        renderProfile();
        toast('Profielfoto bijgewerkt!','ok');
      }catch(err){ toast('Opslaan mislukt — probeer een kleinere foto','err'); }
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

// LOGIN/LOGOUT-LOGBOEK — alleen zichtbaar voor dev, en gebruikt voor eigen apparaat-info bij Profiel.

function simpleDeviceLabel(){
  const ua=navigator.userAgent||'';
  let os='Onbekend apparaat';
  if(/iphone/i.test(ua))os='iPhone';
  else if(/ipad/i.test(ua))os='iPad';
  else if(/android/i.test(ua))os='Android';
  else if(/macintosh/i.test(ua))os='Mac';
  else if(/windows/i.test(ua))os='Windows';
  else if(/linux/i.test(ua))os='Linux';
  let browser='';
  if(/edg\//i.test(ua))browser='Edge';
  else if(/chrome\//i.test(ua)&&!/edg\//i.test(ua))browser='Chrome';
  else if(/safari\//i.test(ua)&&!/chrome\//i.test(ua))browser='Safari';
  else if(/firefox\//i.test(ua))browser='Firefox';
  return browser?`${os} · ${browser}`:os;
}
async function logLoginEvent(){
  try{
    const{db,doc,updateDoc,collection,addDoc,serverTimestamp,arrayUnion}=window._f;
    const device=simpleDeviceLabel();
    const logRef=await addDoc(collection(db,'loginLogs'),{
      uid:U.uid, type:'login', device, userAgent:navigator.userAgent, ip:null, createdAt:serverTimestamp()
    });
    const userRef=doc(db,'users',U.uid);
    const updates={ lastLoginAt:serverTimestamp(), lastDevice:device, knownDevices:arrayUnion(device) };
    if(!U.firstLoginAt) updates.firstLoginAt=serverTimestamp();
    await updateDoc(userRef,updates);
    // IP ophalen op de achtergrond — als dit faalt of traag is, merkt de gebruiker er niks van
    fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(d=>{
      if(d&&d.ip) updateDoc(logRef,{ip:d.ip}).catch(()=>{});
    }).catch(()=>{});
  }catch(e){ console.warn('logLoginEvent:',e); }
}
async function logLogoutEvent(){
  try{
    const{db,collection,addDoc,serverTimestamp}=window._f;
    await addDoc(collection(db,'loginLogs'),{
      uid:U.uid, type:'logout', device:simpleDeviceLabel(), userAgent:navigator.userAgent, ip:null, createdAt:serverTimestamp()
    });
  }catch(e){}
}

// WACHTWOORD WIJZIGEN — eigen "pagina" (als modal-sheet) met sterktemeter,
// dezelfde score-logica als op de registratiepagina.
// ═══════════════════════════════════════════
function pwScore(pw){
  let score=0; if(!pw)return 0;
  if(pw.length>=6)score++;
  if(pw.length>=10)score++;
  if(/[A-Z]/.test(pw)&&/[a-z]/.test(pw))score++;
  if(/[0-9]/.test(pw))score++;
  if(/[^A-Za-z0-9]/.test(pw))score++;
  return score;
}
function openPwChangePage(){
  modal(`
    <div class="modal-handle"></div>
    <div class="modal-title">Wachtwoord wijzigen</div>
    <div class="form-section"><label class="form-label">Huidig wachtwoord</label>
      <input type="password" class="form-input" id="pwC" placeholder="••••••••"></div>
    <div class="form-section"><label class="form-label">Nieuw wachtwoord</label>
      <input type="password" class="form-input" id="pwN" placeholder="Minimaal 6 tekens" oninput="updatePwStrength()"></div>
    <div id="pwStrengthBar" style="height:4px;border-radius:2px;background:var(--bg3);margin-top:-8px;margin-bottom:14px;overflow:hidden">
      <div id="pwStrengthFill" style="height:100%;width:0%;border-radius:2px;transition:width .25s ease,background .25s ease"></div>
    </div>
    <div id="pwStrengthLabel" style="font-size:12px;color:var(--text3);margin:-12px 0 14px;min-height:16px"></div>
    <div class="form-section"><label class="form-label">Herhaal nieuw</label>
      <input type="password" class="form-input" id="pwN2" placeholder="••••••••"></div>
    <button class="btn btn-yellow btn-full" style="margin-top:8px" onclick="changePw()">Wachtwoord wijzigen</button>
  `);
}
function updatePwStrength(){
  const pw=$('pwN')?.value||''; const score=pwScore(pw);
  const fill=$('pwStrengthFill'), label=$('pwStrengthLabel'); if(!fill||!label)return;
  const levels=[
    {w:'0%',  c:'var(--bg3)', t:''},
    {w:'20%', c:'var(--red)', t:'Zeer zwak'},
    {w:'40%', c:'var(--orange)', t:'Zwak'},
    {w:'60%', c:'var(--mhv-yellow)', t:'Redelijk'},
    {w:'80%', c:'var(--green)', t:'Sterk'},
    {w:'100%',c:'var(--green)', t:'Zeer sterk'},
  ];
  const lvl=levels[score];
  fill.style.width=lvl.w; fill.style.background=lvl.c;
  label.textContent=lvl.t; label.style.color=lvl.c;
}
async function changePw(){
  const cur=$('pwC').value, nw=$('pwN').value, nw2=$('pwN2').value;
  if(!cur||!nw||!nw2){toast('Vul alle velden in','err');return;}
  if(nw!==nw2){toast('Wachtwoorden komen niet overeen','err');return;}
  if(nw.length<6){toast('Minimaal 6 tekens','err');return;}
  try{
    const{auth,reauthenticateWithCredential,EmailAuthProvider,updatePassword}=window._f;
    const cred=EmailAuthProvider.credential(auth.currentUser.email,cur);
    await reauthenticateWithCredential(auth.currentUser,cred);
    await updatePassword(auth.currentUser,nw);
    closeModal();
    toast('Wachtwoord gewijzigd!','ok');
  }catch(e){
    if(e.code?.includes('wrong-password')||e.code?.includes('invalid-credential'))toast('Huidig wachtwoord klopt niet','err');
    else toast('Er ging iets mis','err');
  }
}

// op iemand ANDERS' apparaat (ook als de app dicht is) is echte server-push nodig — zie
// registerPushToken() en de Cloud Function 'onNotificationCreated' in functions/index.js.
// ═══════════════════════════════════════════════════════════════
async function showBrowserNotif(title, body, tag){
  if(!('Notification' in window)) return;
  if(Notification.permission==='default'){
    await Notification.requestPermission();
    if(Notification.permission==='granted' && U) window._f.registerPushToken(U.uid);
  }
  if(Notification.permission!=='granted') return;
  if(window._swReg){
    window._swReg.showNotification(title,{body,icon:'/MHVwork/icon.svg',tag:tag||'mhvwork',badge:'/MHVwork/icon.svg',vibrate:[200,100,200]});
  } else {
    new Notification(title,{body,icon:'/MHVwork/icon.svg'});
  }
}
