async function saveAvail(){
  const vs=$('aDateStart').value, ve=$('aDateEnd').value||vs, note=$('aNote').value;
  if(!vs){toast('Kies een datum','err');return;}
  const[ys,ms,ds]=vs.split('-').map(Number);
  const[ye,me,de]=ve.split('-').map(Number);
  const start=new Date(ys,ms-1,ds), end=new Date(ye,me-1,de);
  if(end<start){toast('Einddatum ligt vóór begindatum','err');return;}
  const dayCount=Math.round((end-start)/86400000)+1;
  if(dayCount>90){toast('Maximaal 90 dagen in één keer','err');return;}
  const{db,collection,addDoc,Timestamp,serverTimestamp}=window._f;
  const promises=[];
  for(let i=0;i<dayCount;i++){
    const d=new Date(start); d.setDate(d.getDate()+i);
    promises.push(addDoc(collection(db,'availability'),{uid:U.uid,date:Timestamp.fromDate(d),note,createdAt:serverTimestamp()}));
  }
  await Promise.all(promises);
  closeModal();
  toast(dayCount>1?`${dayCount} dagen opgeslagen!`:'Opgeslagen!','ok');
}

  const ok=await confirm2('Verwijderen','Blokkade verwijderen?','Verwijderen');

  const{db,doc,deleteDoc}=window._f;
  await deleteDoc(doc(db,'availability',id));
  toast('Verwijderd','ok');
}

async function saveAvailNote(id){

async function resetPwAdmin(uid,name,email){

  if(!ok)return;
  // Gebruikt de ingebouwde, beveiligde Firebase Auth reset-flow i.p.v. een zelfgemaakt token-systeem

  const{auth,sendPasswordResetEmail}=window._f;

    toast(msg,'err');
  }

function buildWorkerList(dayKey, preChecked){
  preChecked=preChecked||[];

    // Al toegewezen medewerkers blijven aanklikbaar/uitvinkbaar, ook als ze inmiddels niet

    const isBlocked=bl.includes(u.uid) && !isPreChecked;
    return `<label class="worker-check ${isBlocked?'blocked':''}">

async function saveShift(){

function endTimeFieldHtml(inputId,chkId,currentEnd){

window.toggleSluitField=(inputId,chk)=>{

function noteFieldHtml(note,noteImage){
  return `<div class="form-section" style="margin-top:14px"><label class="form-label">📝 Notitie voor medewerker(s) (optioneel)</label>
      <textarea class="form-input" id="esNote" rows="2" style="resize:none" placeholder="Bijv. Extra krukken klaarzetten, of speciale instructies...">${note||''}</textarea>

    </div>`;
}
function bindNoteImgInput(){
  const imgInput=document.getElementById('esNoteImg');
  if(imgInput) imgInput.onchange=function(){
    const file=this.files[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        const max=900; let w=img.width,h=img.height;
        if(w>max){h=Math.round(h*max/w);w=max;}
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        window._shiftNoteImg=canvas.toDataURL('image/jpeg',0.75);
        const prev=document.getElementById('esNoteImgPreview');
        if(prev) prev.innerHTML='<img src="'+window._shiftNoteImg+'" style="max-width:100%;border-radius:10px;max-height:120px">';
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  };
}

  const workers=[...document.querySelectorAll('#editWorkerList input:checked')].map(i=>i.value);

function renderUitbetaling(c){
  const now=new Date();
  const months=[];
  for(let i=0;i<6;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({y:d.getFullYear(),m:d.getMonth(),label:`${MO[d.getMonth()]} ${d.getFullYear()}`});}
  const{y,m}=months[payMonth];
  const monthShifts=allShifts.filter(s=>{const d=toDate(s.date);return d.getFullYear()===y&&d.getMonth()===m;});
  const emp=employees();
  const payData=emp.map(u=>{
    const myS=monthShifts.filter(s=>s.workers?.includes(u.uid));
    const approved=myS.filter(s=>getShiftStatus(s,u.uid)==='approved');
    const paid=myS.filter(s=>getShiftStatus(s,u.uid)==='paid');
    const approvedPay=approved.reduce((sum,s)=>sum+getApprovedPay(s,u.uid),0);
    const paidPay=paid.reduce((sum,s)=>sum+getApprovedPay(s,u.uid),0);
    const isPaid=myS.length>0&&myS.every(s=>getShiftStatus(s,u.uid)==='paid'||!s.workers?.includes(u.uid));
    return{...u,myS,approved,paid,approvedPay,paidPay,isPaid};
  }).filter(u=>u.myS.length>0);
  const totalSchuld=payData.reduce((s,u)=>s+u.approvedPay,0);
  const totalPaid=payData.reduce((s,u)=>s+u.paidPay,0);

  c.innerHTML=`
    <div class="form-section" style="margin-bottom:14px">
      <label class="form-label">Maand</label>
      <select class="form-input" onchange="payMonth=parseInt(this.value);renderAdminTab()">

async function markPaid(uid,year,month,name,amount){
  const ok=await confirm2('Uitbetaling registreren',`${name} markeren als uitbetaald voor ${fmtMoney(amount)}?`,'Bevestigen','btn-green');
  if(!ok)return;
  const y=parseInt(year),m=parseInt(month);
  const toMark=allShifts.filter(s=>{const d=toDate(s.date);return d.getFullYear()===y&&d.getMonth()===m&&s.workers?.includes(uid)&&getShiftStatus(s,uid)==='approved';});
  const{db,doc,updateDoc,collection,addDoc,serverTimestamp}=window._f;
  for(const s of toMark) await updateDoc(doc(db,'shifts',s.id),{[`paidFor.${uid}`]:true,[`workerConfirmations.${uid}`]:'approved'});
  await addDoc(collection(db,'payments'),{uid,year:y,month:m,amount:parseFloat(amount),paidBy:U.uid,paidAt:serverTimestamp()});
  await sendNotif(uid,'Uitbetaling ontvangen',`Je hebt ${fmtMoney(amount)} ontvangen voor ${MO[m]} ${y}.`);
  const u=allUsers.find(x=>x.uid===uid);
  if(u?.email){
    try{await emailjs.send(window._f.EMAILJS_SERVICE_ID,window._f.EMAILJS_TPL_PAYMENT,{to_email:u.email,to_name:u.name,amount:fmtMoney(amount),month:`${MO[m]} ${y}`,title:'Uitbetaling ontvangen',body:`Je hebt ${fmtMoney(amount)} ontvangen voor ${MO[m]} ${y}.`});}
    catch(e){console.warn('Email fout:',e);}
  }
  toast('Uitbetaling geregistreerd!','ok');
}
function showPayDetail(uid,y,m){
  const u=allUsers.find(x=>x.uid===uid); if(!u)return;
  const shifts=allShifts.filter(s=>{const d=toDate(s.date);return d.getFullYear()===parseInt(y)&&d.getMonth()===parseInt(m)&&s.workers?.includes(uid);});
  modal(`
    <div class="modal-handle"></div>
    <div class="modal-title">${u.name}</div>
    <div style="font-size:13px;color:var(--text3);margin-bottom:16px">${MO[parseInt(m)]} ${y} · ${fmtMoney(u.wage||0)}/uur</div>
    ${shifts.map(s=>{
      const st=getShiftStatus(s,uid);
      const{start,end}=getEffectiveTimes(s,uid);
      const pay=st==='approved'||st==='paid'?calcPay(start,end,u.wage||0):null;
      return `<div style="display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--separator)">
        <div style="flex:1">
          <div style="font-size:14px;font-weight:600">${fmtDate(s.date)}</div>
          <div style="font-size:12px;color:var(--text3)">${start} – ${dispTime(end)}</div>
        </div>
        <span class="badge ${st==='paid'?'badge-green':st==='approved'?'badge-green':st==='reviewing'?'badge-orange':st==='unconfirmed_locked'?'badge-red':'badge-gray'}">${st==='paid'?'Uitbetaald':st==='approved'?'Goedgekeurd':st==='reviewing'?'In beoord.':st==='unconfirmed_locked'?'Geweest, onbevestigd':'Wacht'}</span>
        <div style="font-weight:700;color:${pay?'var(--green)':'var(--text3)'};">${pay?fmtMoney(pay):'—'}</div>
      </div>`;
    }).join('')}
  `);
}

async function sendMsg(){
  const recipients=[...document.querySelectorAll('.msg-r:checked')].map(i=>i.value);
  const title=$('msgTitle').value.trim(), body=$('msgBody').value.trim();
  if(!recipients.length){toast('Kies ontvangers','err');return;}
  if(!title||!body){toast('Vul titel en bericht in','err');return;}
  await sendNotifMulti(recipients,title,body);
  for(const uid of recipients){
    const u=allUsers.find(x=>x.uid===uid);
    if(u?.email){
      try{await emailjs.send(window._f.EMAILJS_SERVICE_ID,window._f.EMAILJS_TPL_NOTIF,{to_email:u.email,to_name:u.name,title,body});}
      catch(e){console.warn(e);}
    }
  }
  $('msgTitle').value=''; $('msgBody').value='';
  document.querySelectorAll('.msg-r').forEach(r=>r.checked=false);

}

function dmThreadId(a,b){ return [a,b].sort().join('_'); }
function subDMs(){
  const{db,collection,onSnapshot,query,where}=window._f;
  const q=query(collection(db,'dms'),where('participants','array-contains',U.uid));
  unsubDMs=onSnapshot(q,s=>{
    allDMs=s.docs.map(d=>({id:d.id,...d.data()}))
      .sort((a,b)=>{const ta=a.updatedAt?.toDate?.()?.getTime()||0;const tb=b.updatedAt?.toDate?.()?.getTime()||0;return tb-ta;});
    const av=document.getElementById('view-meldingen');
    if(av&&av.classList.contains('active')) renderMeldingen();
    if(activeDMThread){
      const t=allDMs.find(x=>x.id===activeDMThread);
      if(t) _renderDMMessages(t);
    }
    updateNotifDot();
  });
}
function updateNotifDot(){
  const unreadNotif=allNotifs.filter(n=>!n.readBy?.includes(U.uid)).length;
  const unreadDM=allDMs.filter(t=>!(t.readBy||[]).includes(U.uid) && t.lastFrom!==U.uid).length;
  const dot=document.getElementById('notifDot');
  if(dot) dot.style.display=(unreadNotif+unreadDM)?'block':'none';

  if(U.role==='employee') return allUsers.filter(u=>u.role==='admin'||u.role==='software');

async function openDMThread(otherUid,otherName){
  const id=dmThreadId(U.uid,otherUid);
  activeDMThread=id;
  _activeDMOtherUid=otherUid;
  _activeDMOtherName=otherName;
  nav('dmthread');
  try{
    const{db,doc,getDoc,setDoc,serverTimestamp}=window._f;
    let t=allDMs.find(x=>x.id===id);
    if(!t){
      const snap=await getDoc(doc(db,'dms',id));
      if(snap.exists()) t={id,...snap.data()};
    }
    if(!t){
      const names={}; names[U.uid]=U.name; names[otherUid]=otherName;
      await setDoc(doc(db,'dms',id),{
        participants:[U.uid,otherUid], participantNames:names,
        messages:[], lastText:'', lastFrom:'', readBy:[U.uid], updatedAt:serverTimestamp()
      });
      t={id,participants:[U.uid,otherUid],participantNames:names,messages:[],readBy:[U.uid]};
    }
    _renderDMMessages(t);
    markDMRead(id);

async function approveLogRequest(threadId,msgIndex){
  const selectedUids=[...document.querySelectorAll('.logreview-uid:checked')].map(i=>i.value);
  const logs=await loadLoginLogs();
  const filtered=logs.filter(l=>selectedUids.includes(l.uid)).map(l=>({
    uid:l.uid, name:userName(l.uid), type:l.type, device:l.device||'',
    ip:l.ip||'', t:l.createdAt?.toDate?l.createdAt.toDate().toISOString():null
  }));
  const{db,doc,getDoc,updateDoc,serverTimestamp}=window._f;
  const snap=await getDoc(doc(db,'dms',threadId));
  const data=snap.data();
  const messages=[...(data.messages||[])];
  messages[msgIndex]={...messages[msgIndex],status:'approved',logData:filtered};
  await updateDoc(doc(db,'dms',threadId),{messages,updatedAt:serverTimestamp()});
  const otherUid=data.participants.find(p=>p!==U.uid);
  await notifyUsers([otherUid],'✅ Logboek goedgekeurd',U.name+' heeft je logboekverzoek goedgekeurd — download het in het gesprek.',U.name+' heeft je logboekverzoek goedgekeurd. Open Meldingen om het te downloaden.',{type:'message'});
  closeModal(); toast('Goedgekeurd en verstuurd!','ok');
}
async function rejectLogRequest(threadId,msgIndex){
  const{db,doc,getDoc,updateDoc,serverTimestamp}=window._f;
  const snap=await getDoc(doc(db,'dms',threadId));
  const data=snap.data();
  const messages=[...(data.messages||[])];
  messages[msgIndex]={...messages[msgIndex],status:'rejected'};
  await updateDoc(doc(db,'dms',threadId),{messages,updatedAt:serverTimestamp()});
  closeModal(); toast('Verzoek afgewezen','ok');
}
function downloadApprovedLog(threadId,msgIndex){
  const t=allDMs.find(x=>x.id===threadId);
  const msg=t&&t.messages&&t.messages[msgIndex];
  if(!msg||!msg.logData){toast('Geen data gevonden','err');return;}
  const aoa=[['Gebruiker','Type','Datum','Tijd','Apparaat','IP-adres']];
  msg.logData.forEach(l=>{
    const d=l.t?new Date(l.t):null;
    aoa.push([l.name,l.type==='login'?'Ingelogd':'Uitgelogd',d?d.toLocaleDateString('nl-NL'):'',d?d.toLocaleTimeString('nl-NL'):'',l.device,l.ip||'onbekend']);
  });
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:18},{wch:10},{wch:12},{wch:10},{wch:22},{wch:16}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Logboek');
  XLSX.writeFile(wb,`MHVwork-logboek-gedeeld_${new Date().toISOString().split('T')[0]}.xlsx`);
}
async function sendDM(otherUid,otherName){
  const inp=document.getElementById('dmInput'); if(!inp)return;
  const text=inp.value.trim(); if(!text)return;
  inp.value='';
  const id=dmThreadId(U.uid,otherUid);
  try{
    const{db,doc,updateDoc,serverTimestamp}=window._f;
    await updateDoc(doc(db,'dms',id),{
      messages:[...(((allDMs.find(x=>x.id===id))||{}).messages||[]),{from:U.uid,text,ts:Date.now()}],
      lastText:text, lastFrom:U.uid, readBy:[U.uid], updatedAt:serverTimestamp()
    });

    inp.value=text; // teruggeven zodat het niet kwijt is
    toast('Versturen mislukt: '+(e.message||'onbekende fout'),'err');

// Profielfoto — opgeslagen als gecomprimeerde base64-afbeelding IN het Firestore-document zelf,
// net als bij chat-/aankondigingsfoto's. Zo is er geen Firebase Storage (en dus geen Blaze-plan)
// voor nodig; Firestore-documenten mogen tot 1MB zijn, en na compressie past een profielfoto ruim.
function handleProfilePhoto(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=async()=>{
      const canvas=document.createElement('canvas');
      const size=300; // vierkant uitsnijden, klein genoeg voor snelle laadtijden
      const minSide=Math.min(img.width,img.height);
      canvas.width=size; canvas.height=size;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,(img.width-minSide)/2,(img.height-minSide)/2,minSide,minSide,0,0,size,size);
      const dataUrl=canvas.toDataURL('image/jpeg',0.8);
      try{
        const{db,doc,updateDoc,setDoc}=window._f;
        await updateDoc(doc(db,'users',U.uid),{photoData:dataUrl});
        await setDoc(doc(db,'publicProfiles',U.uid),{photoData:dataUrl},{merge:true}).catch(()=>{});
        U.photoData=dataUrl;
        renderProfile();
        toast('Profielfoto bijgewerkt!','ok');
      }catch(err){ toast('Opslaan mislukt — probeer een kleinere foto','err'); }
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function simpleDeviceLabel(){
  const ua=navigator.userAgent||'';
  let os='Onbekend apparaat';
  if(/iphone/i.test(ua))os='iPhone';
  else if(/ipad/i.test(ua))os='iPad';
  else if(/android/i.test(ua))os='Android';
  else if(/macintosh/i.test(ua))os='Mac';
  else if(/windows/i.test(ua))os='Windows';
  else if(/linux/i.test(ua))os='Linux';
  let browser='';
  if(/edg\//i.test(ua))browser='Edge';
  else if(/chrome\//i.test(ua)&&!/edg\//i.test(ua))browser='Chrome';
  else if(/safari\//i.test(ua)&&!/chrome\//i.test(ua))browser='Safari';
  else if(/firefox\//i.test(ua))browser='Firefox';
  return browser?`${os} · ${browser}`:os;
}
async function logLoginEvent(){
  try{
    const{db,doc,updateDoc,collection,addDoc,serverTimestamp,arrayUnion}=window._f;
    const device=simpleDeviceLabel();
    const logRef=await addDoc(collection(db,'loginLogs'),{
      uid:U.uid, type:'login', device, userAgent:navigator.userAgent, ip:null, createdAt:serverTimestamp()
    });
    const userRef=doc(db,'users',U.uid);
    const updates={ lastLoginAt:serverTimestamp(), lastDevice:device, knownDevices:arrayUnion(device) };
    if(!U.firstLoginAt) updates.firstLoginAt=serverTimestamp();
    await updateDoc(userRef,updates);
    // IP ophalen op de achtergrond — als dit faalt of traag is, merkt de gebruiker er niks van
    fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(d=>{
      if(d&&d.ip) updateDoc(logRef,{ip:d.ip}).catch(()=>{});
    }).catch(()=>{});
  }catch(e){ console.warn('logLoginEvent:',e); }
}
async function logLogoutEvent(){
  try{
    const{db,collection,addDoc,serverTimestamp}=window._f;
    await addDoc(collection(db,'loginLogs'),{
      uid:U.uid, type:'logout', device:simpleDeviceLabel(), userAgent:navigator.userAgent, ip:null, createdAt:serverTimestamp()
    });
  }catch(e){}
}

async function changePw(){
  const cur=$('pwC').value, nw=$('pwN').value, nw2=$('pwN2').value;
  if(!cur||!nw||!nw2){toast('Vul alle velden in','err');return;}
  if(nw!==nw2){toast('Wachtwoorden komen niet overeen','err');return;}
  if(nw.length<6){toast('Minimaal 6 tekens','err');return;}
  try{
    const{auth,reauthenticateWithCredential,EmailAuthProvider,updatePassword}=window._f;
    const cred=EmailAuthProvider.credential(auth.currentUser.email,cur);
    await reauthenticateWithCredential(auth.currentUser,cred);
    await updatePassword(auth.currentUser,nw);
    toast('Wachtwoord gewijzigd!','ok');
    $('pwC').value=''; $('pwN').value=''; $('pwN2').value='';
  }catch(e){
    if(e.code?.includes('wrong-password')||e.code?.includes('invalid-credential'))toast('Huidig wachtwoord klopt niet','err');
    else toast('Er ging iets mis','err');
  }
}
async function doLogout(){
  const ok=await confirm2('Uitloggen','Weet je zeker dat je wilt uitloggen?','Uitloggen');
  if(!ok)return;
  try{ await logLogoutEvent(); }catch(e){}
  await window._f.signOut(window._f.auth);
  window.location.href='index.html';
}

// PUSH NOTIFICATIES
// showBrowserNotif = lokale melding, alleen zichtbaar op DIT scherm zolang de app open staat
// (handig als directe feedback voor wie de app nu open heeft). Voor een melding die ook aankomt
// op iemand ANDERS' apparaat (ook als de app dicht is) is echte server-push nodig — zie
// registerPushToken() en de Cloud Function 'onNotificationCreated' in functions/index.js.
// ═══════════════════════════════════════════════════════════════
async function showBrowserNotif(title, body, tag){
  if(!('Notification' in window)) return;
  if(Notification.permission==='default'){
    await Notification.requestPermission();
    if(Notification.permission==='granted' && U) window._f.registerPushToken(U.uid);
  }
  if(Notification.permission!=='granted') return;
  if(window._swReg){
    window._swReg.showNotification(title,{body,icon:'/MHVwork/icon.svg',tag:tag||'mhvwork',badge:'/MHVwork/icon.svg',vibrate:[200,100,200]});
  } else {
    new Notification(title,{body,icon:'/MHVwork/icon.svg'});
  }
}
async function notifyUsers(uids, title, body, emailBody, opts){
  opts=opts||{};
  const notifType=opts.type||'general'; // 'general' | 'tag' | 'announce' | 'swap' | 'payment' | 'message'
  const sendEmail=opts.email!==false; // zet opts.email=false om NOOIT een mail te sturen (bv. bij @tag)
  // Urgent = wordt ALTIJD gemaild, ook als iemand niet-urgente mails heeft uitgezet: wachtwoord-
  // gerelateerd en een persoonlijk bericht van beheerder/dev.
  const isUrgent = notifType==='message';
  const tplMap={
    tag: window._f.EMAILJS_TPL_TAG, announce: window._f.EMAILJS_TPL_ANNOUNCE,
    swap: window._f.EMAILJS_TPL_SWAP, general: window._f.EMAILJS_TPL_NOTIF,
    payment: window._f.EMAILJS_TPL_PAYMENT, message: window._f.EMAILJS_TPL_PW
  };
  // In-app notificatie via Firestore
  const{db,collection,addDoc,serverTimestamp}=window._f;
  if(uids&&uids.length){
    await addDoc(collection(db,'notifications'),{
      to:uids, from:U.uid, title, body:emailBody||body, notifType,
      readBy:[], createdAt:serverTimestamp()
    });
  }
  // Push voor iedereen die de app open heeft
  showBrowserNotif(title, body, notifType);
  // Email via EmailJS (uitgezet voor @tag-meldingen — die worden ALLEEN als pushmelding verstuurd)
  if(sendEmail && uids&&uids.length){
    const tplId=tplMap[notifType]||window._f.EMAILJS_TPL_NOTIF;
    for(const uid of uids){
      const u=allUsers.find(x=>x.uid===uid);
      if(!u||!u.email||uid===U.uid) continue;
      // Niet-urgente mails respecteren de opt-out die de medewerker zelf bij Profiel instelt
      if(!isUrgent && u.emailOptOut) continue;
      try{
        await emailjs.send(window._f.EMAILJS_SERVICE_ID,tplId,{
          to_email:u.email, to_name:u.name, title, body:emailBody||body
        });
      }catch(e){}
    }
  }
}

function subChat(){
  const{db,collection,onSnapshot,query,limit}=window._f;
  // Geen orderBy = geen composite index vereist, sorteer client-side
  const q=query(collection(db,'chat'),limit(200));
  unsubChat=onSnapshot(q,snap=>{
    allChat=snap.docs.map(d=>({id:d.id,...d.data()})).filter(m=>!m.deleted)
      .sort((a,b)=>{
        const ta=a.createdAt?.toDate?.()?.getTime()||0;
        const tb=b.createdAt?.toDate?.()?.getTime()||0;
        return ta-tb;
      });
    // Render altijd als chatMsgs bestaat
    const msgs=document.getElementById('chatMsgs');
    if(msgs){ _renderChatMsgs(); msgs.scrollTop=msgs.scrollHeight; }
    // Badge op chat tab
    const last=allChat[allChat.length-1];
    const dot=document.getElementById('chat-dot');
    if(dot&&last&&last.uid!==U.uid){
      const active2=document.querySelector('#view-chat.active');
      if(!active2) dot.style.display='block';
    }
  }, function(err){
    console.error('Chat Firestore error:', err.code, err.message);
    toast('Chat fout: '+err.message,'err');
  });
}

function _setupChatDragDrop(){
  const zone=document.getElementById('chatDropZone'); if(!zone)return;
  ['dragenter','dragover'].forEach(ev=>zone.addEventListener(ev,e=>{e.preventDefault();zone.style.background='rgba(245,200,0,.08)';}));
  ['dragleave','drop'].forEach(ev=>zone.addEventListener(ev,e=>{e.preventDefault();zone.style.background='';}));
  zone.addEventListener('drop',e=>{
    const file=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
    if(file&&file.type.startsWith('image/')) handleChatImageFile(file);
  });
}

function handleChatImageFile(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      const max=1000; let w=img.width,h=img.height;
      if(w>max){h=Math.round(h*max/w);w=max;}
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      window._chatImgData=canvas.toDataURL('image/jpeg',0.72);
      const prev=document.getElementById('chatImgPreview');
      const wrap=document.getElementById('chatImgPreviewWrap');
      if(prev&&wrap){prev.src=window._chatImgData;wrap.style.display='block';}
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function clearChatImage(){
  window._chatImgData=null;
  const wrap=document.getElementById('chatImgPreviewWrap');
  const inp=document.getElementById('chatImgInput');

function isUserVerified(uid){
  const u=allUsers.find(x=>x.uid===uid);
  return !!(u && (u.role==='software' || u.verified));
}
function _userPhoto(uid){
  const u=allUsers.find(x=>x.uid===uid);
  return u&&u.photoData?u.photoData:null;
}
function _renderChatMsgs(){
  const c=document.getElementById('chatMsgs'); if(!c)return;
  if(!allChat.length){
    c.innerHTML='<div style="text-align:center;padding:40px 20px;color:var(--text3)"><div style="font-size:36px;margin-bottom:10px">💬</div><p>Nog geen berichten</p></div>';
    return;
  }
  const canPin=(U.role==='admin'||U.role==='software');
  const rest=allChat; // pinned berichten staan nu in de vaste #pinnedBar, niet meer dubbel hierin

  function renderMsg(msg,idx){
    const t=msg.createdAt&&msg.createdAt.toDate?msg.createdAt.toDate():new Date();
    const mine=msg.uid===U.uid;
    const verified=isUserVerified(msg.uid);
    const av=msg.role==='software'?('<img src="'+LOGO+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">')
      :(_userPhoto(msg.uid)?('<img src="'+_userPhoto(msg.uid)+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">'):getInitials(msg.name||'?'));
    const ts=t.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
    const roleTag=msg.role==='admin'?'<span class="chat-role-tag tag-admin">Beheerder</span>'
      :msg.role==='software'?'<span class="chat-role-tag tag-sw">Dev</span>':'';
    const canDel=(U.role==='admin'||U.role==='software'||mine);
    const delBtn=canDel?'<button class="chat-del-btn" onclick="delChatMsg(&quot;'+msg.id+'&quot;)" title="Verwijder" style="right:'+(canPin?'30px':'8px')+'">✕</button>':'';
    const pinBtn=canPin?'<button class="chat-del-btn" onclick="pinChatMsg(&quot;'+msg.id+'&quot;,'+(!!msg.pinned)+')" title="'+(msg.pinned?'Losmaken':'Vastpinnen')+'" style="right:8px;background:'+(msg.pinned?'var(--mhv-yellow)':'rgba(255,255,255,.12)')+';color:'+(msg.pinned?'#000':'#fff')+'">📌</button>':'';
    const txt=msg.text?_formatMentions(msg.text):'';
    const imgHtml=msg.imageData?'<img src="'+msg.imageData+'" style="max-width:100%;border-radius:10px;margin-top:'+(txt?'6px':'0')+';display:block;cursor:pointer" onclick="openImageLightbox(this.src)">':'';
    const swapHtml=msg.type==='swap'?_renderSwapCard(msg):'';
    const payHtml=msg.type==='payment'?'<div style="font-size:13px;color:var(--green);font-weight:700;margin-top:4px">💶 '+msg.amount+'</div>':'';
    const avClass='chat-av'+(msg.role==='admin'?' admin':msg.role==='software'?' software':'');
    return '<div class="chat-row'+(mine?' me':'')+' anim-up" style="animation-delay:'+(idx*.02)+'s">'
      +(mine?'':'<div class="'+avClass+'">'+av+'</div>')
      +'<div class="chat-col">'
      +(mine?'<div class="chat-meta">'+ts+'</div>':'<div class="chat-meta">'+msg.name+(verified?VERIFIED_BADGE:'')+roleTag+' · '+ts+'</div>')
      +'<div class="chat-bubble'+(mine?'':msg.role==='admin'?' admin-msg':msg.role==='software'?' software-msg':'')+'" style="position:relative;padding-right:'+((canDel?28:0)+(canPin?28:0)+14)+'px">'
      +delBtn+pinBtn+txt+imgHtml+payHtml+swapHtml
      +'</div>'
      +'</div>'
      +(mine?'<div class="'+avClass+'">'+av+'</div>':'')
      +'</div>';
  }

  let html='';
  let lastDate='';
  rest.forEach(function(msg,idx){
    const t=msg.createdAt&&msg.createdAt.toDate?msg.createdAt.toDate():new Date();
    const ds=t.toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'});
    if(ds!==lastDate){ html+='<div class="chat-date-sep anim-in">'+ds+'</div>'; lastDate=ds; }
    html+=renderMsg(msg,idx);
  });
  c.innerHTML=html;
  c.scrollTop=c.scrollHeight;
  _renderPinnedBar();
}

function _formatMentions(text){
  return text.replace(/@(\S+)/g,'<span class="chat-mention">@$1</span>');
}

function chatInputHandler(el){
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,100)+'px';
  // @mention detectie
  const val=el.value, pos=el.selectionStart;
  const before=val.slice(0,pos);
  const match=before.match(/@(\w*)$/);
  if(match){ showMentionList(match[1]); }
  else { hideMentionList(); }
}

function showMentionList(q){
  const list=document.getElementById('mentionList'); if(!list)return;
  const opts=[{uid:'all',name:'Iedereen'},{uid:'dev',name:'Dev'},{uid:'admin',name:'Beheerder'},...allUsers.filter(u=>u.uid!==U.uid)];
  const fil=q?opts.filter(o=>o.name.toLowerCase().includes(q.toLowerCase())):opts;
  if(!fil.length){hideMentionList();return;}
  list.innerHTML=fil.slice(0,6).map(function(o){
    return '<div class="mention-opt" onclick="insertMention(\''+o.name+'\')">'
      +'<div class="chat-av" style="width:22px;height:22px;font-size:9px">'+(o.uid==='all'?'👥':o.uid==='dev'?'🛠':o.uid==='admin'?'👑':getInitials(o.name))+'</div>'
      +'<span>'+o.name+'</span>'
      +'</div>';
  }).join('');
  list.classList.add('open');
}
function hideMentionList(){ const l=document.getElementById('mentionList'); if(l)l.classList.remove('open'); }
function insertMention(name){
  const ta=document.getElementById('chatTa'); if(!ta)return;
  const pos=ta.selectionStart;
  const before=ta.value.slice(0,pos).replace(/@\w*$/,'');
  ta.value=before+'@'+name+' '+ta.value.slice(pos);
  ta.focus(); hideMentionList();
}
function insertAtSign(){
  const ta=document.getElementById('chatTa'); if(!ta)return;
  const pos=ta.selectionStart;
  ta.value=ta.value.slice(0,pos)+'@'+ta.value.slice(pos);
  ta.focus();
  ta.setSelectionRange(pos+1,pos+1);
  // Toon mention lijst meteen
  showMentionList('');
}


async function sendChat(){
  const ta=document.getElementById('chatTa');
  const text=ta?ta.value.trim():'';
  const imgData=window._chatImgData||null;
  if(!text&&!imgData)return;
  ta.value=''; ta.style.height='auto'; hideMentionList();
  const{db,collection,addDoc,serverTimestamp}=window._f;
  // Detecteer mentions
  const rawMentions=[...text.matchAll(/@(\S+)/g)].map(m=>m[1].toLowerCase());
  const mentionUids=[];
  rawMentions.forEach(function(m){
    if(m==='iedereen'||m==='all') mentionUids.push('all');
    else if(m==='dev') mentionUids.push('dev');
    else if(m==='beheerder'||m==='admin') mentionUids.push('admin');
    else {
      const u=allUsers.find(x=>x.name.toLowerCase()===m||x.name.toLowerCase().startsWith(m));
      if(u&&!mentionUids.includes(u.uid)) mentionUids.push(u.uid);
    }
  });
  await addDoc(collection(db,'chat'),{
    uid:U.uid, name:U.name, role:U.role||'employee',
    text, imageData:imgData, mentions:mentionUids, type:'message',
    deleted:false, createdAt:serverTimestamp()
  });
  clearChatImage();
  // Notificaties versturen
  let notifTargets=[];
  if(mentionUids.includes('all')){
    // Als een BEHEERDER @iedereen tagt, telt dat niet als de dev — een dev moet zelf getagd worden.
    // Als de DEV @iedereen tagt, dan wél echt iedereen (inclusief andere dev-accounts).
    notifTargets=allUsers.filter(u=>{
      if(u.uid===U.uid)return false;
      if(U.role!=='software' && u.role==='software')return false;
      return true;
    }).map(u=>u.uid);
  }
  else {
    mentionUids.forEach(function(m){
      if(m==='dev') allUsers.filter(u=>u.role==='software').forEach(u=>{ if(!notifTargets.includes(u.uid))notifTargets.push(u.uid); });
      else if(m==='admin') allUsers.filter(u=>u.role==='admin').forEach(u=>{ if(!notifTargets.includes(u.uid))notifTargets.push(u.uid); });
      else if(!notifTargets.includes(m)) notifTargets.push(m);
    });
  }
  // Alleen daadwerkelijk getagde mensen krijgen een pushmelding — niet meer automatisch de beheerder
  // bij elk willekeurig bericht.
  // @tag in de chat -> ALLEEN een pushmelding, nooit een e-mail
  if(notifTargets.length) await notifyUsers(notifTargets,'💬 '+U.name+' in de chat',text||'📷 Foto',text||'📷 Foto',{type:'tag',email:false});
}

function _renderSwapCard(msg){
  if(!msg.swapReqId) return '';
  const status=msg.swapStatus||'pending';
  if(status==='accepted') return '<div class="swap-card"><h4>✅ Dienst overgenomen</h4><p>'+( msg.acceptedByName||'Iemand')+' heeft deze dienst overgenomen.</p></div>';
  if(status==='rejected') return '<div class="swap-card"><h4>❌ Afgewezen</h4><p>De beheerder heeft dit verzoek afgewezen.</p></div>';
  // Pending
  const hasInterest = !!msg.interestedName;
  const canAccept=U.uid!==msg.uid&&U.role==='employee'&&!hasInterest;
  const canApprove=U.role==='admin'&&hasInterest;
  return '<div class="swap-card"'+(hasInterest?' style="border-left:3px solid var(--mhv-yellow)"':'')+'><h4>🔄 Dienst overnemen?'+(hasInterest?' <span style="color:var(--mhv-yellow);font-size:13px">✓ interesse</span>':'')+'</h4>'
    +'<p>'+msg.swapDate+' · '+msg.swapTime+'</p>'
    +(hasInterest?'<p style="font-size:13px;color:var(--text2);margin-top:4px">👋 <b>'+msg.interestedName+'</b> heeft interesse getoond.</p>':'<p style="font-size:12px;color:var(--text3);margin-top:4px">Nog niemand heeft interesse getoond.</p>')
    +(canAccept?'<div class="swap-actions"><button class="btn btn-green btn-sm" onclick="acceptSwap(\''+msg.swapReqId+'\',\''+msg.id+'\')">Ik neem het over</button></div>':'')
    +(canApprove?'<div class="swap-actions"><button class="btn btn-green btn-sm" onclick="approveSwap(\''+msg.swapReqId+'\',\''+msg.id+'\')">✓ Goedkeuren</button><button class="btn btn-red btn-sm" onclick="rejectSwap(\''+msg.swapReqId+'\',\''+msg.id+'\')">✗ Afwijzen</button></div>':'')
    +'</div>';
}

async function submitSwap(){
  const sel=document.querySelector('input[name="swapShift"]:checked');
  if(!sel){toast('Selecteer een dienst','err');return;}
  const shiftId=sel.value;
  const note=document.getElementById('swapNote')&&document.getElementById('swapNote').value||'';
  const shift=allShifts.find(s=>s.id===shiftId); if(!shift)return;
  const{db,collection,addDoc,serverTimestamp}=window._f;
  // Maak swap request aan
  const reqRef=await addDoc(collection(db,'swapRequests'),{
    requesterId:U.uid, requesterName:U.name,
    shiftId, shiftDate:shift.date, shiftStart:shift.startTime, shiftEnd:shift.endTime,
    note, status:'pending', adminApproved:false, createdAt:serverTimestamp()
  });
  // Chat bericht plaatsen
  await addDoc(collection(db,'chat'),{
    uid:U.uid, name:U.name, role:U.role||'employee',
    text:U.name+' zoekt iemand om zijn/haar dienst over te nemen'+(note?' ('+note+')':''),
    mentions:['all'], type:'swap',
    swapReqId:reqRef.id, swapStatus:'pending',
    swapDate:fmtDate(shift.date), swapTime:shift.startTime+'-'+dispTime(shift.endTime),
    deleted:false, createdAt:serverTimestamp()
  });
  // Notificeer admins
  const admins=allUsers.filter(u=>u.role==='admin').map(u=>u.uid);
  await notifyUsers(admins,'🔄 Ruil aanvraag',''+U.name+' wil zijn/haar dienst op '+fmtDate(shift.date)+' ruilen.',''+U.name+' wil zijn/haar dienst op '+fmtDate(shift.date)+' ('+shift.startTime+'-'+dispTime(shift.endTime)+') ruilen.'+(note?'\n\nToelichting: '+note:''),{type:'swap'});
  closeModal();
  toast('Aanvraag geplaatst! De beheerder beoordeelt het.','ok');
  nav('chat',document.getElementById('tab-chat'));
}

async function acceptSwap(reqId,msgId){
  // Medewerker wil overnemen — admin moet nog goedkeuren
  const{db,doc,getDoc,updateDoc,collection,addDoc,serverTimestamp}=window._f;
  await updateDoc(doc(db,'swapRequests',reqId),{interestedUid:U.uid,interestedName:U.name});
  await updateDoc(doc(db,'chat',msgId),{interestedName:U.name});
  // Interesse ook als apart chatbericht zichtbaar maken
  await addDoc(collection(db,'chat'),{
    uid:U.uid, name:U.name, role:U.role||'employee',
    text:U.name+' heeft interesse getoond om de dienst over te nemen.', mentions:['all'], type:'message',
    deleted:false, createdAt:serverTimestamp()
  });
  const reqSnap=await getDoc(doc(db,'swapRequests',reqId));
  const req=reqSnap.data()||{};
  const admins=allUsers.filter(u=>u.role==='admin').map(u=>u.uid);
  await notifyUsers(admins,'🔄 Iemand wil overnemen',''+U.name+' wil de dienst overnemen. Ga naar de chat om goed te keuren.',''+U.name+' wil de dienst overnemen. Open de app om goed te keuren.',{type:'swap'});
  // Ook de oorspronkelijke aanvrager een bericht sturen — beide kanten weten dan dat er interesse is
  if(req.requesterId && req.requesterId!==U.uid){
    await notifyUsers([req.requesterId],'🔄 Interesse in jouw dienst',U.name+' wil jouw dienst overnemen. De beheerder moet dit nog goedkeuren.',U.name+' wil jouw dienst overnemen. De beheerder moet dit nog goedkeuren.',{type:'swap'});
  }
  toast('Interesse geregistreerd! De beheerder keurt het goed.','ok');
}

async function approveSwap(reqId,msgId){
  const{db,doc,getDoc,updateDoc,collection,addDoc,serverTimestamp}=window._f;
  const reqSnap=await getDoc(doc(db,'swapRequests',reqId));
  const req=reqSnap.data();
  if(!req.interestedUid){toast('Niemand heeft interesse getoond','err');return;}
  const ok=await confirm2('Goedkeuren','Dienst doorgeven aan '+req.interestedName+'?','Goedkeuren','btn-green');
  if(!ok)return;
  // Vervang werknemer in de shift
  const shiftSnap=await getDoc(doc(db,'shifts',req.shiftId));
  const shift=shiftSnap.data();
  const newWorkers=(shift.workers||[]).filter(u=>u!==req.requesterId).concat([req.interestedUid]);
  await updateDoc(doc(db,'shifts',req.shiftId),{workers:newWorkers});
  await updateDoc(doc(db,'swapRequests',reqId),{status:'accepted',adminApproved:true,acceptedBy:req.interestedUid});
  await updateDoc(doc(db,'chat',msgId),{swapStatus:'accepted',acceptedByName:req.interestedName});
  // Notificeer beide medewerkers
  await notifyUsers([req.requesterId],'✅ Dienst geruild','Je dienst op '+fmtDate(req.shiftDate)+' is overgenomen door '+req.interestedName+'.','Je dienst op '+fmtDate(req.shiftDate)+' is overgenomen door '+req.interestedName+'. De beheerder heeft het goedgekeurd.',{type:'swap'});
  await notifyUsers([req.interestedUid],'✅ Dienst overgenomen','Je hebt de dienst op '+fmtDate(req.shiftDate)+' overgenomen van '+req.requesterName+'.','Je hebt de dienst op '+fmtDate(req.shiftDate)+' overgenomen. Check je rooster!',{type:'swap'});
  showBrowserNotif('Dienst geruild','Beide medewerkers zijn genotificeerd');
  toast('Dienst goedgekeurd en doorgegeven!','ok');
}

async function rejectSwap(reqId,msgId){
  const ok=await confirm2('Afwijzen','Ruilverzoek afwijzen?','Afwijzen','btn-red');if(!ok)return;
  const{db,doc,updateDoc,getDoc}=window._f;
  const reqSnap=await getDoc(doc(db,'swapRequests',reqId));
  const req=reqSnap.data();
  await updateDoc(doc(db,'swapRequests',reqId),{status:'rejected'});
  await updateDoc(doc(db,'chat',msgId),{swapStatus:'rejected'});
  await notifyUsers([req.requesterId],'❌ Ruilverzoek afgewezen','Je ruilverzoek voor de dienst op '+fmtDate(req.shiftDate)+' is afgewezen door de beheerder.','Je ruilverzoek is afgewezen. Neem contact op met de beheerder voor meer informatie.',{type:'swap'});
  toast('Afgewezen','ok');
}

function exportShiftToCalendar(shiftId){
  const shift=allShifts.find(s=>s.id===shiftId);
  if(!shift){toast('Dienst niet gevonden','err');return;}
  const d=toDate(shift.date);
  const pad=n=>String(n).padStart(2,'0');
  const icsDate=(date,h,m)=>[date.getFullYear(),pad(date.getMonth()+1),pad(date.getDate()),'T',pad(h),pad(m),'00'].join('');
  const dtstamp=icsDate(new Date(),new Date().getHours(),new Date().getMinutes());
  const[sh,sm]=(shift.startTime||'00:00').split(':').map(Number);
  // Bij "Sluit" (onbekende eindtijd) weten we de echte eindtijd pas als de dienst voorbij is —
  // voor de agenda-afspraak gebruiken we dan een geschatte duur van 4 uur, en zetten "Sluit"
  // duidelijk in de omschrijving zodat het niet als een harde eindtijd wordt gelezen.
  const[eh,em]=isSluit(shift.endTime)?[(sh+4)%24,sm]:(shift.endTime||'00:00').split(':').map(Number);
  const startStr=icsDate(d,sh,sm), endStr=icsDate(d,eh,em);
  const desc='Dienst bij MHV — '+shift.startTime+' tot '+dispTime(shift.endTime)+(isSluit(shift.endTime)?' (eindtijd onbekend, duurt tot de zaak dicht is)':'');

  // Agenda-toevoegen via een enkele "trick" (blob-download, Share API, of data:-URI) bleek in de
  // praktijk onbetrouwbaar: Apple blokkeert het dynamisch openen van .ics-bestanden in sommige
  // situaties, en Android-browsers hebben bekende, wisselvallige bugs met .ics-bestandsafhandeling.
  // Daarom, net als grote partijen (Eventbrite, Meetup, etc.) doen: een keuze geven die altijd
  // ergens toe leidt, i.p.v. gokken op één methode.
  const gcalUrl='https://calendar.google.com/calendar/render?action=TEMPLATE'
    +'&text='+encodeURIComponent('Dienst MHV')
    +'&dates='+startStr+'/'+endStr
    +'&details='+encodeURIComponent(desc)
    +'&location='+encodeURIComponent('MHV');

  modal(`<div class="modal-handle"></div>
    <div style="text-align:center;padding:6px 0 4px">
      <div style="font-size:40px;margin-bottom:10px">📅</div>
      <div class="modal-title" style="text-align:center">Toevoegen aan agenda</div>
      <p style="font-size:13px;color:var(--text3);margin:8px 0 18px">Kies wat bij jouw agenda-app past.</p>
      <button class="btn btn-yellow btn-full" style="margin-bottom:10px" onclick="window.open('${gcalUrl}','_blank');closeModal()">Google Agenda</button>
      <button class="btn btn-ghost btn-full" onclick="downloadIcsFile('${shift.id}');closeModal()">Apple Agenda / Outlook (.ics-bestand)</button>
    </div>`);
}
function downloadIcsFile(shiftId){
  const shift=allShifts.find(s=>s.id===shiftId); if(!shift)return;
  const d=toDate(shift.date);
  const pad=n=>String(n).padStart(2,'0');
  const icsDate=(date,h,m)=>[date.getFullYear(),pad(date.getMonth()+1),pad(date.getDate()),'T',pad(h),pad(m),'00'].join('');
  const now=new Date();
  const[sh,sm]=(shift.startTime||'00:00').split(':').map(Number);
  const[eh,em]=isSluit(shift.endTime)?[(sh+4)%24,sm]:(shift.endTime||'00:00').split(':').map(Number);
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MHVwork//NL','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    'UID:'+(shift.id||Date.now())+'@mhvwork',
    'DTSTAMP:'+icsDate(now,now.getHours(),now.getMinutes()),
    'DTSTART:'+icsDate(d,sh,sm),'DTEND:'+icsDate(d,eh,em),
    'SUMMARY:Dienst MHV','DESCRIPTION:Dienst bij MHV — '+shift.startTime+' tot '+dispTime(shift.endTime)+(isSluit(shift.endTime)?' (eindtijd onbekend, duurt tot de zaak dicht is)':''),
    'LOCATION:MHV','END:VEVENT','END:VCALENDAR'].join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='dienst-mhv.ics'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast('Bestand gedownload — open het vanuit je downloads om toe te voegen','ok');
}

// IDLE-PAGINA (kiosk-weergave voor op een tablet)
// Toont het rooster van vandaag met een live voortgangsbalk per dienst. Bewust géén eigen
// Firestore-listener — leest gewoon uit het al bestaande, live gehouden `allShifts`
// (zie unsubShifts hierboven), dat is al up-to-date zonder extra netwerkverkeer.
// De uitgangscode wordt bewust NIET opgeslagen (niet in Firestore, niet in localStorage) —
// degene die idle-modus start bedenkt 'm ter plekke, en die geldt alleen voor deze sessie.
// ═══════════════════════════════════════════
function openIdleGate(){
  modal(`
    <div class="modal-title">📺 Idle-modus starten</div>
    <p style="font-size:13px;color:var(--text3);margin:-4px 0 16px;line-height:1.5">
      Dit toont het rooster van vandaag, groot en leesbaar — handig om op een tablet te laten
      hangen. Bedenk een code van 4 cijfers waarmee je 'm straks weer kunt afsluiten.
    </p>
    <div class="form-section"><label class="form-label">Uitgangscode (4 cijfers)</label>
      <input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" class="form-input" id="idleCodeIn" placeholder="••••" style="letter-spacing:6px;font-size:20px;text-align:center"></div>
    <button class="btn btn-yellow btn-full" style="margin-top:8px" onclick="startIdleMode()">Start idle-modus</button>
  `);
}
async function startIdleMode(){
  const code=($('idleCodeIn')?.value||'').trim();
  if(!/^\d{4}$/.test(code)){ toast('Vul precies 4 cijfers in','err'); return; }
  idleExitCode=code;
  closeModal();
  const ov=$('idle-overlay');
  ov.classList.add('open');
  // Best-effort fullscreen + landschap — mag ook zonder, sommige (geïnstalleerde) tablets/
  // browsers staan dit niet toe. De rest van de app blijft portrait-vergrendeld via
  // manifest.json; dit ontgrendelt alléén tijdens idle-modus, puur voor dit scherm.
  try{
    await document.documentElement.requestFullscreen?.().catch(()=>{});
    await screen.orientation?.lock?.('landscape').catch(()=>{});
  }catch(e){}
  renderIdlePage();
  if(idleTimer)clearInterval(idleTimer);
  idleTimer=setInterval(renderIdlePage,30000); // elke 30s de klok/balkjes verversen, puur client-side, geen serververkeer
}
function promptIdleExit(){
  modal(`
    <div class="modal-title">Idle-modus verlaten</div>
    <p style="font-size:13px;color:var(--text3);margin:-4px 0 16px">Voer de code in die is ingesteld bij het starten.</p>
    <div class="form-section"><label class="form-label">Code</label>
      <input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" class="form-input" id="idleExitIn" placeholder="••••" style="letter-spacing:6px;font-size:20px;text-align:center"></div>
    <button class="btn btn-yellow btn-full" style="margin-top:8px" onclick="checkIdleExit()">Verlaat idle-modus</button>
  `);
}
function checkIdleExit(){
  const code=($('idleExitIn')?.value||'').trim();
  if(code!==idleExitCode){ toast('Onjuiste code','err'); return; }
  closeModal();
  exitIdleMode();
}
function exitIdleMode(){
  if(idleTimer){ clearInterval(idleTimer); idleTimer=null; }
  idleExitCode=null;
  $('idle-overlay').classList.remove('open');
  try{ screen.orientation?.unlock?.(); }catch(e){}
  if(document.fullscreenElement)try{document.exitFullscreen?.();}catch(e){}
}
function renderIdlePage(){
  const now=new Date();
  $('idleClock').textContent=now.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
  $('idleDate').textContent=now.toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'});
  const today=nowKey();
  // Losse dienst-blokken blijven bewust losse blokken (ook als ze overlappen in tijd, bv. een
  // feestavond met bar + deur tegelijk) — nooit samenvoegen, dat was expliciet gevraagd.
  const todayShifts=allShifts.filter(s=>dKey(s.date)===today).sort((a,b)=>minsFrom(a.startTime)-minsFrom(b.startTime));
  const list=$('idleList');
  if(!todayShifts.length){
    list.innerHTML='<div class="idle-empty">Geen diensten vandaag 🎉</div>';
    return;
  }
  const nowMins=now.getHours()*60+now.getMinutes();
  list.innerHTML=todayShifts.map(s=>{
    const names=(s.workers||[]).map(uid=>allUsers.find(u=>u.uid===uid)?.name||'?');
    const startMins=minsFrom(s.startTime);
    const sluit=isSluit(s.endTime);
    const endMins=sluit?null:minsFrom(s.endTime);
    let barHtml, subHtml;
    if(sluit){
      const started=nowMins>=startMins;
      const elapsed=started?nowMins-startMins:0;
      barHtml=`<div class="idle-bar-track"><div class="idle-bar-fill openend" style="width:${started?'100':'0'}%"></div></div>`;
      subHtml=started?`bezig sinds ${s.startTime} (${Math.floor(elapsed/60)}u ${elapsed%60}m) — tot sluit`:`begint om ${s.startTime}`;
    }else{
      const pct=Math.max(0,Math.min(100,Math.round((nowMins-startMins)/(endMins-startMins)*100)));
      const done=nowMins>=endMins;
      const remain=Math.max(0,endMins-nowMins);
      barHtml=`<div class="idle-bar-track"><div class="idle-bar-fill${done?' done':''}" style="width:${pct}%"></div></div>`;
      subHtml=nowMins<startMins?`begint om ${s.startTime}`:done?'klaar':`nog ${Math.floor(remain/60)}u ${remain%60}m`;
    }
    return `<div class="idle-shift">
      <div class="idle-shift-time">${s.startTime} – ${dispTime(s.endTime)}</div>
      ${s.note?`<div class="idle-shift-note">📝 ${s.note}</div>`:''}
      ${names.length?names.map(n=>`<div class="idle-worker">
        <div class="idle-worker-name"><span>${n}</span><span class="idle-worker-sub">${subHtml}</span></div>
        ${barHtml}
      </div>`).join(''):'<div style="color:rgba(255,255,255,0.4);font-size:14px">Niemand toegewezen</div>'}
    </div>`;
  }).join('');
}

  const el=e.target.closest('[data-fn]');

  const fn=el.getAttribute('data-fn');
  const a=el.getAttribute('data-args');
  let args=[];
  try{if(a)args=JSON.parse(a);}catch(_){}
  if(typeof window[fn]==='function'){e.stopPropagation();window[fn](...args);}
},true);
