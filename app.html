<style>
/* ═══════════════════════════════════════════
   MHVwork — Apple macOS style + MHV kleuren
   Geel #F5C800 · Blauw #1D3FBB · Donker #1C1C1E
═══════════════════════════════════════════ */
:root {
  --mhv-yellow: #F5C800;
  --mhv-blue:   #1D3FBB;
  --mhv-yellow-dim: rgba(245,200,0,0.12);
  --mhv-blue-dim:   rgba(29,63,187,0.15);
  --bg:#000; --bg2:#1C1C1E; --bg3:#2C2C2E; --bg4:#3A3A3C;
  --glass:rgba(255,255,255,0.05); --glass2:rgba(255,255,255,0.08);
  --text:#FFF; --text2:rgba(255,255,255,0.7); --text3:rgba(255,255,255,0.4); --text4:rgba(255,255,255,0.25);
  --green:#30D158; --green-dim:rgba(48,209,88,0.12);
  --red:#FF453A; --red-dim:rgba(255,69,58,0.12);
  --orange:#FF9F0A; --orange-dim:rgba(255,159,10,0.12);
  --separator:rgba(255,255,255,0.08);
  --nav-h:52px; --tab-h:72px;
  --radius:14px; --radius-sm:10px; --radius-lg:20px;
  --font:'Outfit',-apple-system,sans-serif;
}
/* Light mode */
@media(prefers-color-scheme:light){
  :root {
    --bg:#F2F2F7; --bg2:#FFFFFF; --bg3:#F2F2F7; --bg4:#E5E5EA;
    --glass:rgba(0,0,0,0.03); --glass2:rgba(0,0,0,0.06);
    --text:#000; --text2:rgba(0,0,0,0.6); --text3:rgba(0,0,0,0.4); --text4:rgba(0,0,0,0.2);
    --separator:rgba(0,0,0,0.1);
    --mhv-yellow-dim:rgba(245,200,0,0.15); --mhv-blue-dim:rgba(29,63,187,0.1);
    --green-dim:rgba(48,209,88,0.1); --red-dim:rgba(255,69,58,0.1); --orange-dim:rgba(255,159,10,0.1);
  }
  #topbar { background:rgba(242,242,247,0.92); }
  #tabbar { background:rgba(242,242,247,0.92); }
  .notif-dot { border-color:var(--bg); }
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { height:100%; }
body {
  height:100%; background:var(--bg); color:var(--text);
  font-family:var(--font); font-size:16px; line-height:1;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button { cursor:pointer; font-family:var(--font); border:none; background:none; }
input, select, textarea { font-family:var(--font); }
* { -webkit-user-select:none; user-select:none; }
input, textarea { -webkit-user-select:text; user-select:text; }

/* ── LAYOUT ─── */

#app {
  display:flex; flex-direction:column;
  height:100dvh;
  width:100%; position:relative; overflow:hidden;
}
@media(min-width:700px){
  body { background:var(--bg3); display:flex; align-items:stretch; justify-content:center; }
  #app { max-width:520px; box-shadow:0 0 0 1px var(--separator), 0 32px 80px rgba(0,0,0,0.4); }
}
@media(min-width:1100px){
  #app { max-width:680px; }
  .page-title { font-size:36px !important; }
  .stats-grid { grid-template-columns:repeat(3,1fr) !important; }
}

/* ── TOPBAR ─── */
#topbar {
  height:var(--nav-h); flex-shrink:0;
  background:rgba(0,0,0,0.8); backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--separator);
  display:flex; align-items:center; padding:0 16px; gap:10px;
  position:relative; z-index:50;
}
#topbar img { width:28px; height:28px; border-radius:6px; object-fit:contain; }
#topbar .app-name { font-size:17px; font-weight:700; flex:1; letter-spacing:-0.3px; }
#topbar .app-name span { color:var(--mhv-yellow); }
.notif-pill {
  position:relative; width:34px; height:34px; border-radius:50%;
  background:var(--glass2); display:flex; align-items:center; justify-content:center;
  font-size:16px; transition:background 0.15s;
}
.notif-pill:active { background:var(--glass); }
.notif-dot {
  position:absolute; top:5px; right:5px; width:8px; height:8px;
  background:var(--red); border-radius:50%; border:2px solid #000; display:none;
}

/* ── SCROLL AREA ─── */
#scroll { flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }
#scroll::-webkit-scrollbar { display:none; }

/* ── TAB BAR ─── */
#tabbar {
  height:var(--tab-h); flex-shrink:0;
  background:rgba(0,0,0,0.85); backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-top:1px solid var(--separator);
  display:flex; align-items:flex-start; padding-top:8px;
  position:relative; z-index:50;
}
.tab {
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:4px 2px 0; border:none; background:none; color:var(--text3);
  transition:color 0.15s; font-size:10px; font-weight:500; letter-spacing:0.01em;
}
.tab svg { width:24px; height:24px; }
.tab.active { color:var(--mhv-yellow); }
.tab-label { font-size:10px; }

/* ── VIEWS ─── */
.view { display:none; min-height:100%; padding:16px 16px 24px; animation:fadeSlide 0.25s ease; }
.view.active { display:block; }
@keyframes fadeSlide { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

/* ── SECTION TITLES ─── */
.page-title { font-size:28px; font-weight:800; letter-spacing:-0.5px; margin-bottom:20px; line-height:1.1; }
.page-title .hi { font-size:13px; font-weight:500; color:var(--text3); display:block; margin-bottom:4px; letter-spacing:0; }
.section-label { font-size:13px; font-weight:600; color:var(--text3); text-transform:uppercase; letter-spacing:0.05em; margin:20px 0 8px; }

/* ── CARDS ─── */
.card {
  background:var(--bg2); border-radius:var(--radius); overflow:hidden;
  margin-bottom:12px; border:1px solid var(--separator);
}
.card-row {
  padding:14px 16px; display:flex; align-items:center; gap:12px;
  border-bottom:1px solid var(--separator);
}
.card-row:last-child { border-bottom:none; }
.card-row-label { flex:1; font-size:15px; font-weight:500; }
.card-row-value { font-size:15px; color:var(--text2); }
.card-row-value.accent { color:var(--mhv-yellow); font-weight:700; }
.card-row-value.green  { color:var(--green); font-weight:700; }
.card-row-value.red    { color:var(--red); }

/* ── STATS GRID ─── */
.stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
.stat-tile {
  background:var(--bg2); border-radius:var(--radius); padding:16px;
  border:1px solid var(--separator);
}
.stat-tile.yellow { background:var(--mhv-yellow-dim); border-color:rgba(245,200,0,0.2); }
.stat-tile.blue   { background:var(--mhv-blue-dim);   border-color:rgba(29,63,187,0.25); }
.stat-tile.green  { background:var(--green-dim);       border-color:rgba(48,209,88,0.2); }
.stat-tile.red    { background:var(--red-dim);         border-color:rgba(255,69,58,0.2); }
.stat-num { font-size:30px; font-weight:800; letter-spacing:-1px; line-height:1; }
.stat-num.yellow { color:var(--mhv-yellow); }
.stat-num.blue   { color:#6B8EFF; }
.stat-num.green  { color:var(--green); }
.stat-num.red    { color:var(--red); }
.stat-lbl { font-size:12px; color:var(--text3); margin-top:5px; font-weight:500; }

/* ── SHIFT CARD ─── */


/* ─── Extra animaties ──────────────────── */
.card        { transition: transform .12s ease, box-shadow .12s ease; }
.card:active { transform: scale(.985); }
.btn         { transition: opacity .12s ease, transform .1s ease; }
.btn:active  { transform: scale(.95); opacity:.85; }
.tab         { transition: color .15s ease; }
.shift-card  { transition: transform .15s ease, box-shadow .15s ease; }
.shift-card:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(0,0,0,.18); }
.stat-tile   { transition: transform .15s ease; }
.stat-tile:active { transform: scale(.97); }

/* ─── Animaties ─────────────────────────────── */
@keyframes slideUp   { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeIn    { from{opacity:0} to{opacity:1} }
@keyframes popIn     { 0%{opacity:0;transform:scale(.92)} 100%{opacity:1;transform:scale(1)} }
@keyframes shimmer   { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
.anim-up  { animation:slideUp .28s cubic-bezier(.22,.68,0,1.2) both }
.anim-in  { animation:fadeIn .2s ease both }
.anim-pop { animation:popIn .22s cubic-bezier(.22,.68,0,1.2) both }
.view     { transition:opacity .18s ease }

/* ─── Chat ───────────────────────────────────── */
.chat-wrap    { display:flex;flex-direction:column;height:100%;overflow:hidden;background:var(--bg) }
.chat-msgs    { flex:1;overflow-y:auto;padding:10px 12px 6px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth }
.chat-row     { display:flex;gap:8px;align-items:flex-end }
.chat-row.me  { flex-direction:row-reverse }
.chat-av      { width:28px;height:28px;border-radius:50%;background:var(--mhv-blue);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0 }
.chat-av.admin{ background:var(--mhv-yellow);color:#000 }
.chat-av.software{ background:#64d2ff;color:#000 }
.chat-col     { max-width:75%;display:flex;flex-direction:column;gap:2px }
.chat-row.me .chat-col { align-items:flex-end }
.chat-meta    { font-size:10px;color:var(--text3);padding:0 4px }
.chat-bubble  { background:var(--bg3);border-radius:18px 18px 18px 4px;padding:9px 13px;font-size:14px;line-height:1.5;color:var(--text);word-break:break-word;position:relative }
.chat-row.me .chat-bubble { background:var(--mhv-blue);color:#fff;border-radius:18px 18px 4px 18px }
.chat-bubble.admin-msg { background:rgba(245,200,0,.12);border:1px solid rgba(245,200,0,.2) }
.chat-bubble.software-msg { background:rgba(100,210,255,.08);border:1px solid rgba(100,210,255,.18) }
.chat-mention { color:var(--mhv-yellow);font-weight:700 }
.chat-row.me .chat-mention { color:#F5C800 }
.chat-del-btn { position:absolute;top:-8px;right:-8px;width:20px;height:20px;background:#FF453A;border:none;border-radius:50%;color:#fff;font-size:11px;cursor:pointer;display:none;align-items:center;justify-content:center }
.chat-bubble:hover .chat-del-btn { display:flex }
.chat-date-sep{ text-align:center;font-size:11px;color:var(--text3);margin:8px 0;font-weight:600;letter-spacing:.04em }
.chat-role-tag{ font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;margin-left:4px;vertical-align:middle }
.tag-admin    { background:rgba(245,200,0,.15);color:var(--mhv-yellow) }
.tag-sw       { background:rgba(100,210,255,.15);color:#64d2ff }
/* Input */
.chat-input-wrap { padding:10px 12px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--separator);background:var(--bg2);flex-shrink:0 }
.chat-input-row  { display:flex;align-items:flex-end;gap:6px }
.chat-input-row textarea { flex:1;background:var(--bg3);border:1.5px solid var(--separator);border-radius:20px;padding:9px 13px;font-size:14px;color:var(--text);font-family:inherit;resize:none;max-height:100px;outline:none;transition:border-color .2s }
.chat-input-row textarea:focus { border-color:var(--mhv-yellow) }
.chat-send { width:38px;height:38px;border-radius:50%;background:var(--mhv-yellow);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .1s,opacity .15s }
.chat-send:active { transform:scale(.9) }
.mention-list { background:var(--bg2);border:1px solid var(--separator);border-radius:12px;overflow:hidden;margin-bottom:6px;display:none }
.mention-list.open { display:block }
.mention-opt  { padding:9px 13px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px }
.mention-opt:hover { background:var(--bg3) }
/* Swap card */
.swap-card    { background:rgba(245,200,0,.08);border:1.5px solid rgba(245,200,0,.25);border-radius:14px;padding:12px 14px;margin-top:6px }
.swap-card h4 { font-size:13px;font-weight:700;color:var(--mhv-yellow);margin-bottom:6px }
.swap-card p  { font-size:12px;color:var(--text2);line-height:1.5 }
.swap-actions { display:flex;gap:6px;margin-top:8px }
/* Dev */
.dev-grid     { display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px }
.dev-tile     { background:var(--bg2);border:1px solid var(--separator);border-radius:14px;padding:16px;text-align:center }
.dev-num      { font-size:28px;font-weight:800;color:#64d2ff;letter-spacing:-1px }
.dev-lbl      { font-size:12px;color:var(--text3);margin-top:4px }

.shift-card {
  background:var(--bg2); border-radius:var(--radius); padding:16px;
  margin-bottom:10px; border:1px solid var(--separator);
  border-left:3px solid var(--separator);
}
.shift-card.mine    { border-left-color:var(--mhv-yellow); }
.shift-card.pending { border-left-color:var(--orange); }
.shift-card.done    { border-left-color:var(--green); }
.shift-card.paid    { border-left-color:var(--text4); opacity:0.6; }
.shift-time { font-size:22px; font-weight:800; letter-spacing:-0.5px; color:var(--mhv-yellow); }
.shift-date { font-size:13px; color:var(--text3); margin-top:2px; font-weight:500; }
.shift-people { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
.person-pill {
  display:inline-flex; align-items:center; gap:6px; padding:5px 10px 5px 5px;
  background:var(--glass2); border-radius:99px; font-size:13px; font-weight:500;
}
.person-pill.me { background:var(--mhv-yellow-dim); color:var(--mhv-yellow); }
.avatar {
  width:22px; height:22px; border-radius:50%; background:var(--mhv-blue);
  display:flex; align-items:center; justify-content:center;
  font-size:9px; font-weight:800; color:#fff; flex-shrink:0;
}
.avatar.yellow { background:var(--mhv-yellow); color:#1a1000; }

/* ── BADGE ─── */
.badge {
  display:inline-flex; align-items:center; padding:3px 9px;
  border-radius:99px; font-size:11px; font-weight:700; letter-spacing:0.02em;
}
.badge-green  { background:var(--green-dim);  color:var(--green); }
.badge-yellow { background:var(--mhv-yellow-dim); color:var(--mhv-yellow); }
.badge-orange { background:var(--orange-dim); color:var(--orange); }
.badge-red    { background:var(--red-dim);    color:var(--red); }
.badge-gray   { background:var(--glass2);     color:var(--text3); }
.badge-blue   { background:var(--mhv-blue-dim); color:#6B8EFF; }

/* ── BUTTONS ─── */
.btn {
  padding:13px 20px; border-radius:var(--radius-sm); font-size:15px;
  font-weight:600; transition:opacity 0.15s, transform 0.1s; display:inline-flex;
  align-items:center; justify-content:center; gap:6px;
}
.btn:active { opacity:0.75; transform:scale(0.98); }
.btn-yellow { background:var(--mhv-yellow); color:#1a1000; }
.btn-blue   { background:var(--mhv-blue);   color:#fff; }
.btn-ghost  { background:var(--glass2); color:var(--text2); border:1px solid var(--separator); }
.btn-red    { background:var(--red-dim); color:var(--red); border:1px solid rgba(255,69,58,0.2); }
.btn-green  { background:var(--green-dim); color:var(--green); border:1px solid rgba(48,209,88,0.2); }
.btn-full   { width:100%; }
.btn-sm     { padding:8px 14px; font-size:13px; border-radius:8px; }

/* ── FORM ─── */
.form-section { margin-bottom:14px; }
.form-label { font-size:13px; font-weight:600; color:var(--text3); margin-bottom:7px; display:block; }
.form-input {
  width:100%; padding:13px 14px; border-radius:var(--radius-sm);
  background:var(--bg3); border:1px solid var(--separator);
  color:var(--text); font-size:15px; font-family:var(--font);
  outline:none; transition:border-color 0.2s;
  -webkit-user-select:text; user-select:text;
}
.form-input:focus { border-color:var(--mhv-yellow); }
.form-input::placeholder { color:var(--text4); }
select.form-input option { background:var(--bg3); }
.form-row { display:flex; gap:10px; }
.form-row .form-section { flex:1; }

.pill-tabs { display:flex; background:var(--bg3); border-radius:10px; padding:3px; gap:2px; margin-bottom:16px; }
.pill-tab { flex:1; padding:8px; border-radius:7px; font-size:13px; font-weight:600; color:var(--text3); transition:all 0.2s; }
.pill-tab.active { background:var(--bg2); color:var(--text); box-shadow:0 1px 4px rgba(0,0,0,0.4); }

/* ── CALENDAR ─── */
.cal-nav { display:flex; align-items:center; margin-bottom:14px; }
.cal-nav h3 { flex:1; text-align:center; font-size:17px; font-weight:700; }
.cal-arrow { width:32px; height:32px; border-radius:50%; background:var(--glass2); display:flex; align-items:center; justify-content:center; font-size:18px; color:var(--text2); }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
.cal-dn { text-align:center; font-size:10px; font-weight:700; color:var(--text3); padding:4px 0 8px; }
.cal-d {
  aspect-ratio:1; border-radius:8px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; font-size:13px; font-weight:500;
  cursor:pointer; position:relative; transition:background 0.15s;
}
.cal-d:active { background:var(--bg3); }
.cal-d.today { background:var(--mhv-yellow); color:#1a1000; font-weight:800; }
.cal-d.selected:not(.today) { background:var(--bg3); outline:2px solid var(--mhv-yellow); }
.cal-d.has-shift::after {
  content:''; position:absolute; bottom:3px;
  width:4px; height:4px; border-radius:50%; background:var(--mhv-blue);
}
.cal-d.today.has-shift::after { background:rgba(29,63,187,0.6); }
.cal-d.blocked:not(.today) { color:var(--red); }
.cal-d.empty { cursor:default; }

/* ── AVAILABILITY ROW ─── */
.avail-row {
  display:flex; align-items:center; gap:12px; padding:14px 16px;
  background:var(--bg2); border-radius:var(--radius-sm); margin-bottom:8px;
  border:1px solid var(--separator);
}
.avail-info { flex:1; }
.avail-name { font-size:15px; font-weight:600; }
.avail-date { font-size:13px; color:var(--text3); margin-top:2px; }
.avail-note { font-size:12px; color:var(--text3); margin-top:2px; font-style:italic; }

/* ── NOTIF PANEL ─── */
#notif-panel {
  position:absolute; top:calc(var(--nav-h) + 8px); right:12px;
  width:min(340px, calc(100vw - 32px)); max-width:360px;
  background:var(--bg2); border:1px solid var(--separator);
  border-radius:var(--radius); z-index:200;
  box-shadow:0 20px 60px rgba(0,0,0,0.7);
  display:none; max-height:75vh; overflow-y:auto;
}
#notif-panel.open { display:block; animation:fadeSlide 0.2s ease; }
.np-header { padding:14px 16px; border-bottom:1px solid var(--separator); display:flex; justify-content:space-between; align-items:center; }
.np-header h3 { font-size:15px; font-weight:700; }
.np-item { padding:13px 16px; border-bottom:1px solid var(--separator); }
.np-item:last-child { border-bottom:none; }
.np-item.unread { background:var(--mhv-yellow-dim); }
.np-title { font-size:14px; font-weight:600; }
.np-body  { font-size:13px; color:var(--text2); margin-top:3px; line-height:1.5; }
.np-time  { font-size:11px; color:var(--text3); margin-top:5px; }

/* ── MODAL ─── */
.modal-bg {
  position:fixed; inset:0; background:rgba(0,0,0,0.7);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  z-index:100; display:none; align-items:flex-end; justify-content:center;
}
.modal-bg.open { display:flex; }
.modal-box {
  background:var(--bg2); border-radius:var(--radius-lg) var(--radius-lg) 0 0;
  padding:8px 20px 32px; width:100%; max-width:430px;
  max-height:92vh; overflow-y:auto;
  animation:sheetUp 0.3s cubic-bezier(.16,1,.3,1);
}
@keyframes sheetUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
.modal-handle { width:36px; height:4px; background:var(--bg4); border-radius:2px; margin:10px auto 20px; }
.modal-title { font-size:20px; font-weight:800; margin-bottom:18px; letter-spacing:-0.3px; }
.modal-close-btn { float:right; width:28px; height:28px; border-radius:50%; background:var(--bg3); color:var(--text3); font-size:14px; display:flex; align-items:center; justify-content:center; margin-top:-4px; }

/* ── CONFIRM ─── */
#confirm-bg { position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(8px); z-index:300; display:none; align-items:center; justify-content:center; padding:24px; }
#confirm-bg.open { display:flex; }
.confirm-box { background:var(--bg2); border-radius:var(--radius-lg); padding:24px 20px; width:100%; max-width:320px; border:1px solid var(--separator); }
.confirm-title { font-size:17px; font-weight:700; margin-bottom:8px; }
.confirm-msg { font-size:14px; color:var(--text2); line-height:1.6; margin-bottom:20px; }
.confirm-btns { display:flex; flex-direction:column; gap:8px; }
.confirm-btns .btn { width:100%; }

/* ── TOAST ─── */
#toast {
  position:fixed; bottom:calc(var(--tab-h) + 12px); left:50%;
  transform:translateX(-50%) translateY(8px);
  background:var(--bg3); border:1px solid var(--separator);
  border-radius:99px; padding:10px 20px; font-size:14px; font-weight:500;
  z-index:999; opacity:0; transition:all 0.25s; pointer-events:none; white-space:nowrap;
  box-shadow:0 8px 32px rgba(0,0,0,0.5);
}
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
#toast.ok  { background:var(--green-dim); border-color:rgba(48,209,88,0.3); color:var(--green); }
#toast.err { background:var(--red-dim);   border-color:rgba(255,69,58,0.3); color:var(--red); }

/* ── LOADER ─── */
#loader { position:fixed; inset:0; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:999; gap:16px; }
.spin { width:36px; height:36px; border:3px solid var(--bg3); border-top-color:var(--mhv-yellow); border-radius:50%; animation:spin 0.7s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* ── EMPTY STATE ─── */
.empty { text-align:center; padding:40px 20px; color:var(--text3); }
.empty-icon { font-size:36px; margin-bottom:10px; opacity:0.6; }
.empty p { font-size:14px; line-height:1.6; }

/* ── WORKER CHECK ─── */
.worker-check {
  display:flex; align-items:center; gap:12px; padding:12px 14px;
  background:var(--bg3); border-radius:var(--radius-sm); margin-bottom:8px;
  border:1px solid var(--separator); cursor:pointer;
}
.worker-check input[type=checkbox] { width:18px; height:18px; accent-color:var(--mhv-yellow); flex-shrink:0; }
.worker-check.blocked { border-color:rgba(255,69,58,0.3); }
.worker-check-info { flex:1; }
.worker-check-name { font-size:14px; font-weight:600; }
.worker-check-wage { font-size:12px; color:var(--text3); margin-top:2px; }

/* ── PROFILE CARD ─── */
.prof-card { background:var(--bg2); border-radius:var(--radius); padding:20px; margin-bottom:12px; text-align:center; border:1px solid var(--separator); }
.prof-avatar { width:72px; height:72px; border-radius:50%; background:var(--mhv-blue); display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:800; color:#fff; margin:0 auto 12px; }
.prof-name { font-size:20px; font-weight:800; letter-spacing:-0.3px; }
.prof-sub  { font-size:13px; color:var(--text3); margin-top:4px; }
.prof-wage { font-size:26px; font-weight:800; color:var(--green); margin-top:10px; letter-spacing:-0.5px; }

/* ── ROSTER DAY ─── */
.roster-row { display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--separator); }
.roster-row:last-child { border-bottom:none; }
.roster-time { font-size:14px; font-weight:700; min-width:88px; color:var(--mhv-yellow); }
.roster-name { flex:1; font-size:14px; font-weight:500; }
.roster-pay  { font-size:13px; color:var(--green); font-weight:600; min-width:60px; text-align:right; }

/* iOS safe area */
@supports(padding-bottom: env(safe-area-inset-bottom)){
  #tabbar { padding-bottom:env(safe-area-inset-bottom); height:calc(var(--tab-h) + env(safe-area-inset-bottom)); }
  #toast  { bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 12px); }
}
</style>

const MO   = ['Januari','Februari','Maart','April','Mei','Juni','Juli','Augustus','September','Oktober','November','December'];
const DN   = ['Zo','Ma','Di','Wo','Do','Vr','Za'];

let U, allShifts=[], allUsers=[], allAvail=[], allNotifs=[];
let allChat=[]; let unsubChat;
let calY=new Date().getFullYear(), calM=new Date().getMonth(), selDay=null;
let rosterTab='mine', adminTab='roster', payMonth=0;
let unsubShifts, unsubNotifs, unsubAvail;

// ── INIT ──────────────────────────────────────
window.addEventListener('mhv:ready', async ()=>{
  try {
    U = window._user;
    const safeEl = id => document.getElementById(id);
    if(safeEl('topLogo')) safeEl('topLogo').src = LOGO;
    if(window._f && window._f.EMAILJS_PUBLIC_KEY !== 'JOUW_EMAILJS_PUBLIC_KEY')
      emailjs.init({ publicKey: window._f.EMAILJS_PUBLIC_KEY });
    // Chat tab voor iedereen
    const tabChat=safeEl('tab-chat'); if(tabChat) tabChat.style.display='flex';
    if(U.role==='admin'){
      const ta=safeEl('tab-admin'); if(ta) ta.style.display='flex';
      const tl=safeEl('tab-avail-label'); if(tl) tl.textContent='Beschikbaar';
    }
    if(U.role==='software'){
      // Dev: verberg roster/beschikbaar/beheer, toon dev tab
      document.querySelectorAll('.tab').forEach(t=>{
        const lbl=t.querySelector('.tab-label');
        if(lbl&&['Rooster','Beschikbaar','Beheer'].includes(lbl.textContent)) t.style.display='none';
      });
      document.querySelectorAll('.dev-only').forEach(t=>t.style.display='flex');
    }
    try { await loadUsers(); } catch(e){ allUsers=[]; }
    try { subChat(); } catch(e){}
    if(U.role!=='software'){ try { subShifts(); } catch(e){} }
    try { subNotifs(); } catch(e){}
    if(U.role!=='software'){ try { subAvail(); } catch(e){} }
    try { render(U.role==='software'?'dev':'home'); } catch(e){ console.warn('render:',e); }
  } catch(err){ console.error('mhv:ready fout:', err); }
  finally {
    const l=document.getElementById('loader'), a=document.getElementById('app');
    if(l) l.style.display='none';
    if(a) a.style.display='flex';
  }
});;

// ── DATA ──────────────────────────────────────
async function loadUsers(){
  const s = await window._f.getDocs(window._f.collection(window._f.db,'users'));
  allUsers = s.docs.map(d=>({uid:d.id,...d.data()}));
}
function subShifts(){
  const {db,collection,onSnapshot,orderBy,query}=window._f;
  unsubShifts=onSnapshot(query(collection(db,'shifts'),orderBy('date','asc')),s=>{
    allShifts=s.docs.map(d=>({id:d.id,...d.data()}));
    rerender();
  });
}
function subNotifs(){
  const {db,collection,onSnapshot,orderBy,query,where}=window._f;
  // Geen orderBy om composite Firestore index te vermijden — we sorteren in JS
  const q=query(collection(db,'notifications'),where('to','array-contains',U.uid));
  unsubNotifs=onSnapshot(q,s=>{
    allNotifs=s.docs.map(d=>({id:d.id,...d.data()}))
      .sort((a,b)=>{ const ta=a.createdAt?.toDate?.()?.getTime()||0; const tb=b.createdAt?.toDate?.()?.getTime()||0; return tb-ta; });
    renderNotifs();
    const unread=allNotifs.filter(n=>!n.readBy?.includes(U.uid)).length;
    document.getElementById('notifDot').style.display=unread?'block':'none';
  });
}
function subAvail(){
  const {db,collection,onSnapshot,orderBy,query,where}=window._f;
  const col=collection(db,'availability');
  const q=U.role==='admin'
    ? query(col,orderBy('date','asc'))
    : query(col,where('uid','==',U.uid),orderBy('date','asc'));
  unsubAvail=onSnapshot(q,s=>{
    allAvail=s.docs.map(d=>({id:d.id,...d.data()}));
    if(document.getElementById('view-avail').classList.contains('active')) render('avail');
    renderCal();
  });
}

// ── HELPERS ──────────────────────────────────
const $ = id => document.getElementById(id);
function toast(m,t=''){const el=$('toast');el.textContent=m;el.className='show '+t;clearTimeout(el._t);el._t=setTimeout(()=>el.className='',2800);}
function fmtMoney(n){return '€\u202F'+Number(n||0).toFixed(2).replace('.',',');}
function fmtDate(d){const dt=toDate(d);return dt.toLocaleDateString('nl-NL',{weekday:'short',day:'numeric',month:'short'});}
function toDate(d){return d?.toDate?d.toDate():(d instanceof Date?d:new Date(d));}
function dKey(d){const dt=toDate(d);return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;}
function nowKey(){return dKey(new Date());}
function minsFrom(s){if(!s)return 0;const[h,m]=s.split(':').map(Number);return h*60+(m||0);}
function calcH(s,e){const d=minsFrom(e)-minsFrom(s);return d>0?d/60:0;}
function calcPay(s,e,w){return calcH(s,e)*(w||0);}
function roundQ(h,m){const t=Math.round((h*60+m)/15)*15;return{h:Math.floor(t/60)%24,m:t%60};}
function toTimeStr(h,m){return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;}
function roundTimeStr(s){if(!s)return s;const[h,m]=s.split(':').map(Number);const q=roundQ(h,m);return toTimeStr(q.h,q.m);}
function getInitials(n){return(n||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);}
function userName(uid){return allUsers.find(u=>u.uid===uid)?.name||'Onbekend';}
function userWage(uid){return allUsers.find(u=>u.uid===uid)?.wage||0;}
function admins(){return allUsers.filter(u=>u.role==='admin');}
function employees(){return allUsers.filter(u=>u.role!=='admin');}
function isPast(shift){const d=toDate(shift.date);const now=new Date();return d<new Date(now.getFullYear(),now.getMonth(),now.getDate());}
function isToday(shift){return dKey(shift.date)===nowKey();}
function shiftFinished(shift){
  if(!isPast(shift)&&!isToday(shift))return false;
  if(isPast(shift))return true;
  const now=new Date();
  const endMins=minsFrom(shift.endTime);
  const nowMins=now.getHours()*60+now.getMinutes();
  return nowMins>=endMins;
}
function getShiftStatus(shift,uid){
  const c=shift.workerConfirmations?.[uid];
  if(shift.paidFor?.[uid])return 'paid';
  if(c==='approved')return 'approved';
  if(c==='confirmed')return 'reviewing';
  return 'pending';
}
function getEffectiveTimes(shift,uid){
  const ft=shift.finalTimes?.[uid];
  return{start:ft?.start||shift.startTime,end:ft?.end||shift.endTime};
}
function getApprovedPay(shift,uid){
  const s=getShiftStatus(shift,uid);
  if(s!=='approved'&&s!=='paid')return 0;
  const{start,end}=getEffectiveTimes(shift,uid);
  return calcPay(start,end,userWage(uid));
}
function blockedOn(key){
  return allAvail.filter(a=>dKey(a.date)===key);
}
function confirm2(title,msg,okLabel,okClass='btn-red'){
  return new Promise(res=>{
    $('confirm-title').textContent=title;
    $('confirm-msg').textContent=msg;
    const ok=$('confirm-ok'); const ca=$('confirm-cancel');
    ok.textContent=okLabel; ok.className='btn '+okClass;
    $('confirm-bg').classList.add('open');
    const cl=()=>{$('confirm-bg').classList.remove('open');ok.onclick=null;ca.onclick=null;};
    ok.onclick=()=>{cl();res(true);};
    ca.onclick=()=>{cl();res(false);};
  });
}

// ── NAV ──────────────────────────────────────
function nav(v,btn){
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  const _el=$('view-'+v);
  if(_el){
    _el.classList.add('active');
    _el.style.opacity='0';
    _el.style.transform='translateY(8px)';
    requestAnimationFrame(()=>{
      _el.style.transition='opacity .2s ease,transform .2s cubic-bezier(.22,.68,0,1.1)';
      _el.style.opacity='1';
      _el.style.transform='translateY(0)';
    });
  }
  if(btn)btn.classList.add('active');
  $('notif-panel').classList.remove('open');
  render(v);
}
function rerender(){
  const active=document.querySelector('.view.active');
  if(active)render(active.id.replace('view-',''));
}
function render(v){
  if(v==='home')    renderHome();
  if(v==='roster')  renderRoster();
  if(v==='avail')   renderAvail();
  if(v==='admin')   renderAdmin();
  if(v==='profile') renderProfile();
  if(v==='chat')    renderChat();
  if(v==='dev')     renderDev();
}

      </div>
    </div>

    ${pendingApproval.length?`

    ${pendingApproval.map(s=>{
      const uids=Object.keys(s.workerConfirmations||{}).filter(uid=>s.workerConfirmations[uid]==='confirmed');

function renderAdminShiftCard(s){
  const rows=(s.workers||[]).map(uid=>{

      <div class="roster-time">${start}–${end}</div>

    </div>`;
  }).join('');
  return `<div class="card">${rows}</div>`;
}

async function confirmShiftOk(shiftId){
  const s=allShifts.find(x=>x.id===shiftId); if(!s)return;
  const{db,doc,updateDoc}=window._f;
  await updateDoc(doc(db,'shifts',shiftId),{
    [`workerConfirmations.${U.uid}`]:'confirmed',
    [`finalTimes.${U.uid}`]:{start:s.startTime,end:s.endTime}
  });
  toast('Bevestigd!','ok');
}
function openCorrectShift(shiftId){
  const s=allShifts.find(x=>x.id===shiftId); if(!s)return;
  modal(`
    <div class="modal-handle"></div>
    <div class="modal-title">Tijden doorgeven</div>
    <div style="background:var(--bg3);border-radius:10px;padding:12px 14px;margin-bottom:18px">
      <div style="font-size:12px;color:var(--text3);margin-bottom:3px">Geplande tijd</div>
      <div style="font-size:17px;font-weight:700;color:var(--mhv-yellow)">${s.startTime} – ${s.endTime}</div>
    </div>
    <div class="form-row">
      <div class="form-section"><label class="form-label">Werkelijk begin</label>
        <input type="time" class="form-input" id="cStart" value="${s.startTime}"></div>
      <div class="form-section"><label class="form-label">Werkelijk eind</label>
        <input type="time" class="form-input" id="cEnd" value="${s.endTime}"></div>
    </div>
    <button class="btn btn-yellow btn-full" onclick="submitCorrection('${shiftId}')">Doorsturen</button>
  `);

async function submitCorrection(shiftId){
  const s=roundTimeStr($('cStart').value), e=roundTimeStr($('cEnd').value);
  if(!s||!e){toast('Vul beide tijden in','err');return;}
  const{db,doc,updateDoc}=window._f;
  await updateDoc(doc(db,'shifts',shiftId),{
    [`workerConfirmations.${U.uid}`]:'confirmed',
    [`finalTimes.${U.uid}`]:{start:s,end:e}
  });
  closeModal(); toast('Tijden doorgestuurd!','ok');
}

function renderAdminRoster(c){
  const now=new Date();
  const todayKey=nowKey();
  const tabs=`
    <div class="pill-tabs">
      <button class="pill-tab ${adminTab==='today'?'active':''}" onclick="setAdminRTab('today',this)">Vandaag</button>
      <button class="pill-tab ${adminTab==='month'?'active':''}" onclick="setAdminRTab('month',this)">Deze maand</button>
      <button class="pill-tab ${adminTab==='all'?'active':''}" onclick="setAdminRTab('all',this)">Alles</button>
    </div>`;

  let shifts=allShifts;
  if(adminTab==='today') shifts=allShifts.filter(s=>dKey(s.date)===todayKey);
  if(adminTab==='month') shifts=allShifts.filter(s=>{const d=toDate(s.date);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();});

  // Group by day
  const days={};
  shifts.forEach(s=>{const k=dKey(s.date);if(!days[k])days[k]=[];days[k].push(s);});
  const sorted=Object.keys(days).sort();

  // Totale schuld deze weergave
  let totalDebt=0;
  shifts.forEach(s=>(s.workers||[]).forEach(uid=>{
    const st=getShiftStatus(s,uid);
    if(st==='approved'){const{start,end}=getEffectiveTimes(s,uid);totalDebt+=calcPay(start,end,userWage(uid));}
  }));

  c.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div class="page-title" style="margin:0">Rooster</div>
      <button class="btn btn-yellow btn-sm" onclick="openAddShift()">+ Dienst</button>
    </div>
    ${tabs}
    ${totalDebt>0?`<div class="stat-tile red" style="margin-bottom:14px"><div class="stat-num" style="color:var(--red);font-size:22px">${fmtMoney(totalDebt)}</div><div class="stat-lbl">Openstaande schuld</div></div>`:''}
    ${sorted.length?sorted.map(k=>{
      const[y,m,d]=k.split('-').map(Number);
      const dt=new Date(y,m-1,d);
      const blocked=blockedOn(k).filter(a=>!days[k].some(s=>s.workers?.includes(a.uid)));
      return `<div style="margin-bottom:16px">
        <div class="section-label" style="margin-top:0">${fmtDate(dt)}</div>
        ${days[k].map(s=>{
          const workers=(s.workers||[]).map(uid=>{
            const st=getShiftStatus(s,uid);
            const{start,end}=getEffectiveTimes(s,uid);
            const pay=st==='approved'||st==='paid'?calcPay(start,end,userWage(uid)):null;
            return `<div class="roster-row">
              <div class="roster-time">${start}–${end}</div>
              <div class="roster-name">${userName(uid)}</div>
              ${pay!==null?`<div class="roster-pay">${fmtMoney(pay)}</div>`:`<div class="roster-pay" style="color:var(--text4)">—</div>`}
              ${st==='confirmed'?`<button class="btn btn-green" style="padding:4px 8px;font-size:11px" onclick="approveShift('${s.id}','${uid}')">✓</button><button class="btn btn-ghost" style="padding:4px 8px;font-size:11px" onclick="adminCorrect('${s.id}','${uid}')">✏</button>`
                :`<span class="badge ${st==='approved'||st==='paid'?'badge-green':st==='reviewing'?'badge-orange':'badge-gray'}" style="font-size:10px">${st==='approved'||st==='paid'?'✓':st==='reviewing'?'…':'⏳'}</span>`}
            </div>`;
          }).join('');
          return `<div class="card" style="margin-bottom:8px">
            <div style="padding:12px 16px;border-bottom:1px solid var(--separator);display:flex;justify-content:space-between;align-items:center">
              <div style="font-size:15px;font-weight:700;color:var(--mhv-yellow)">${s.startTime} – ${s.endTime}</div>
              <div style="display:flex;gap:6px">
                <button class="btn btn-ghost btn-sm" onclick="openEditShift('${s.id}')">✏</button>
                <button class="btn btn-red btn-sm" onclick="deleteShift('${s.id}')">🗑</button>
              </div>
            </div>
            ${workers}
          </div>`;
        }).join('')}
        ${blocked.length?`<div style="padding:10px 14px;background:var(--red-dim);border-radius:10px;border:1px solid rgba(255,69,58,0.2)">
          <div style="font-size:11px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px">Niet beschikbaar</div>

  `;
}

function renderCal(){
  const ct=$('calTitle'); if(!ct)return;
  ct.textContent=`${MO[calM]} ${calY}`;
  const today=nowKey();
  const first=new Date(calY,calM,1).getDay();
  const days=new Date(calY,calM+1,0).getDate();
  let html=DN.map(d=>`<div class="cal-dn">${d}</div>`).join('');
  for(let i=0;i<first;i++)html+=`<div class="cal-d empty"></div>`;
  for(let d=1;d<=days;d++){
    const dt=new Date(calY,calM,d);
    const k=dKey(dt);
    const isTod=k===today;
    const isSel=selDay===k;
    const hasShift=allShifts.some(s=>{
      if(dKey(s.date)!==k)return false;
      return rosterTab==='all'?true:s.workers?.includes(U.uid);
    });
    const isBlocked=allAvail.some(a=>dKey(a.date)===k&&a.uid===U.uid);
    let cls='cal-d';
    if(isTod)cls+=' today';
    if(isSel&&!isTod)cls+=' selected';
    if(hasShift)cls+=' has-shift';
    if(isBlocked&&!isTod)cls+=' blocked';
    html+=`<div class="${cls}" onclick="selCalDay('${k}')">${d}</div>`;
  }
  $('calGrid').innerHTML=html;
  if(selDay)renderDayShifts(selDay);
}
window.calNav=(d)=>{calM+=d;if(calM>11){calM=0;calY++;}if(calM<0){calM=11;calY--;}renderCal();};
window.selCalDay=(k)=>{selDay=k;renderCal();renderDayShifts(k);};

function renderDayShifts(k){
  const title=$('calDayTitle'); const list=$('calDayList');
  if(!title||!list)return;
  const[y,m,d]=k.split('-').map(Number);
  title.textContent=fmtDate(new Date(y,m-1,d));
  const shifts=allShifts.filter(s=>{
    if(dKey(s.date)!==k)return false;
    return rosterTab==='all'?true:s.workers?.includes(U.uid);
  });
  if(!shifts.length){list.innerHTML=`<div class="empty" style="padding:20px 0"><div class="empty-icon">📅</div><p>Geen diensten</p></div>`;return;}
  list.innerHTML=shifts.map(s=>{
    const workers=(s.workers||[]).map(uid=>{
      const isMe=uid===U.uid;
      const st=getShiftStatus(s,uid);
      const{start,end}=getEffectiveTimes(s,uid);
      const finished=shiftFinished(s);
      const canConfirm=isMe&&finished&&st==='pending';
      return `<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--separator)">
        <div class="avatar ${isMe?'yellow':''}">${getInitials(userName(uid))}</div>
        <div style="flex:1">
          <div style="font-size:14px;font-weight:${isMe?'700':'500'}">${userName(uid)}${isMe?' (jij)':''}</div>
          <div style="font-size:12px;color:var(--text3)">${start} – ${end}</div>
        </div>
        <span class="badge ${st==='approved'||st==='paid'?'badge-green':st==='reviewing'?'badge-orange':'badge-gray'}">${st==='approved'||st==='paid'?'✓':st==='reviewing'?'In beoord.':'Gepland'}</span>
        ${canConfirm?`<button class="btn btn-yellow btn-sm" onclick="openCorrectShift('${s.id}')">Bevestig</button>`:''}
      </div>`;
    }).join('');
    return `<div class="card" style="margin-bottom:10px;padding:0;overflow:hidden">
      <div style="padding:12px 14px;background:var(--bg3);border-bottom:1px solid var(--separator)">
        <div style="font-size:16px;font-weight:800;color:var(--mhv-yellow)">${s.startTime} – ${s.endTime}</div>
      </div>
      ${workers}
    </div>`;
  }).join('');
}

  const[y,m,d]=dateVal.split('-').map(Number);

    workerConfirmations:confs,finalTimes:{},

// UITBETALING
function renderUitbetaling(c){
  const now=new Date();
  const months=[];
  for(let i=0;i<6;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({y:d.getFullYear(),m:d.getMonth(),label:`${MO[d.getMonth()]} ${d.getFullYear()}`});}
  const{y,m}=months[payMonth];
  const monthShifts=allShifts.filter(s=>{const d=toDate(s.date);return d.getFullYear()===y&&d.getMonth()===m;});
  const emp=employees();
  const payData=emp.map(u=>{
    const myS=monthShifts.filter(s=>s.workers?.includes(u.uid));
    const approved=myS.filter(s=>getShiftStatus(s,u.uid)==='approved');
    const paid=myS.filter(s=>getShiftStatus(s,u.uid)==='paid');
    const approvedPay=approved.reduce((sum,s)=>sum+getApprovedPay(s,u.uid),0);
    const paidPay=paid.reduce((sum,s)=>sum+getApprovedPay(s,u.uid),0);
    const isPaid=myS.length>0&&myS.every(s=>getShiftStatus(s,u.uid)==='paid'||!s.workers?.includes(u.uid));
    return{...u,myS,approved,paid,approvedPay,paidPay,isPaid};
  }).filter(u=>u.myS.length>0);
  const totalSchuld=payData.reduce((s,u)=>s+u.approvedPay,0);
  const totalPaid=payData.reduce((s,u)=>s+u.paidPay,0);

  c.innerHTML=`
    <div class="form-section" style="margin-bottom:14px">
      <label class="form-label">Maand</label>
      <select class="form-input" onchange="payMonth=parseInt(this.value);renderAdminTab()">
        ${months.map((mo,i)=>`<option value="${i}" ${i===payMonth?'selected':''}>${mo.label}</option>`).join('')}
      </select>
    </div>
    <div class="stats-grid">
      <div class="stat-tile red"><div class="stat-num red" style="font-size:22px">${fmtMoney(totalSchuld)}</div><div class="stat-lbl">Nog te betalen</div></div>
      <div class="stat-tile green"><div class="stat-num green" style="font-size:22px">${fmtMoney(totalPaid)}</div><div class="stat-lbl">Uitbetaald</div></div>
    </div>
    ${payData.length?payData.map(u=>`
      <div class="card" style="margin-bottom:10px">
        <div class="card-row">
          <div class="avatar" style="width:40px;height:40px;font-size:15px;flex-shrink:0">${getInitials(u.name)}</div>
          <div style="flex:1">
            <div style="font-size:16px;font-weight:700">${u.name}</div>
            <div style="font-size:12px;color:var(--text3)">${u.myS.length} dienst(en) · ${fmtMoney(u.wage||0)}/uur</div>
          </div>
          <div style="text-align:right">
            ${u.approvedPay>0?`<div style="font-size:17px;font-weight:800;color:var(--red)">${fmtMoney(u.approvedPay)}</div><div style="font-size:11px;color:var(--text3)">schuldig</div>`:''}
            ${u.paidPay>0?`<div style="font-size:13px;color:var(--green)">${fmtMoney(u.paidPay)} betaald</div>`:''}
          </div>
        </div>
        <div class="card-row" style="gap:8px">
          ${u.approvedPay>0?`<button class="btn btn-green btn-sm" style="flex:1" onclick="markPaid('${u.uid}','${y}','${m}','${u.name}','${u.approvedPay.toFixed(2)}')">✓ Uitbetaald</button>`:''}
          <button class="btn btn-ghost btn-sm" style="flex:1" onclick="showPayDetail('${u.uid}','${y}','${m}')">Details</button>
        </div>
      </div>`).join('')
    :`<div class="empty"><div class="empty-icon">💶</div><p>Geen diensten deze maand</p></div>`}
  `;
}
async function markPaid(uid,year,month,name,amount){
  const ok=await confirm2('Uitbetaling registreren',`${name} markeren als uitbetaald voor ${fmtMoney(amount)}?`,'Bevestigen','btn-green');
  if(!ok)return;
  const y=parseInt(year),m=parseInt(month);
  const toMark=allShifts.filter(s=>{const d=toDate(s.date);return d.getFullYear()===y&&d.getMonth()===m&&s.workers?.includes(uid)&&getShiftStatus(s,uid)==='approved';});
  const{db,doc,updateDoc,collection,addDoc,serverTimestamp}=window._f;
  for(const s of toMark) await updateDoc(doc(db,'shifts',s.id),{[`paidFor.${uid}`]:true,[`workerConfirmations.${uid}`]:'approved'});
  await addDoc(collection(db,'payments'),{uid,year:y,month:m,amount:parseFloat(amount),paidBy:U.uid,paidAt:serverTimestamp()});
  await sendNotif(uid,'Uitbetaling ontvangen',`Je hebt ${fmtMoney(amount)} ontvangen voor ${MO[m]} ${y}.`);
  const u=allUsers.find(x=>x.uid===uid);
  if(u?.email){
    try{await emailjs.send(window._f.EMAILJS_SERVICE_ID,window._f.EMAILJS_TPL_PAYMENT,{to_email:u.email,to_name:u.name,amount:fmtMoney(amount),month:`${MO[m]} ${y}`,title:'Uitbetaling ontvangen',body:`Je hebt ${fmtMoney(amount)} ontvangen voor ${MO[m]} ${y}.`});}
    catch(e){console.warn('Email fout:',e);}
  }
  toast('Uitbetaling geregistreerd!','ok');
}
function showPayDetail(uid,y,m){
  const u=allUsers.find(x=>x.uid===uid); if(!u)return;
  const shifts=allShifts.filter(s=>{const d=toDate(s.date);return d.getFullYear()===parseInt(y)&&d.getMonth()===parseInt(m)&&s.workers?.includes(uid);});
  modal(`
    <div class="modal-handle"></div>
    <div class="modal-title">${u.name}</div>
    <div style="font-size:13px;color:var(--text3);margin-bottom:16px">${MO[parseInt(m)]} ${y} · ${fmtMoney(u.wage||0)}/uur</div>
    ${shifts.map(s=>{
      const st=getShiftStatus(s,uid);
      const{start,end}=getEffectiveTimes(s,uid);
      const pay=st==='approved'||st==='paid'?calcPay(start,end,u.wage||0):null;
      return `<div style="display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--separator)">
        <div style="flex:1">
          <div style="font-size:14px;font-weight:600">${fmtDate(s.date)}</div>
          <div style="font-size:12px;color:var(--text3)">${start} – ${end}</div>
        </div>
        <span class="badge ${st==='paid'?'badge-green':st==='approved'?'badge-green':st==='reviewing'?'badge-orange':'badge-gray'}">${st==='paid'?'Uitbetaald':st==='approved'?'Goedgekeurd':st==='reviewing'?'In beoord.':'Wacht'}</span>
        <div style="font-weight:700;color:${pay?'var(--green)':'var(--text3)'};">${pay?fmtMoney(pay):'—'}</div>
      </div>`;
    }).join('')}
  `);
}

async function sendMsg(){
  const recipients=[...document.querySelectorAll('.msg-r:checked')].map(i=>i.value);
  const title=$('msgTitle').value.trim(), body=$('msgBody').value.trim();
  if(!recipients.length){toast('Kies ontvangers','err');return;}

async function changePw(){

  if(!cur||!nw||!nw2){toast('Vul alle velden in','err');return;}
  if(nw!==nw2){toast('Wachtwoorden komen niet overeen','err');return;}
  if(nw.length<6){toast('Minimaal 6 tekens','err');return;}
  try{
    const{auth,reauthenticateWithCredential,EmailAuthProvider,updatePassword}=window._f;
    const cred=EmailAuthProvider.credential(auth.currentUser.email,cur);
    await reauthenticateWithCredential(auth.currentUser,cred);
    await updatePassword(auth.currentUser,nw);
    toast('Wachtwoord gewijzigd!','ok');
    $('pwC').value=''; $('pwN').value=''; $('pwN2').value='';
  }catch(e){
    if(e.code?.includes('wrong-password')||e.code?.includes('invalid-credential'))toast('Huidig wachtwoord klopt niet','err');
    else toast('Er ging iets mis','err');
  }
}

function _renderChatMsgs(){
  const c=document.getElementById('chatMsgs'); if(!c)return;

    return;
  }
  let html=''; let lastDate='';
  allChat.forEach(function(msg,idx){
    const t=msg.createdAt&&msg.createdAt.toDate?msg.createdAt.toDate():new Date();
    const ds=t.toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'});
    if(ds!==lastDate){ html+='<div class="chat-date-sep anim-in">'+ds+'</div>'; lastDate=ds; }
    const mine=msg.uid===U.uid;
    const av=getInitials(msg.name||'?');
    const ts=t.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
    const roleTag=msg.role==='admin'?'<span class="chat-role-tag tag-admin">Beheerder</span>'
      :msg.role==='software'?'<span class="chat-role-tag tag-sw">Dev</span>':'';
    const canDel=(U.role==='admin'||U.role==='software'||mine);
    const delBtn=canDel?'<button class="chat-del-btn" onclick="delChatMsg(\''+msg.id+'\')" title="Verwijder">✕</button>':'';
    const txt=msg.text?_formatMentions(msg.text):'';
    const swapHtml=msg.type==='swap'?_renderSwapCard(msg):'';
    const payHtml=msg.type==='payment'?'<div style="font-size:13px;color:var(--green);font-weight:700;margin-top:4px">💶 '+msg.amount+'</div>':'';
    const avClass='chat-av'+(msg.role==='admin'?' admin':msg.role==='software'?' software':'');
    html+='<div class="chat-row'+(mine?' me':'')+' anim-up" style="animation-delay:'+(idx*.02)+'s">'
      +(mine?'':'<div class="'+avClass+'">'+av+'</div>')
      +'<div class="chat-col">'

function _formatMentions(text){
  return text.replace(/@(\S+)/g,'<span class="chat-mention">@$1</span>');
}

function chatInputHandler(el){
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,100)+'px';
  // @mention detectie
  const val=el.value, pos=el.selectionStart;
  const before=val.slice(0,pos);
  const match=before.match(/@(\w*)$/);
  if(match){ showMentionList(match[1]); }
  else { hideMentionList(); }
}

function showMentionList(q){
  const list=document.getElementById('mentionList'); if(!list)return;
  const opts=[{uid:'all',name:'Iedereen'},{uid:'dev',name:'Dev'},{uid:'admin',name:'Beheerder'},...allUsers.filter(u=>u.uid!==U.uid)];
  const fil=q?opts.filter(o=>o.name.toLowerCase().includes(q.toLowerCase())):opts;
  if(!fil.length){hideMentionList();return;}
  list.innerHTML=fil.slice(0,6).map(function(o){
    return '<div class="mention-opt" onclick="insertMention(\''+o.name+'\')">'
      +'<div class="chat-av" style="width:22px;height:22px;font-size:9px">'+(o.uid==='all'?'👥':o.uid==='dev'?'🛠':o.uid==='admin'?'👑':getInitials(o.name))+'</div>'
      +'<span>'+o.name+'</span>'
      +'</div>';
  }).join('');
  list.classList.add('open');
}
function hideMentionList(){ const l=document.getElementById('mentionList'); if(l)l.classList.remove('open'); }
function insertMention(name){
  const ta=document.getElementById('chatTa'); if(!ta)return;
  const pos=ta.selectionStart;
  const before=ta.value.slice(0,pos).replace(/@\w*$/,'');
  ta.value=before+'@'+name+' '+ta.value.slice(pos);
  ta.focus(); hideMentionList();
}
function insertAtSign(){
  const ta=document.getElementById('chatTa'); if(!ta)return;
  const pos=ta.selectionStart;
  ta.value=ta.value.slice(0,pos)+'@'+ta.value.slice(pos);
  ta.focus();
  ta.setSelectionRange(pos+1,pos+1);
  // Toon mention lijst meteen
  showMentionList('');
}


async function sendChat(){
  const ta=document.getElementById('chatTa');
  const text=ta?ta.value.trim():'';
  if(!text)return;
  ta.value=''; ta.style.height='auto'; hideMentionList();
  const{db,collection,addDoc,serverTimestamp}=window._f;
  // Detecteer mentions
  const rawMentions=[...text.matchAll(/@(\S+)/g)].map(m=>m[1].toLowerCase());
  const mentionUids=[];
  rawMentions.forEach(function(m){
    if(m==='iedereen'||m==='all') mentionUids.push('all');
    else if(m==='dev') mentionUids.push('dev');
    else if(m==='beheerder'||m==='admin') mentionUids.push('admin');
    else {
      const u=allUsers.find(x=>x.name.toLowerCase()===m||x.name.toLowerCase().startsWith(m));
      if(u&&!mentionUids.includes(u.uid)) mentionUids.push(u.uid);
    }
  });
  await addDoc(collection(db,'chat'),{
    uid:U.uid, name:U.name, role:U.role||'employee',
    text, mentions:mentionUids, type:'message',
    deleted:false, createdAt:serverTimestamp()
  });
  // Notificaties versturen
  let notifTargets=[];
  if(mentionUids.includes('all')) notifTargets=allUsers.filter(u=>u.uid!==U.uid).map(u=>u.uid);
  else {
    mentionUids.forEach(function(m){
      if(m==='dev') allUsers.filter(u=>u.role==='software').forEach(u=>{ if(!notifTargets.includes(u.uid))notifTargets.push(u.uid); });
      else if(m==='admin') allUsers.filter(u=>u.role==='admin').forEach(u=>{ if(!notifTargets.includes(u.uid))notifTargets.push(u.uid); });
      else if(!notifTargets.includes(m)) notifTargets.push(m);
    });
  }
  // Altijd admins notificeren (tenzij al in lijst)
  if(U.role!=='admin') allUsers.filter(u=>u.role==='admin').forEach(u=>{ if(!notifTargets.includes(u.uid))notifTargets.push(u.uid); });
  if(notifTargets.length) await notifyUsers(notifTargets,'💬 '+U.name+' in de chat',text,text);
  showBrowserNotif('Bericht verstuurd','Je bericht is geplaatst in de groepschat');
}

async function submitSwap(){
  const sel=document.querySelector('input[name="swapShift"]:checked');
  if(!sel){toast('Selecteer een dienst','err');return;}
  const shiftId=sel.value;
  const note=document.getElementById('swapNote')&&document.getElementById('swapNote').value||'';
  const shift=allShifts.find(s=>s.id===shiftId); if(!shift)return;
  const{db,collection,addDoc,serverTimestamp}=window._f;
  // Maak swap request aan
  const reqRef=await addDoc(collection(db,'swapRequests'),{
    requesterId:U.uid, requesterName:U.name,
    shiftId, shiftDate:shift.date, shiftStart:shift.startTime, shiftEnd:shift.endTime,
    note, status:'pending', adminApproved:false, createdAt:serverTimestamp()
  });
  // Chat bericht plaatsen
  await addDoc(collection(db,'chat'),{
    uid:U.uid, name:U.name, role:U.role||'employee',
    text:U.name+' zoekt iemand om zijn/haar dienst over te nemen'+(note?' ('+note+')':''),

async function acceptSwap(reqId,msgId){
  // Medewerker wil overnemen — admin moet nog goedkeuren
  const{db,doc,updateDoc}=window._f;
  await updateDoc(doc(db,'swapRequests',reqId),{interestedUid:U.uid,interestedName:U.name});
  await updateDoc(doc(db,'chat',msgId),{interestedName:U.name});
  const admins=allUsers.filter(u=>u.role==='admin').map(u=>u.uid);
  await notifyUsers(admins,'🔄 Iemand wil overnemen',''+U.name+' wil de dienst overnemen. Ga naar de chat om goed te keuren.',''+U.name+' wil de dienst overnemen. Open de app om goed te keuren.');
  toast('Interesse geregistreerd! De beheerder keurt het goed.','ok');
}

async function approveSwap(reqId,msgId){
  const{db,doc,getDoc,updateDoc,collection,addDoc,serverTimestamp}=window._f;
  const reqSnap=await getDoc(doc(db,'swapRequests',reqId));
  const req=reqSnap.data();
  if(!req.interestedUid){toast('Niemand heeft interesse getoond','err');return;}
  const ok=await confirm2('Goedkeuren','Dienst doorgeven aan '+req.interestedName+'?','Goedkeuren','btn-green');
  if(!ok)return;
  // Vervang werknemer in de shift
  const shiftSnap=await getDoc(doc(db,'shifts',req.shiftId));
  const shift=shiftSnap.data();
  const newWorkers=(shift.workers||[]).filter(u=>u!==req.requesterId).concat([req.interestedUid]);
  await updateDoc(doc(db,'shifts',req.shiftId),{workers:newWorkers});
  await updateDoc(doc(db,'swapRequests',reqId),{status:'accepted',adminApproved:true,acceptedBy:req.interestedUid});
  await updateDoc(doc(db,'chat',msgId),{swapStatus:'accepted',acceptedByName:req.interestedName});
  // Notificeer beide medewerkers
  await notifyUsers([req.requesterId],'✅ Dienst geruild','Je dienst op '+fmtDate(req.shiftDate)+' is overgenomen door '+req.interestedName+'.','Je dienst op '+fmtDate(req.shiftDate)+' is overgenomen door '+req.interestedName+'. De beheerder heeft het goedgekeurd.');
  await notifyUsers([req.interestedUid],'✅ Dienst overgenomen','Je hebt de dienst op '+fmtDate(req.shiftDate)+' overgenomen van '+req.requesterName+'.','Je hebt de dienst op '+fmtDate(req.shiftDate)+' overgenomen. Check je rooster!');
  showBrowserNotif('Dienst geruild','Beide medewerkers zijn genotificeerd');
  toast('Dienst goedgekeurd en doorgegeven!','ok');
}

async function rejectSwap(reqId,msgId){
  const ok=await confirm2('Afwijzen','Ruilverzoek afwijzen?','Afwijzen','btn-red');if(!ok)return;
  const{db,doc,updateDoc,getDoc}=window._f;
  const reqSnap=await getDoc(doc(db,'swapRequests',reqId));

  await updateDoc(doc(db,'swapRequests',reqId),{status:'rejected'});

  toast('Afgewezen','ok');
}

function exportShiftToCalendar(shift){
  const d=toDate(shift.date);
  const pad=n=>String(n).padStart(2,'0');
  const icsDate=(date,h,m)=>[date.getFullYear(),pad(date.getMonth()+1),pad(date.getDate()),'T',pad(h),pad(m),'00'].join('');
  const[sh,sm]=(shift.startTime||'00:00').split(':').map(Number);
  const[eh,em]=(shift.endTime||'00:00').split(':').map(Number);
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MHVwork//NL','BEGIN:VEVENT',
    'DTSTART:'+icsDate(d,sh,sm),'DTEND:'+icsDate(d,eh,em),
    'SUMMARY:Dienst MHV','DESCRIPTION:Dienst bij MHV — '+shift.startTime+' tot '+shift.endTime,
    'LOCATION:MHV','END:VEVENT','END:VCALENDAR'].join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='dienst-mhv.ics'; a.click();
  URL.revokeObjectURL(url);
  toast('Agenda bestand gedownload!','ok');
}
